function getTournamentTabs(t){
  const base=['overview'];
  if(t.format==='league') base.push('standings','fixtures');
  if(t.format==='knockout'||t.format==='double_elimination') base.push('bracket','fixtures');
  if(t.format==='group_knockout') base.push('groups','bracket','fixtures');
  // League + Knockout needs BOTH the standings (league phase) and a bracket
  // tab (knockout phase) — without 'bracket' here the knockout stage has no
  // way to be viewed as a bracket at all once it's generated, even though
  // renderBracket() already fully supports it via t.koRounds.
  if(t.format==='league_knockout') base.push('standings','bracket','fixtures');
  base.push('stats','h2h');
  return base;
}
function tabLabel(tab){
  return {overview:'Overview',fixtures:'Fixtures',standings:'Standings',bracket:'Bracket',groups:'Groups',stats:'Stats',h2h:'H2H'}[tab]||tab;
}

function renderTournamentOverview(t){
  const played=countPlayed(t), total=countTotal(t);
  let topScorer = null, topGD = null;
  const standings = getEffectiveStandings(t);
  if(standings.length>0){
    topGD = standings[0];
  }

  const settingsBadges = [];
  if(t.ptsPerWin===2) settingsBadges.push('2-pt wins');
  if(t.ptsPerWin===1) settingsBadges.push('1-pt wins');
  if(t.ptsPerDraw===0) settingsBadges.push('0-pt draws');
  if(t.tiebreaker==='h2h') settingsBadges.push('H2H tiebreaker');
  else if(t.tiebreaker==='gf') settingsBadges.push('GF tiebreaker');
  if(t.homeAdvantage===false) settingsBadges.push('No home advantage');
  const hasTwoLegRound = t.koLegs===2 || (typeof t.koLegs==='object' && t.koLegs && Object.values(t.koLegs).some(v=>v===2));
  if(hasTwoLegRound) settingsBadges.push(t.koLegs===2 ? '2-leg knockout ties' : 'Mixed 2-leg knockout ties');
  if(t.thirdPlace||t.thirdPlaceMatch) settingsBadges.push('3rd place match');
  if(t.suspensions?.filter(s=>!s.served).length){
    settingsBadges.push(`${t.suspensions.filter(s=>!s.served).length} player${t.suspensions.filter(s=>!s.served).length>1?'s':''} suspended`);
  }

  let html=`
    ${settingsBadges.length?`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;">${settingsBadges.map(b=>`<span class="pill pill-gray">${b}</span>`).join('')}</div>`:''}
    <div class="card" style="display:grid;grid-template-columns:1fr 1fr 1fr;text-align:center;gap:8px;">
      <div><div style="font-size:1.4rem;font-weight:900;color:var(--accent2);">${played}</div><div class="card-title" style="margin:0;">Played</div></div>
      <div><div style="font-size:1.4rem;font-weight:900;color:var(--text2);">${total-played}</div><div class="card-title" style="margin:0;">Remaining</div></div>
      <div><div style="font-size:1.4rem;font-weight:900;color:var(--green);">${played>0?Math.round(played/total*100):0}%</div><div class="card-title" style="margin:0;">Complete</div></div>
    </div>
    <div class="card"><div class="progress-track"><div class="progress-fill" style="width:${played>0?Math.round(played/total*100):0}%"></div></div></div>
  `;
  if(standings.length>0){
    html+=`<div class="card"><div class="card-title">Current Leader</div>
      <div style="display:flex;align-items:center;gap:10px;">
        <div style="font-size:1.5rem;">👑</div>
        <div style="flex:1;font-weight:700;">${name(standings[0].teamId)}</div>
        <div class="pill pill-blue">${standings[0].pts} pts</div>
      </div>
    </div>`;
  }

  // Suspension summary for team mode
  if(t.type==='team' && t.suspensions?.filter(s=>!s.served).length){
    html+=`<div class="card" style="border-color:rgba(239,68,68,.3);">
      <div class="card-title">🟥 Suspended for Next Match</div>
      ${t.suspensions.filter(s=>!s.served).map(s=>`
        <div style="display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--border);font-size:.82rem;">
          <span style="color:var(--red);font-size:1rem;">🟥</span>
          <span style="font-weight:600;flex:1;">${s.playerName||'Unknown Player'}</span>
          <span style="font-size:.7rem;color:var(--text3);">${name(s.teamId)}</span>
        </div>`).join('')}
    </div>`;
  }

  // Simulate all remaining button — only makes sense in simulation mode;
  // manual mode means every match needs a score typed in by hand.
  const remaining = getRemainingMatches(t);
  if(remaining.length>0 && db.settings.simulationMode!==false){
    html+=`<div style="display:flex;gap:8px;margin-bottom:12px;">
      <button class="btn btn-outline btn-full" onclick="simAllRemaining('${t.id}')">⚡ Simulate All Remaining</button>
    </div>`;
  }
  return html;
}

function getEffectiveStandings(t){
  if(t.format==='league'||t.format==='league_knockout'){
    // Re-sort using the tournament's own tiebreaker each time
    const standings = [...(t.standings||[])];
    const ptsW = t.ptsPerWin||3;
    const tb = t.tiebreaker||'gd';
    return standings.sort((a,b)=>{
      if(b.pts!==a.pts) return b.pts-a.pts;
      if(tb==='gf') return b.gf-a.gf||b.gd-a.gd;
      if(tb==='h2h'){
        const h2h=(t.matches||[]).filter(m=>m.played&&((m.homeId===a.teamId&&m.awayId===b.teamId)||(m.homeId===b.teamId&&m.awayId===a.teamId)));
        if(h2h.length){
          let aP=0,bP=0;
          h2h.forEach(m=>{const aIsHome=m.homeId===a.teamId;const aS=aIsHome?m.hScore:m.aScore,bS=aIsHome?m.aScore:m.hScore;if(aS>bS)aP+=ptsW;else if(bS>aS)bP+=ptsW;else{aP++;bP++;}});
          if(bP!==aP) return bP-aP;
        }
      }
      return b.gd-a.gd||b.gf-a.gf;
    });
  }
  return [];
}

function getRemainingMatches(t){
  const byRound = arr => [...arr].sort((a,b)=>(a.round||1)-(b.round||1));
  // Filters out a knockout bracket's final match while it's waiting on the
  // third-place match to be played first, so bulk-sim and "remaining count"
  // logic never jumps ahead of it.
  const withoutLockedFinal = arr => arr.filter(m => !isFinalLockedByThirdPlace(t, m));
  if(t.format==='league'){
    return byRound((t.matches||[]).filter(m=>!m.played));
  }
  if(t.format==='knockout'){
    const rem = withoutLockedFinal((t.rounds||[]).flat().filter(m=>!m.played&&m.homeId&&m.awayId));
    if(t.thirdPlaceMatch && !t.thirdPlaceMatch.played && t.thirdPlaceMatch.homeId && t.thirdPlaceMatch.awayId) rem.push(t.thirdPlaceMatch);
    return rem;
  }
  if(t.format==='double_elimination'){
    const w=(t.wBracket||[]).flat().filter(m=>!m.played&&m.homeId&&m.awayId);
    const l=(t.lBracket||[]).flat().filter(m=>!m.played&&m.homeId&&m.awayId);
    const gf=(t.grandFinal||[]).filter(m=>!m.played&&m.homeId&&m.awayId);
    return [...w,...l,...gf];
  }
  if(t.format==='group_knockout'){
    const gm=byRound((t.groups||[]).flatMap(g=>(g.matches||[]).filter(m=>!m.played)));
    const km=withoutLockedFinal((t.koRounds||[]).flat().filter(m=>!m.played&&m.homeId&&m.awayId));
    const rem=[...gm,...km];
    if(t.thirdPlaceMatch && !t.thirdPlaceMatch.played && t.thirdPlaceMatch.homeId && t.thirdPlaceMatch.awayId) rem.push(t.thirdPlaceMatch);
    return rem;
  }
  if(t.format==='league_knockout'){
    const lm=byRound((t.matches||[]).filter(m=>!m.played));
    const km=withoutLockedFinal((t.koRounds||[]).flat().filter(m=>!m.played&&m.homeId&&m.awayId));
    const rem=[...lm,...km];
    if(t.thirdPlaceMatch && !t.thirdPlaceMatch.played && t.thirdPlaceMatch.homeId && t.thirdPlaceMatch.awayId) rem.push(t.thirdPlaceMatch);
    return rem;
  }
  return [];
}

function simAllRemaining(tId){
  const t=db.tournaments.find(x=>x.id===tId);
  // Knockout-ness is decided per match, not per tournament format: a
  // "Groups + Knockout" tournament has group-stage matches (can draw) AND
  // a knockout bracket (can't) — koIds tracks just the latter.
  const koIds = new Set();
  if(t.format==='knockout'){
    (t.rounds||[]).flat().forEach(m=>koIds.add(m.id));
  }
  if(t.format==='double_elimination'){
    (t.wBracket||[]).flat().forEach(m=>koIds.add(m.id));
    (t.lBracket||[]).flat().forEach(m=>koIds.add(m.id));
    (t.grandFinal||[]).forEach(m=>koIds.add(m.id));
  }
  if(t.format==='group_knockout') (t.koRounds||[]).flat().forEach(m=>koIds.add(m.id));
  if(t.format==='league_knockout') (t.koRounds||[]).flat().forEach(m=>koIds.add(m.id));
  // The third place match is a knockout match (no draws) in every format that has one.
  if(t.thirdPlaceMatch) koIds.add(t.thirdPlaceMatch.id);
  // Two-leg ties: leg 1 can draw (no ET); leg 2 resolves via aggregate
  const twoLegIds = new Set(); // leg1 ids
  const leg2Ids = new Set();   // leg2 ids
  const allKORounds = (t.rounds||[]).concat(t.koRounds||[]);
  allKORounds.flat().forEach(m=>{
    if(m.legNum===1) twoLegIds.add(m.id);
    if(m.legNum===2) leg2Ids.add(m.id);
  });

  // IMPORTANT: re-fetch remaining matches on every pass instead of using one
  // static snapshot. In any knockout-style bracket, round 2+ matches start
  // with no homeId/awayId until the round before them is resolved and
  // advanceKO/advanceDEL/advanceGroupKO fill them in — so a single snapshot
  // taken before the loop starts would only ever "see" round 1, silently
  // leaving the rest of the bracket unplayed. Looping until nothing is left
  // (with a generous safety cap) correctly carries a multi-round bracket
  // all the way to a champion.
  let simulated = 0;
  let stagnantPasses = 0;
  const safetyCap = 5000;
  let lastRemainingCount = -1;
  try {
    while(simulated < safetyCap){
      const remaining = getRemainingMatches(t);
      if(!remaining.length) break;
      if(remaining.length === lastRemainingCount){
        // Nothing got resolved on the last pass (e.g. a bracket slot stuck
        // waiting on a match that can never be reached) — bail instead of
        // looping forever.
        stagnantPasses++;
        if(stagnantPasses>2) break;
      } else {
        stagnantPasses = 0;
      }
      lastRemainingCount = remaining.length;
      remaining.forEach(m=>{
        // Leg 1 of a two-leg tie: play normally (draw is a valid result)
        const isLeg1 = twoLegIds.has(m.id);
        const isLeg2 = leg2Ids.has(m.id);
        // Leg1 never goes to ET; Leg2 result is evaluated by resolveTwoLegTie (aggregate), not live ET
        const isKO = koIds.has(m.id) && !isLeg1 && !isLeg2;
        const s=initSim(m.homeId,m.awayId, isKO, tId);
        while(s.minute<90) simMinute(s);
        if(isKO && s.hScore===s.aScore){
          s.aet = true;
          s.events.unshift({min:'90+',cls:'tl-info',text:'⏱ Extra Time!'});
          while(s.minute<120) simMinute(s);
        }
        if(isKO && s.hScore===s.aScore){
          s.penalties = true;
          runPenalties(s);
          s.events.unshift({min:'FT',cls:'tl-pen',text:`🏆 ${s.penWinner==='h'?s.home.name:s.away.name} wins on penalties ${s.penH}–${s.penA}`});
        }
        applyResult(tId, m.id, s.hScore, s.aScore, {
          aet:s.aet, penalties:s.penalties, penH:s.penH||0, penA:s.penA||0, penWinner:s.penWinner,
          stats:{hShots:s.hShots,aShots:s.aShots,hSoT:s.hSoT,aSoT:s.aSoT,
                 hCorners:s.hCorners,aCorners:s.aCorners,hFouls:s.hFouls,aFouls:s.aFouls,
                 hSaves:s.hSaves,aSaves:s.aSaves,
                 hPoss:s.hPoss,aPoss:s.aPoss},
          scorerLog:s.scorerLog||[], cardLog:s.cardLog||[], events:s.events||[]
        }, null, true);
        simulated++;
      });
    }
    // Now that every match is in, do the full standings recalculation once.
    if(t.format==='league'||t.format==='league_knockout'){
      recalcStandings(t.standings, t.matches, t);
      if(t.format==='league') checkLeagueComplete(t);
    } else if(t.format==='group_knockout'){
      (t.groups||[]).forEach(g=>recalcStandings(g.standings, g.matches, t));
    }
    save(); render(); toast(`Simulated ${simulated} match${simulated===1?'':'es'}`);
  } catch(err){
    // Make sure whatever did get simulated isn't lost, and the person
    // finds out something went wrong instead of the tournament just
    // quietly stopping partway through.
    save(); render();
    toast(`⚠ Stopped after ${simulated} matches — ${err && err.message ? err.message : 'an error occurred'}`);
  }
}

function renderFixtures(t){
  let html='';
  if(t.format==='league'){
    const matches = t.matches||[];
    const roundNums = [...new Set(matches.map(m=>m.round||1))].sort((a,b)=>a-b);
    roundNums.forEach(rn=>{
      const roundMatches = matches.filter(m=>(m.round||1)===rn);
      html+=`<div class="swiss-round-title">Matchday ${rn}</div>`;
      html+=roundMatches.map(m=>matchCardHTML(m,t.id,m.played,false,null)).join('');
    });
  } else if(t.format==='knockout'){
    html += renderKOFixtures(t, t.rounds||[], true);
  } else if(t.format==='double_elimination'){
    html+=`<div class="swiss-round-title">Winners Bracket</div>`;
    (t.wBracket||[]).forEach((r,ri)=>{
      const label = roundName(ri, t.wBracket.length);
      html+=`<div style="font-size:.68rem;color:var(--text3);padding:4px 0;">${label}</div>`;
      html+=r.filter(m=>m.homeId&&m.awayId).map(m=>matchCardHTML(m,t.id,false,true)).join('');
    });
    if((t.lBracket||[]).length){
      html+=`<div class="swiss-round-title">Losers Bracket</div>`;
      (t.lBracket||[]).forEach((r,ri)=>{
        html+=`<div style="font-size:.68rem;color:var(--text3);padding:4px 0;">LB Round ${ri+1}</div>`;
        html+=r.filter(m=>m.homeId&&m.awayId).map(m=>matchCardHTML(m,t.id,false,true)).join('');
      });
    }
    if(t.grandFinal){
      const gf=t.grandFinal[0];
      if(gf.homeId&&gf.awayId){
        html+=`<div class="swiss-round-title">Grand Final</div>`;
        html+=matchCardHTML(gf,t.id,false,true);
      } else {
        html+=`<div class="swiss-round-title">Grand Final</div><div style="font-size:.72rem;color:var(--text3);text-align:center;padding:8px;">Waiting for both finalists</div>`;
      }
    }
  } else if(t.format==='group_knockout'){
    (t.groups||[]).forEach(g=>{
      html+=`<div class="swiss-round-title">${g.name}</div>`;
      const roundNums = [...new Set(g.matches.map(m=>m.round||1))].sort((a,b)=>a-b);
      roundNums.forEach(rn=>{
        html+=`<div style="font-size:.68rem;color:var(--text3);padding:4px 0;">Matchday ${rn}</div>`;
        html+=g.matches.filter(m=>(m.round||1)===rn).map(m=>matchCardHTML(m,t.id,m.played,false,g.id)).join('');
      });
    });
    if(t.koRounds){
      html+=`<div class="swiss-round-title">Knockout Stage</div>`;
      html += renderKOFixtures(t, t.koRounds||[], true);
    }
    const allGroupsDone=(t.groups||[]).every(g=>g.matches.every(m=>m.played));
    if(allGroupsDone&&!t.koRounds){
      html+=`<button class="btn btn-primary btn-full" style="margin-top:8px;" onclick="generateKnockout('${t.id}')">Generate Knockout Stage</button>`;
    }
  } else if(t.format==='league_knockout'){
    const matches = t.matches||[];
    const roundNums = [...new Set(matches.map(m=>m.round||1))].sort((a,b)=>a-b);
    html+=`<div class="swiss-round-title">League Phase</div>`;
    roundNums.forEach(rn=>{
      const roundMatches = matches.filter(m=>(m.round||1)===rn);
      html+=`<div style="font-size:.68rem;color:var(--text3);padding:4px 0;">Matchday ${rn}</div>`;
      html+=roundMatches.map(m=>matchCardHTML(m,t.id,m.played,false,null)).join('');
    });
    const allLeagueDone = matches.length>0 && matches.every(m=>m.played);
    if(allLeagueDone && !t.koRounds){
      html+=`<button class="btn btn-primary btn-full" style="margin-top:8px;" onclick="generateLeagueKnockout('${t.id}')">Generate Knockout Stage (Top ${t.lkoQualSpots||4})</button>`;
    }
    if(t.koRounds){
      html+=`<div class="swiss-round-title">Knockout Stage</div>`;
      html += renderKOFixtures(t, t.koRounds||[], true);
    }
  }
  return html||'<div class="empty-state"><div>No fixtures generated yet.</div></div>';
}

// Renders KO rounds in fixtures view, inserting 3rd place BEFORE the final rounds
function renderKOFixtures(t, rounds, isKO=true){
  let html = '';
  const stageMap = mapKORoundLabels(rounds);

  // Render all rounds before the final
  rounds.forEach((r, ri)=>{
    if(stageMap[ri].isFinalRound) return; // skip here, rendered below after 3rd place
    const {logicalIdx, totalLogical, legNum} = stageMap[ri];
    const legLabel = legNum ? ` — Leg ${legNum}` : '';
    html+=`<div class="swiss-round-title">${roundName(logicalIdx, totalLogical)}${legLabel}</div>`;
    html+=r.filter(m=>m.homeId&&m.awayId).map(m=>matchCardHTMLWithAgg(m,t,isKO)).join('');
  });

  // Third place BEFORE the final
  if(t.thirdPlaceMatch){
    const tp = t.thirdPlaceMatch;
    if(tp.homeId && tp.awayId){
      html+=`<div class="swiss-round-title">🥉 Third Place <span style="text-transform:none;font-weight:500;color:var(--text3);">(played before the Final)</span></div>`;
      html+=matchCardHTML(tp, t.id, tp.played, true, null);
    }
  }

  // Final round(s)
  rounds.forEach((r, ri)=>{
    if(!stageMap[ri].isFinalRound) return;
    const {logicalIdx, totalLogical, legNum} = stageMap[ri];
    const legLabel = legNum ? ` — Leg ${legNum}` : '';
    html+=`<div class="swiss-round-title">${roundName(logicalIdx, totalLogical)}${legLabel}</div>`;
    html+=r.filter(m=>m.homeId&&m.awayId).map(m=>matchCardHTMLWithAgg(m,t,isKO)).join('');
  });

  return html;
}

// Variant of matchCardHTML that also shows aggregate score for two-leg KO matches
function matchCardHTMLWithAgg(m, t, isKO=true){
  const tId = t.id;
  const allRounds = (t.rounds||[]).concat(t.koRounds||[]);
  let aggHtml = '';
  if(m.legNum===2 && m.leg1Id){
    const leg1 = allRounds.flat().find(x=>x.id===m.leg1Id);
    if(leg1 && leg1.played){
      const teamA = leg1.homeId;
      const teamB = leg1.awayId;
      if(m.played){
        // Leg 2 played: show the final aggregate and who advances.
        const aggA = leg1.hScore + m.aScore;
        const aggB = leg1.aScore + m.hScore;
        let aggNote = `Agg: ${name(teamA)} ${aggA}–${aggB} ${name(teamB)}`;
        // m.penH/m.penA are stored in m.homeId/m.awayId orientation, and leg 2
        // flips home/away vs leg 1 (m.homeId===teamB, m.awayId===teamA) — so to
        // print "Pens" in the same teamA-then-teamB order as the agg score above,
        // teamA's count is m.penA and teamB's is m.penH.
        if(m.penalties) aggNote += ` · Pens ${m.penA}–${m.penH}`;
        const winner = m.winner ? name(m.winner) : (aggA>aggB?name(teamA):aggB>aggA?name(teamB):null);
        if(winner) aggNote += ` · ${winner} advances`;
        aggHtml = `<div style="font-size:.68rem;color:var(--gold);text-align:center;margin-top:4px;font-weight:700;">${aggNote}</div>`;
      } else {
        // Leg 2 not played yet: show leg 1's result so it's clear what
        // leg 2 needs to do (e.g. "Leg 1: Team A 6–0 Team B").
        aggHtml = `<div style="font-size:.68rem;color:var(--text3);text-align:center;margin-top:4px;">Leg 1: ${name(teamA)} ${leg1.hScore}–${leg1.aScore} ${name(teamB)}</div>`;
      }
    }
  }
  // isKO here just flags "this is a knockout-stage match" for locking/
  // third-place purposes — triggerSim derives the correct leg-aware
  // extra-time behavior itself from m.legNum, so it's safe to pass through
  // unchanged for both legs.
  const baseHtml = matchCardHTML(m, tId, m.played, isKO, null);
  if(aggHtml) return baseHtml.slice(0,-6) + aggHtml + baseHtml.slice(-6);
  return baseHtml;
}

// Returns true if `m` is allowed to be played right now — i.e. every match
// with an earlier round number in the same competition stage (league table
// or specific group) has already been played. Knockout-style formats don't
// need this: their later rounds simply have no opponents assigned until the
// earlier round finishes, so they're already sequential by construction.
function isMatchPlayable(t, m, groupId=null){
  if(m.round===undefined || m.round===null) return true;
  let pool;
  if(groupId){
    const g=(t.groups||[]).find(x=>x.id===groupId);
    pool = g ? g.matches : [];
  } else if(t.format==='league'||t.format==='league_knockout'){
    pool = t.matches||[];
  } else {
    pool = t.matches||[];
  }
  return pool.every(x => (x.round||1) >= m.round || x.played);
}

// Returns true if `m` is part of the championship final tie of a knockout
// bracket. For single-leg knockouts that's just the last round. For 2-leg
// ties the final spans the LAST TWO rounds (leg 1 then leg 2), and both
// legs need to be held back — there'd be no point locking only the second
// leg if the first leg of the final could still be played early.
function isFinalMatch(t, m){
  const rounds = t.koRounds || t.rounds;
  if(!rounds || !rounds.length) return false;
  const lastRound = rounds[rounds.length-1];
  if(lastRound.some(x=>x.id===m.id)) return true;
  if(rounds.length>=2){
    const secondToLast = rounds[rounds.length-2];
    // Only counts as part of the final if these two rounds are actually a
    // leg1/leg2 pair (shared tieId), not two unrelated single-leg rounds.
    if(secondToLast.some(x=>x.id===m.id) && m.tieId && lastRound.some(x=>x.tieId===m.tieId)) return true;
  }
  return false;
}

// A tournament's third-place match is meant to be played BEFORE the final,
// mirroring real tournaments (e.g. the World Cup plays 3rd-place before the
// final). This returns true if `m` is that final and the third-place match
// exists, has both its participants set, and hasn't been played yet.
function isFinalLockedByThirdPlace(t, m){
  if(!t.thirdPlaceMatch) return false;
  const tp = t.thirdPlaceMatch;
  if(tp.played) return false; // already done, final is free to play
  if(!tp.homeId || !tp.awayId) return false; // not ready yet, nothing to block on
  return isFinalMatch(t, m);
}

function roundName(ri, total){
  const remaining = total - ri;
  if(remaining===1) return 'Final';
  if(remaining===2) return 'Semi-Finals';
  if(remaining===3) return 'Quarter-Finals';
  return `Round of ${Math.pow(2,remaining)}`;
}

// Maps every array index of a koRounds/rounds array to its real stage
// label (e.g. "Quarter-Finals", "Quarter-Finals Leg 2"). Derives this from
// the matches' own legNum rather than from koLegs's shape (number vs.
// per-round object), since a tournament can mix 1-leg and 2-leg rounds and
// koLegs-based array-length math breaks the moment legs aren't uniform.
function mapKORoundLabels(rounds){
  if(!rounds || !rounds.length) return [];
  const totalLogical = rounds.reduce((n,r)=>{
    const isLeg2 = r.length>0 && r.every(m=>m.legNum===2);
    return n + (isLeg2 ? 0 : 1);
  }, 0);
  let logicalIdx = -1;
  return rounds.map(r=>{
    const isLeg2 = r.length>0 && r.every(m=>m.legNum===2);
    if(!isLeg2) logicalIdx++;
    const legNum = isLeg2 ? 2 : (r.length>0 && r.every(m=>m.legNum===1) ? 1 : null);
    return { logicalIdx, totalLogical, legNum, isFinalRound: logicalIdx===totalLogical-1 };
  });
}

function matchCardHTML(m, tId, showResult=false, isKO=false, groupId=null){
  const h=db.participants.find(p=>p.id===m.homeId);
  const a=db.participants.find(p=>p.id===m.awayId);
  if(!h||!a) return '';
  const t=db.tournaments.find(x=>x.id===tId);
  const pred = predictMatch(m.homeId,m.awayId,tId);
  const scoreLabel = m.played
    ? (m.penalties
        ? `${m.hScore}–${m.aScore} <span style="font-size:.65rem;color:var(--text3);">${m.aet?'AET ':''}(Pens)</span>`
        : (m.aet ? `${m.hScore}–${m.aScore} <span style="font-size:.65rem;color:var(--text3);">AET</span>` : `${m.hScore}–${m.aScore}`))
    : 'vs';
  const onSim = groupId
    ? `triggerSim('${tId}','${m.id}',${isKO},'${groupId}')`
    : `triggerSim('${tId}','${m.id}',${isKO})`;
  const lockedByThirdPlace = isKO && !m.played && isFinalLockedByThirdPlace(t, m);
  // Leg 2 is blocked until leg 1 is played
  const allMatchRounds = (t&&((t.rounds||[]).concat(t.koRounds||[]))) || [];
  const leg1ForThisLeg2 = (m.legNum===2 && m.leg1Id) ? allMatchRounds.flat().find(x=>x.id===m.leg1Id) : null;
  const lockedByLeg1 = !!leg1ForThisLeg2 && !leg1ForThisLeg2.played;
  const playable = !m.played && (isKO ? (!lockedByThirdPlace && !lockedByLeg1) : isMatchPlayable(t, m, groupId));
  const onRecap = m.played ? `openRecap('${tId}','${m.id}','${groupId||''}')` : null;

  // Show suspended players for upcoming team-mode matches
  let suspensionHtml = '';
  if(!m.played && t.type==='team' && t.suspensions?.length){
    const hSusp = t.suspensions.filter(s=>s.teamId===m.homeId&&!s.served);
    const aSusp = t.suspensions.filter(s=>s.teamId===m.awayId&&!s.served);
    const lines = [];
    if(hSusp.length) lines.push(`<span style="color:var(--red);">🟥 ${h.name}: ${hSusp.map(s=>s.playerName||'Player').join(', ')} suspended</span>`);
    if(aSusp.length) lines.push(`<span style="color:var(--red);">🟥 ${a.name}: ${aSusp.map(s=>s.playerName||'Player').join(', ')} suspended</span>`);
    if(lines.length) suspensionHtml = `<div style="font-size:.68rem;padding:4px 0;display:flex;flex-direction:column;gap:2px;">${lines.join('')}</div>`;
  }

  return `<div class="match-card ${m.played?'played':''}" ${onRecap?`onclick="${onRecap}" style="cursor:pointer;"`:''}>
    ${!m.played?`<div class="match-prediction">
      ${h.name} ${pred.hWin}% · Draw ${pred.draw}% · ${a.name} ${pred.aWin}%
      <div class="pred-bar"><div class="pred-h" style="width:${pred.hWin}%"></div><div class="pred-d" style="width:${pred.draw}%"></div><div class="pred-a" style="width:${pred.aWin}%"></div></div>
    </div>`:''}
    <div class="match-body">
      <div class="match-team-name">${h.name}</div>
      <div class="match-score-box">${scoreLabel}</div>
      <div class="match-team-name tar">${a.name}</div>
    </div>
    ${suspensionHtml}
    ${m.played?`<div style="font-size:.65rem;color:var(--text3);text-align:center;margin-top:6px;">Tap for match recap ›</div>`:''}
    ${!m.played?`<div class="match-footer">
      ${playable
        ? `<button class="btn btn-outline btn-sm btn-full" onclick="${onSim}">${db.settings.simulationMode!==false?'▶ Simulate':'✎ Enter Result'}</button>`
        : `<button class="btn btn-outline btn-sm btn-full" disabled style="opacity:.45;cursor:not-allowed;" title="${lockedByThirdPlace?'Play the third place match first':lockedByLeg1?'Play Leg 1 first':'Finish earlier matchdays first'}">🔒 ${lockedByThirdPlace?'Play 3rd place match first':lockedByLeg1?'Play Leg 1 first':'Locked — earlier matchday pending'}</button>`}
    </div>`:''}
  </div>`;
}

// Locates a match by id across every bracket/group/round shape the app
// supports. Shared by the recap modal, simulation trigger, and result
// application so there's exactly one lookup path to keep in sync.
function findMatch(tId, matchId, groupId=null){
  const t=db.tournaments.find(x=>x.id===tId);
  if(!t) return {t:null, m:null};
  let m;
  if(groupId){ m=(t.groups||[]).find(g=>g.id===groupId)?.matches?.find(x=>x.id===matchId); }
  else if(t.format==='league'||t.format==='league_knockout') m=(t.matches||[]).find(x=>x.id===matchId)||(t.koRounds||[]).flat().find(x=>x.id===matchId);
  else m=(t.rounds||[]).flat().find(x=>x.id===matchId)||(t.koRounds||[]).flat().find(x=>x.id===matchId)||(t.wBracket||[]).flat().find(x=>x.id===matchId)||(t.lBracket||[]).flat().find(x=>x.id===matchId)||(t.grandFinal||[]).find(x=>x.id===matchId);
  // Check third place match
  if(!m && t.thirdPlaceMatch && t.thirdPlaceMatch.id===matchId) m=t.thirdPlaceMatch;
  return {t, m};
}

/* =====================================================================
   MATCH RECAP MODAL
   ===================================================================== */
function openRecap(tId, matchId, groupId=''){
  const {t, m} = findMatch(tId, matchId, groupId||null);
  if(!m || !m.played) return;
  const h=db.participants.find(p=>p.id===m.homeId);
  const a=db.participants.find(p=>p.id===m.awayId);
  if(!h||!a) return;
  renderRecapModal(m, h, a, t);
}
function openFriendlyRecap(friendlyId){
  const f = db.friendlies.find(x=>x.id===friendlyId);
  if(!f || !f.played) return;
  const h=db.participants.find(p=>p.id===f.homeId);
  const a=db.participants.find(p=>p.id===f.awayId);
  if(!h||!a) return;
  // Friendlies use the exact same match-shape (hScore/aScore/aet/penalties/
  // stats/events) as a tournament match, so the same recap renderer works
  // unchanged — a friendly is just a match with no tournament attached.
  renderRecapModal(f, h, a, {type:h.type});
}
function renderRecapModal(m, h, a, t){
  const scoreLabel = m.penalties
    ? `${m.hScore}–${m.aScore} ${m.aet?'AET ':''}(Pens)`
    : (m.aet ? `${m.hScore}–${m.aScore} AET` : `${m.hScore}–${m.aScore}`);
  const penNote = m.penalties ? `<div style="text-align:center;font-size:.75rem;color:var(--gold);margin-top:4px;">🏆 ${m.winner===h.id?h.name:a.name} wins on penalties ${m.penH}–${m.penA}</div>` : '';

  // Build a clean event-by-event recap from the saved timeline. Goalkeeper
  // saves are a stats-only number (shown further down) — they don't get
  // their own timeline entries since "saved by the keeper" isn't really a
  // discrete narrated moment the way a goal or card is.
  const events = (m.events||[]).slice().reverse(); // sim stores newest-first; recap reads oldest-first
  const timelineHtml = events.length
    ? events.map(e=>`<div class="tl-item"><div class="tl-min">${e.min}${typeof e.min==='number'?"'":''}</div><div class="${e.cls}">${e.text}</div></div>`).join('')
    : `<div style="padding:14px;text-align:center;color:var(--text3);font-size:.8rem;">No detailed event log was saved for this match.</div>`;

  const statsHtml = m.stats ? `
    <div class="card-title" style="margin-top:14px;">Match Stats</div>
    <div style="font-size:.82rem;">
      ${recapStatRow('Possession', m.stats.hPoss+'%', m.stats.aPoss+'%')}
      ${recapStatRow('Shots', m.stats.hShots, m.stats.aShots)}
      ${recapStatRow('Shots on Target', m.stats.hSoT, m.stats.aSoT)}
      ${t&&t.type!=='player'?recapStatRow('Goalkeeper Saves', m.stats.hSaves ?? 0, m.stats.aSaves ?? 0):''}
      ${t&&t.type!=='player'?recapStatRow('Corners', m.stats.hCorners, m.stats.aCorners):''}
      ${recapStatRow('Fouls', m.stats.hFouls, m.stats.aFouls)}
    </div>` : '';

  const html = `
    ${m.label?`<div style="font-size:.72rem;font-weight:700;color:var(--accent2);text-transform:uppercase;letter-spacing:.05em;text-align:center;margin-bottom:8px;">${m.label}</div>`:''}
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
      <div style="flex:1;"><div style="font-weight:700;font-size:.92rem;">${h.name}</div></div>
      <div class="match-score-box" style="font-size:1.1rem;">${scoreLabel}</div>
      <div style="flex:1;text-align:right;"><div style="font-weight:700;font-size:.92rem;">${a.name}</div></div>
    </div>
    ${penNote}
    <div class="card-title" style="margin-top:14px;">Match Recap</div>
    <div class="timeline-wrap" style="max-height:320px;">${timelineHtml}</div>
    ${statsHtml}
  `;
  document.getElementById('recap-body').innerHTML = html;
  document.getElementById('recap-modal').classList.remove('hidden');
}
function recapStatRow(label, hVal, aVal){
  return `<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border);">
    <div style="flex:1;text-align:right;font-weight:700;">${hVal}</div>
    <div style="flex:0 0 110px;text-align:center;font-size:.68rem;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;">${label}</div>
    <div style="flex:1;text-align:left;font-weight:700;">${aVal}</div>
  </div>`;
}
function closeRecap(){
  document.getElementById('recap-modal').classList.add('hidden');
}


function triggerSim(tId, matchId, isKO=false, groupId=null){
  const t=db.tournaments.find(x=>x.id===tId);
  let m;
  if(groupId){ m=(t.groups||[]).find(g=>g.id===groupId)?.matches?.find(x=>x.id===matchId); }
  else if(t.format==='league'||t.format==='league_knockout') m=(t.matches||[]).find(x=>x.id===matchId)||(t.koRounds||[]).flat().find(x=>x.id===matchId);
  else m=(t.rounds||[]).flat().find(x=>x.id===matchId)||(t.koRounds||[]).flat().find(x=>x.id===matchId)||(t.wBracket||[]).flat().find(x=>x.id===matchId)||(t.lBracket||[]).flat().find(x=>x.id===matchId)||(t.grandFinal||[]).find(x=>x.id===matchId);
  if(!m && t.thirdPlaceMatch && t.thirdPlaceMatch.id===matchId) m=t.thirdPlaceMatch;
  if(!m) return;
  if(!isKO && !isMatchPlayable(t, m, groupId)){ toast('Finish earlier matchdays first'); render(); return; }
  if(isKO && isFinalLockedByThirdPlace(t, m)){ toast('Play the third place match first'); render(); return; }
  // Leg 1 of a 2-leg tie: check leg 2 hasn't been simmed (shouldn't happen) and block leg 2 if leg 1 not done
  let legContext = null;
  if(m.legNum===2){
    const allRounds=(t.rounds||[]).concat(t.koRounds||[]);
    const leg1=allRounds.flat().find(x=>x.id===m.leg1Id);
    if(leg1 && !leg1.played){ toast('Play Leg 1 first'); render(); return; }
    if(leg1){
      // leg1.homeId/awayId are leg2's awayId/homeId (legs flip home/away),
      // so leg1's "home score" corresponds to leg2's current away side.
      legContext = { leg1HomeScore: leg1.hScore, leg1AwayScore: leg1.aScore };
    }
  }
  // Leg 1 of a 2-leg tie never goes to live extra time/penalties — the tie
  // isn't decided after just one leg, so a 90-minute draw in leg 1 is a
  // perfectly normal result, not something that needs deciding yet.
  // Leg 2 DOES run through the live knockout engine: once leg 2 hits the
  // 90th minute, isSimTied() checks the AGGREGATE (leg 1's carried-over
  // score + leg 2's live score, via legContext) rather than leg 2's own
  // score alone, so extra time/penalties only kick in when the tie is
  // actually level after both legs — and the person watches it happen live
  // instead of the bracket just updating after they close the modal.
  const simAsKO = isKO && m.legNum!==1;
  const playFn = db.settings.simulationMode!==false ? launchLive : openManualEntry;
  playFn(m.homeId,m.awayId,simAsKO,tId,(hS,aS,extra)=>{
    applyResult(tId,matchId,hS,aS,extra,groupId);
    save(); render();
  }, legContext);
}

function applyResult(tId, matchId, hS, aS, extra={}, groupId=null, deferSave=false){
  const t=db.tournaments.find(x=>x.id===tId);
  let m;
  if(groupId){ m=(t.groups||[]).find(g=>g.id===groupId)?.matches?.find(x=>x.id===matchId); }
  else if(t.format==='league') m=(t.matches||[]).find(x=>x.id===matchId);
  else if(t.format==='league_knockout'){
    m=(t.matches||[]).find(x=>x.id===matchId)||(t.koRounds||[]).flat().find(x=>x.id===matchId);
    if(!m && t.thirdPlaceMatch && t.thirdPlaceMatch.id===matchId) m=t.thirdPlaceMatch;
  }
  else if(t.format==='group_knockout'){
    for(const g of (t.groups||[])){
      m = (g.matches||[]).find(x=>x.id===matchId);
      if(m){ groupId = g.id; break; }
    }
    if(!m) m=(t.koRounds||[]).flat().find(x=>x.id===matchId);
    if(!m && t.thirdPlaceMatch && t.thirdPlaceMatch.id===matchId) m=t.thirdPlaceMatch;
  }
  else{
    m=(t.rounds||[]).flat().find(x=>x.id===matchId)||(t.koRounds||[]).flat().find(x=>x.id===matchId)||(t.wBracket||[]).flat().find(x=>x.id===matchId)||(t.lBracket||[]).flat().find(x=>x.id===matchId)||(t.grandFinal||[]).find(x=>x.id===matchId);
    // Third place match
    if(!m && t.thirdPlaceMatch && t.thirdPlaceMatch.id===matchId) m=t.thirdPlaceMatch;
  }
  if(!m) return;

  m.played=true; m.hScore=hS; m.aScore=aS;
  m.aet=extra.aet||false; m.penalties=extra.penalties||false;
  m.penH=extra.penH||0; m.penA=extra.penA||0;
  m.stats=extra.stats||null;
  m.scorers=extra.scorerLog||[];
  m.cards=extra.cardLog||[];
  m.events=extra.events||[];
  m.playedAt=Date.now();

  // Mark any pending suspensions for players on either team as served now
  // that they've sat out this match (1-match ban for a red card).
  if(t.type==='team' && t.suspensions?.length){
    t.suspensions.forEach(s=>{
      if(!s.served && (s.teamId===m.homeId||s.teamId===m.awayId)){
        s.served=true;
      }
    });
  }

  // Determine winner for KO. Two-leg ties (leg 2) are always resolved in
  // resolveTwoLegTie (called from advanceKO/advanceGroupKO right below),
  // never here — even though leg 2 can now go to live penalties itself,
  // resolveTwoLegTie is what reuses that live shootout result and is the
  // single source of truth for who actually advances on aggregate.
  if(extra.penalties && !(m.tieId && m.legNum===2)){
    m.winner=extra.penWinner==='h'?m.homeId:m.awayId;
    m.loser=extra.penWinner==='h'?m.awayId:m.homeId;
  } else if(!extra.penalties && (!m.tieId || m.legNum!==2)) {
    // Single-leg or first leg of a two-legged tie
    m.winner=hS>aS?m.homeId:aS>hS?m.awayId:null;
    m.loser=hS>aS?m.awayId:aS>hS?m.homeId:null;
  }
  // For two-leg leg 2: winner/loser set inside resolveTwoLegTie (called from advanceKO)

  // Update participant + player stats
  updateParticipantStats(m.homeId,m.awayId,hS,aS,m.scorers,m.cards);

  // Red card suspensions (team mode only): any player who received a straight
  // red or a 2nd yellow in this match is suspended for the next match.
  // We store suspended player IDs on the tournament so they can be shown.
  if(t.type==='team'){
    (m.cards||[]).forEach(c=>{
      if(c.type==='red' && c.playerId){
        if(!t.suspensions) t.suspensions=[];
        // Avoid duplicate entries for the same player in the same match
        if(!t.suspensions.some(s=>s.playerId===c.playerId && s.fromMatchId===m.id)){
          t.suspensions.push({playerId:c.playerId, playerName:c.playerName, teamId:c.team==='h'?m.homeId:m.awayId, fromMatchId:m.id, served:false});
        }
      }
    });
  }

  // Update standings for league / groups. When bulk-simulating (deferSave),
  // the caller recalculates standings once at the end instead of after
  // every single match — recalculating from scratch hundreds of times in a
  // tight loop was a real source of the "Simulate All" slowdowns/stalls on
  // larger tournaments.
  if(!deferSave){
    if(t.format==='league'||t.format==='league_knockout'){
      recalcStandings(t.standings, t.matches, t);
      if(t.format==='league') checkLeagueComplete(t);
    } else if(groupId){
      const g=t.groups.find(x=>x.id===groupId);
      if(g) recalcStandings(g.standings, g.matches, t);
    }
  }

  // Advance knockout. The third place match is a dead end — it never feeds
  // into another round — so for every format we just record its winner
  // directly instead of running it through the bracket-advancement logic.
  const isThirdPlace = t.thirdPlaceMatch && t.thirdPlaceMatch.id===matchId;
  if(isThirdPlace){
    if(m.winner) t.thirdPlaceMatch.winner=m.winner;
  } else if(t.format==='knockout'){
    advanceKO(t, matchId);
  } else if(t.format==='group_knockout'&&t.koRounds){
    advanceGroupKO(t, matchId);
  } else if(t.format==='league_knockout'&&t.koRounds){
    advanceGroupKO(t, matchId);
  } else if(t.format==='double_elimination'){
    advanceDEL(t, matchId);
  }

  if(!deferSave) save();
}


// Crowns a champion for a league once every match has been played
// (standings is already sorted, so the top team wins).
function checkLeagueComplete(t){
  if(t.format!=='league') return;
  if(t.champion) return; // already crowned, nothing to do
  const matches = t.matches||[];
  if(!matches.length) return;
  const allPlayed = matches.every(m=>m.played);
  if(allPlayed && t.standings && t.standings.length){
    t.champion = t.standings[0].teamId;
  }
}

function recalcStandings(standings, matches, t){
  const ptsW = (t&&t.ptsPerWin) ? t.ptsPerWin : 3;
  const ptsD = (t&&t.ptsPerDraw!==undefined) ? t.ptsPerDraw : 1;
  const tb = (t&&t.tiebreaker) ? t.tiebreaker : 'gd';
  standings.forEach(s=>{s.p=0;s.w=0;s.d=0;s.l=0;s.gf=0;s.ga=0;s.gd=0;s.pts=0;s.cs=0;});
  matches.filter(m=>m.played).forEach(m=>{
    const h=standings.find(s=>s.teamId===m.homeId);
    const a=standings.find(s=>s.teamId===m.awayId);
    if(!h||!a) return;
    h.p++;a.p++;
    h.gf+=m.hScore;h.ga+=m.aScore;
    a.gf+=m.aScore;a.ga+=m.hScore;
    if(m.hScore>m.aScore){h.w++;h.pts+=ptsW;a.l++;}
    else if(m.hScore<m.aScore){a.w++;a.pts+=ptsW;h.l++;}
    else{h.d++;a.d++;h.pts+=ptsD;a.pts+=ptsD;}
    h.gd=h.gf-h.ga;a.gd=a.gf-a.ga;
    if(m.aScore===0) h.cs++;
    if(m.hScore===0) a.cs++;
  });
  // Sort by tiebreaker setting
  standings.sort((a,b)=>{
    if(b.pts!==a.pts) return b.pts-a.pts;
    if(tb==='gf') return b.gf-a.gf||b.gd-a.gd;
    if(tb==='h2h'){
      // Head-to-head: find direct match(es) between these two
      const h2h = matches.filter(m=>m.played&&((m.homeId===a.teamId&&m.awayId===b.teamId)||(m.homeId===b.teamId&&m.awayId===a.teamId)));
      if(h2h.length){
        let aH2HPts=0,bH2HPts=0;
        h2h.forEach(m=>{
          const aIsHome=m.homeId===a.teamId;
          const aS=aIsHome?m.hScore:m.aScore, bS=aIsHome?m.aScore:m.hScore;
          if(aS>bS) aH2HPts+=ptsW; else if(bS>aS) bH2HPts+=ptsW; else {aH2HPts+=ptsD;bH2HPts+=ptsD;}
        });
        if(bH2HPts!==aH2HPts) return bH2HPts-aH2HPts;
      }
      return b.gd-a.gd||b.gf-a.gf;
    }
    // default: gd
    return b.gd-a.gd||b.gf-a.gf;
  });
}

// Resolves a two-leg knockout tie. Called after leg 2 is played.
// Returns {winner, loser} based on aggregate score. If level on aggregate,
// away goals are NOT used (removed per request) — goes straight to penalties.
//
// IMPORTANT — home/away orientation: leg 2 flips home/away relative to leg 1
// (leg2.homeId === leg1.awayId, leg2.awayId === leg1.homeId). Every other
// place in the app that reads m.penH/m.penA (the bracket view, the recap
// modal, the aggregate note) treats penH as "the penalty score of
// m.homeId" and penA as "the penalty score of m.awayId" — exactly like a
// normal single-leg match. So whatever we store here MUST be keyed to
// leg2Match.homeId/awayId, NOT to leg1's home/away (teamA/teamB) — storing
// it the other way round silently swaps the two teams' penalty scores in
// every screen that displays this tie.
function resolveTwoLegTie(rounds, leg2Match){
  // Find the matching leg 1
  const leg1 = rounds.flat().find(m=>m.id===leg2Match.leg1Id);
  if(!leg1) return null; // shouldn't happen
  // Leg 1: homeId scored hScore, awayId scored aScore
  // Leg 2: homeId/awayId are flipped (leg2.homeId = leg1.awayId)
  const teamA = leg1.homeId; // original home team (= leg2Match.awayId)
  const teamB = leg1.awayId; // original away team (= leg2Match.homeId)
  const aggA = leg1.hScore + leg2Match.aScore; // teamA's goals: scored at home in leg1 + scored away in leg2
  const aggB = leg1.aScore + leg2Match.hScore; // teamB's goals: scored away in leg1 + scored at home in leg2
  if(aggA > aggB) return {winner:teamA, loser:teamB, aggA, aggB, method:'agg'};
  if(aggB > aggA) return {winner:teamB, loser:teamA, aggA, aggB, method:'agg'};
  // Tied on aggregate. If the live simulation already ran the shootout
  // (it does this for leg 2 once aggregate scores are level — see
  // launchLive/tickLive), reuse that result instead of rolling a brand new
  // one here, so the shootout the person just watched is the one that
  // actually decides the tie. Only fall back to a blind re-roll (e.g. for
  // "Simulate All", which has no live modal) if nothing was pre-rolled.
  let penH, penA; // in leg2Match.homeId / leg2Match.awayId orientation
  if(leg2Match.penalties && (leg2Match.penH || leg2Match.penA)){
    penH = leg2Match.penH; penA = leg2Match.penA;
  } else {
    // quickPenalties' h/a sides are arbitrary (a fresh coin-flip shootout,
    // unconnected to either leg's actual home/away) so they can be assigned
    // straight to leg2Match's home/away with no translation needed.
    const penResult = quickPenalties();
    penH = penResult.penH; penA = penResult.penA;
  }
  const teamBWonPens = penH > penA; // teamB === leg2Match.homeId
  const winner = teamBWonPens ? teamB : teamA;
  const loser = teamBWonPens ? teamA : teamB;
  // Store penalty result on leg2 match, keyed to leg2Match's own home/away
  leg2Match.penalties = true;
  leg2Match.penH = penH;
  leg2Match.penA = penA;
  leg2Match.tieAggA = aggA; leg2Match.tieAggB = aggB;
  return {winner, loser, aggA, aggB, method:'penalties', penH, penA};
}

function quickPenalties(){
  let hPens=0, aPens=0, round=0;
  while(round<5||(hPens===aPens)){
    round++;
    if(Math.random()<0.75) hPens++;
    if(Math.random()<0.75) aPens++;
    if(round>=5 && hPens!==aPens) break;
    if(round>20) break;
  }
  return {h:hPens>aPens, penH:hPens, penA:aPens};
}

function advanceKO(t, matchId){
  const rounds = t.rounds;
  const stageMap = mapKORoundLabels(rounds);
  // Two-leg tie: only resolve after leg 2 is played
  const allMatches = rounds.flat();
  const thisMatch = allMatches.find(m=>m.id===matchId);
  if(thisMatch && thisMatch.legNum===2){
    // This is the second leg — resolve the tie
    const result = resolveTwoLegTie(rounds, thisMatch);
    if(!result) return;
    thisMatch.winner = result.winner;
    thisMatch.loser = result.loser;
    // Also set on leg 1 for reference
    const leg1 = allMatches.find(m=>m.id===thisMatch.leg1Id);
    if(leg1){ leg1.tieWinner=result.winner; }
    // Find the pair's index to advance correctly
    let leg2RoundIdx=-1, leg2MatchIdx=-1;
    rounds.forEach((r,ri)=>{ const mi=r.findIndex(m=>m.id===matchId); if(mi!==-1){leg2RoundIdx=ri;leg2MatchIdx=mi;} });
    if(leg2RoundIdx===-1) return;
    const nextLeg1RoundIdx = leg2RoundIdx+1;
    const nextLeg1Round = rounds[nextLeg1RoundIdx];
    // The semi-final round is whichever round's winner lands directly in
    // the final — i.e. the round we're advancing INTO is the final round.
    // Derived from the stage map (legNum-aware) rather than rounds.length-2,
    // since that array-length math breaks the moment legs are mixed
    // (e.g. a 2-leg semi feeding a single-leg final).
    const isSemiFinalRound = nextLeg1Round && stageMap[nextLeg1RoundIdx] && stageMap[nextLeg1RoundIdx].isFinalRound;
    if(nextLeg1Round){
      const nextMatch = nextLeg1Round[Math.floor(leg2MatchIdx/2)];
      if(nextMatch){
        if(leg2MatchIdx%2===0) nextMatch.homeId=result.winner;
        else nextMatch.awayId=result.winner;
        // Set away team for its leg2 (leg2's homeId is flipped)
        const nextLeg2Round = rounds[nextLeg1RoundIdx+1];
        if(nextLeg2Round){
          const nextLeg2Match = nextLeg2Round[Math.floor(leg2MatchIdx/2)];
          if(nextLeg2Match){
            if(leg2MatchIdx%2===0) nextLeg2Match.awayId=result.winner;
            else nextLeg2Match.homeId=result.winner;
          }
        }
      }
      // This was a semi-final tie (its winner just filled the final) — its
      // LOSER is exactly who belongs in the third place match.
      if(isSemiFinalRound && t.thirdPlaceMatch){
        if(!t.thirdPlaceMatch.homeId) t.thirdPlaceMatch.homeId=result.loser;
        else if(!t.thirdPlaceMatch.awayId && t.thirdPlaceMatch.homeId!==result.loser) t.thirdPlaceMatch.awayId=result.loser;
      }
    } else {
      t.champion = result.winner;
    }
    return;
  }
  // Single-leg knockout (original logic, extended for third place)
  rounds.forEach((r,ri)=>{
    const mi=r.findIndex(m=>m.id===matchId);
    if(mi===-1) return;
    const m=r[mi];
    // A leg-1 match of a two-legged tie must NEVER advance anything on its
    // own — the tie isn't decided until leg 2 is resolved (above, via
    // resolveTwoLegTie). Without this guard, a leg-1 win would propagate
    // m.winner straight into the next round before leg 2 had even been
    // played, silently skipping the second leg entirely.
    if(m.tieId && m.legNum===1) return;
    if(!m.winner) return;
    const nextR=rounds[ri+1];
    // The semi-final round is the one whose winner lands directly in the
    // final round (stage-map-derived, so it's correct even when the final
    // itself is 2-legged and this round isn't, or vice versa).
    const isSemiFinalRound = nextR && stageMap[ri+1] && stageMap[ri+1].isFinalRound;
    if(nextR){
      const nextMatch=nextR[Math.floor(mi/2)];
      if(nextMatch){
        if(mi%2===0) nextMatch.homeId=m.winner;
        else nextMatch.awayId=m.winner;
      }
      if(isSemiFinalRound && t.thirdPlaceMatch && m.loser){
        if(!t.thirdPlaceMatch.homeId) t.thirdPlaceMatch.homeId=m.loser;
        else if(!t.thirdPlaceMatch.awayId && t.thirdPlaceMatch.homeId!==m.loser) t.thirdPlaceMatch.awayId=m.loser;
      }
    } else {
      t.champion=m.winner;
    }
  });
}

    const isSemiFinalRound = nextR && stageMap[ri+1] && stageMap[ri+1].isFinalRound;

function generateKnockout(tId){
  const t=db.tournaments.find(x=>x.id===tId);
  const perGroup = Math.max(1, t.qualifiedPerGroup||2);
  // Collect qualified participants: top N from each group by points → GD → GF
  const qualified=[];
  t.groups.forEach(g=>{
    const sorted=[...g.standings].sort((a,b)=>b.pts-a.pts||b.gd-a.gd||b.gf-a.gf);
    for(let i=0;i<perGroup&&i<sorted.length;i++){
      if(sorted[i]?.teamId) qualified.push(sorted[i].teamId);
    }
  });
  const cleaned = qualified.filter(Boolean);
  if(cleaned.length<2){ toast('Not enough qualified participants'); return; }
  // Knockout needs a power-of-2 field; round DOWN to the largest power of 2
  // that fits within what actually qualified (rounding up would ask
  // genKnockout to pair teams that don't exist).
  const needed = Math.pow(2, Math.floor(Math.log2(cleaned.length)));
  const field = cleaned.slice(0, needed);
  const shuffled=shuffle(field);
  t.koRounds=genKnockout(shuffled, t.koLegs||1);
  if(t.thirdPlace && shuffled.length>=4){
    t.thirdPlaceMatch = {id:uid(),homeId:null,awayId:null,played:false,hScore:0,aScore:0,winner:null,isThirdPlace:true};
  }
  save(); render();
  toast(field.length<cleaned.length ? `Knockout stage generated (top ${field.length} of ${cleaned.length} qualifiers — needs a power of 2)` : 'Knockout stage generated!');
}

function generateLeagueKnockout(tId){
  const t=db.tournaments.find(x=>x.id===tId);
  if(!t||t.format!=='league_knockout') return;
  const qualSpots = t.lkoQualSpots||4;
  const sorted = [...(t.standings||[])].sort((a,b)=>b.pts-a.pts||b.gd-a.gd||b.gf-a.gf);
  const qualified = sorted.slice(0, qualSpots).map(s=>s.teamId).filter(Boolean);
  if(qualified.length<2){ toast('Not enough qualified teams'); return; }
  // Round DOWN to the nearest power of 2 that fits within the qualifiers —
  // rounding up would leave genKnockout trying to pair a team that was
  // never actually selected.
  const needed = Math.pow(2, Math.floor(Math.log2(qualified.length)));
  const field = qualified.slice(0, needed);
  const shuffled = shuffle(field);
  t.koRounds = genKnockout(shuffled, t.koLegs||1);
  if(t.thirdPlace && shuffled.length>=4){
    t.thirdPlaceMatch = {id:uid(),homeId:null,awayId:null,played:false,hScore:0,aScore:0,winner:null,isThirdPlace:true};
  }
  save(); render();
  toast(field.length<qualified.length ? `Knockout stage generated (top ${field.length} of ${qualified.length} qualifiers — needs a power of 2)` : 'Knockout stage generated!');
}


function advanceDEL(t, matchId){
  // 1) Advance the winners bracket. Track the loser + which WB round they fell from.
  let droppedLoser = null, droppedFromWRound = -1;
  (t.wBracket||[]).forEach((r,ri)=>{
    const mi=r.findIndex(m=>m.id===matchId);
    if(mi===-1) return;
    const m=r[mi];
    if(!m.winner) return;
    droppedLoser = m.loser; droppedFromWRound = ri;
    const nextR=t.wBracket[ri+1];
    if(nextR){
      const nextMatch=nextR[Math.floor(mi/2)];
      if(nextMatch){
        if(mi%2===0) nextMatch.homeId=m.winner;
        else nextMatch.awayId=m.winner;
      }
    } else if(t.grandFinal && t.grandFinal[0]){
      t.grandFinal[0].homeId = m.winner; // WB champion = grand final home side
    }
  });
  if(droppedLoser!==null) placeLoserInBracket(t, droppedLoser, droppedFromWRound);

  // 2) Advance the loser bracket. Slot convention (see genLosers):
  //    - LB round 0 matches: both slots are "new loser" slots, filled only
  //      by placeLoserInBracket — never by forwarding a winner.
  //    - Later "drop" matches: homeId is the survivor slot (filled here by
  //      forwarding, 1:1 by index since drop rounds keep the same size as
  //      the round before them), awayId is the new-loser slot (filled by
  //      placeLoserInBracket).
  //    - "Survivor" matches (lbDrop:false): both slots are survivor slots,
  //      filled here by forwarding, 2:1 by index (halving the bracket).
  (t.lBracket||[]).forEach((r,ri)=>{
    const mi=r.findIndex(m=>m.id===matchId);
    if(mi===-1) return;
    const m=r[mi];
    if(!m.winner) return;
    const nextR=t.lBracket[ri+1];
    if(nextR){
      const nextIsDrop = nextR[0] && nextR[0].lbDrop;
      if(nextIsDrop){
        // Drop round: survivor always takes the home (survivor) slot, 1:1 by index.
        const nextMatch=nextR[mi];
        if(nextMatch) nextMatch.homeId=m.winner;
      } else {
        // Survivor round: winners pair up 2:1, home then away by even/odd index.
        const nextMatch=nextR[Math.floor(mi/2)];
        if(nextMatch){
          if(mi%2===0) nextMatch.homeId=m.winner;
          else nextMatch.awayId=m.winner;
        }
      }
    } else if(t.grandFinal && t.grandFinal[0]){
      t.grandFinal[0].awayId = m.winner; // LB champion = grand final away side
    }
  });

  // Special case: bracket with only 1 LB round (n=2, no real loser bracket) —
  // handled naturally since t.lBracket is empty and grandFinal stays unset on that side.

  // 3) Grand final
  if(t.grandFinal){
    const gf=t.grandFinal[0];
    if(gf && gf.id===matchId && gf.winner){
      t.champion = gf.winner;
    }
    // If WB champion is decided but there's no loser bracket at all (2-team bracket),
    // that single match IS effectively the final.
    if((t.lBracket||[]).length===0 && gf && gf.homeId && !gf.awayId){
      t.champion = gf.homeId;
    }
  }
}

// Places a loser dropping from winners-bracket round `wRound` into the
// correct loser-bracket "drop" match that is waiting for a new entrant
// from that round. Round-0 drop matches take two new losers each (fill
// home, then away). Later drop matches reserve their home slot for a
// survivor, so a fresh loser always goes into the away slot.
function placeLoserInBracket(t, loserId, wRound){
  const lb = t.lBracket||[];
  if(lb.length===0) return; // 2-team bracket has no loser bracket
  const candidates = lb.flat().filter(m=>m.lbDrop && m.wbRound===wRound);
  if(candidates.length===0) return;
  if(wRound===0){
    // Both slots are new-loser slots; fill home first, then away, then move to next match.
    const slot = candidates.find(m=>!m.homeId) || candidates.find(m=>!m.awayId);
    if(!slot) return;
    if(!slot.homeId) slot.homeId=loserId; else slot.awayId=loserId;
  } else {
    // Home is reserved for the survivor; new losers always fill the away slot
    // of the first match that doesn't have one yet.
    const slot = candidates.find(m=>!m.awayId);
    if(slot) slot.awayId=loserId;
  }
}

function renderStandings(t){
  const standings=[...getEffectiveStandings(t)];
  if(standings.length===0) return '<div class="empty-state"><div>No results yet</div></div>';
  const isLKO = t.format==='league_knockout';
  const qualSpots = isLKO ? (t.lkoQualSpots||4) : (t.qualificationSpots||0);
  const ptsW = t.ptsPerWin||3;
  const tb = t.tiebreaker||'gd';
  const tbLabel = {gd:'Goal Difference',gf:'Goals Scored',h2h:'Head-to-Head'}[tb]||'Goal Difference';
  let html=`<div class="card" style="overflow-x:auto;">
    <table class="data-table">
      <thead><tr><th>#</th><th class="tal">Participant</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>PTS</th></tr></thead>
      <tbody>`;
  standings.forEach((s,i)=>{
    const isQual = qualSpots>0 && i<qualSpots;
    const rowClass = isQual ? 'qual-row' : '';
    html+=`<tr class="${rowClass}"><td class="rank-num">${i+1}</td><td class="tal">${name(s.teamId)}</td><td>${s.p}</td><td>${s.w}</td><td>${s.d}</td><td>${s.l}</td><td>${s.gf}</td><td>${s.ga}</td><td>${s.gd>=0?'+'+s.gd:s.gd}</td><td class="pts-cell">${s.pts}</td></tr>`;
  });
  html+=`</tbody></table></div>`;
  html+=`<div style="display:flex;gap:10px;flex-wrap:wrap;font-size:.68rem;color:var(--text3);padding:4px 0;">`;
  if(qualSpots>0) html+=`<div style="border-left:3px solid var(--green);padding-left:6px;">${isLKO?`Top ${qualSpots} advance to KO stage`:`Top ${qualSpots} qualify`}</div>`;
  html+=`<div>Win = ${ptsW} pts · Draw = 1 pt</div><div>Tiebreaker: ${tbLabel}</div></div>`;
  // For league_knockout, if all league matches done and no KO yet, show generate button
  if(isLKO){
    const allDone = (t.matches||[]).length>0 && (t.matches||[]).every(m=>m.played);
    if(allDone && !t.koRounds){
      html+=`<button class="btn btn-primary btn-full" style="margin-top:8px;" onclick="generateLeagueKnockout('${t.id}')">Generate Knockout Stage (Top ${qualSpots})</button>`;
    } else if(t.koRounds){
      html+=`<div class="swiss-round-title" style="margin-top:12px;">Knockout Stage <span style="text-transform:none;font-weight:500;color:var(--text3);">— see the Bracket tab for the full view</span></div>`;
      html+=renderBracketRoundsHTML(t.koRounds, t.id, t.koLegs||1, t);
      if(t.thirdPlaceMatch && t.thirdPlaceMatch.homeId && t.thirdPlaceMatch.awayId){
        html += '<div class="swiss-round-title">🥉 Third Place (played before the Final)</div>';
        html += renderBracketRoundsHTML([[t.thirdPlaceMatch]], t.id, 1);
      }
    }
  }
  return html;
}

function renderBracket(t){
  if(t.format==='double_elimination'){
    let html='<div class="card-title" style="margin-top:4px;">Winners Bracket</div>';
    html+=renderBracketRoundsHTML(t.wBracket||[], t.id);
    if((t.lBracket||[]).length){
      html+='<div class="card-title" style="margin-top:14px;">Losers Bracket</div>';
      html+=renderBracketRoundsHTML(t.lBracket||[], t.id);
    }
    if(t.grandFinal){
      html+='<div class="card-title" style="margin-top:14px;">Grand Final</div>';
      html+=renderBracketRoundsHTML([t.grandFinal], t.id);
    }
    return html;
  }
  const rounds = t.koRounds||t.rounds||[];
  if(!rounds||rounds.length===0) return '<div class="empty-state"><div>Bracket not generated yet</div></div>';
  // Build bracket with 3rd place integrated between semis and final
  return renderBracketRoundsHTML(rounds, t.id, t.koLegs||1, t);
}

function renderBracketRoundsHTML(rounds, tId, koLegs=1, t=null){
  if(!rounds||rounds.length===0) return '<div class="empty-state"><div>Bracket not generated yet</div></div>';
  const allMatches = rounds.flat();
  const stageMap = mapKORoundLabels(rounds);
  let html=`<div id="bracket-wrap"><div class="bracket">`;

  // Render all pre-final rounds
  rounds.forEach((r,ri)=>{
    if(stageMap[ri].isFinalRound) return;
    const {logicalIdx, totalLogical, legNum} = stageMap[ri];
    const legSuffix = legNum ? ` L${legNum}` : '';
    html += renderBracketColumn(r, ri, roundName(logicalIdx,totalLogical)+legSuffix, tId, allMatches, t, koLegs);
  });

  // 3rd place column (integrated in bracket between SF and Final)
  if(t && t.thirdPlaceMatch && t.thirdPlaceMatch.homeId && t.thirdPlaceMatch.awayId){
    const tp=t.thirdPlaceMatch;
    const h=db.participants.find(p=>p.id===tp.homeId)||{name:'TBD'};
    const a=db.participants.find(p=>p.id===tp.awayId)||{name:'TBD'};
    const canSim=!tp.played;
    html+=`<div class="bround"><div class="bround-title">🥉 3rd Place</div><div class="bmatches">
      <div class="bmatch">
        <div class="bmatch-team ${tp.winner===tp.homeId?'winner':''}">${h.name} <span class="bmatch-score">${tp.played?tp.hScore:'-'}</span></div>
        <div class="bmatch-divider"></div>
        <div class="bmatch-team ${tp.winner===tp.awayId?'winner':''}">${a.name} <span class="bmatch-score">${tp.played?tp.aScore:'-'}</span></div>
        ${canSim?`<div class="bmatch-sim"><button class="btn btn-primary btn-sm btn-full" onclick="triggerSim('${tId}','${tp.id}',true)">Sim</button></div>`:''}
      </div>
    </div></div>`;
  }

  // Final round(s)
  rounds.forEach((r,ri)=>{
    if(!stageMap[ri].isFinalRound) return;
    const {logicalIdx, totalLogical, legNum} = stageMap[ri];
    const legSuffix = legNum ? ` L${legNum}` : '';
    html += renderBracketColumn(r, ri, roundName(logicalIdx,totalLogical)+legSuffix, tId, allMatches, t, koLegs);
  });

  html+=`</div></div>`;
  return html;
}

function renderBracketColumn(r, ri, label, tId, allMatches, t=null, koLegs=1){
  let html=`<div class="bround"><div class="bround-title">${label}</div><div class="bmatches">`;
  r.forEach(m=>{
    const h=m.homeId?db.participants.find(p=>p.id===m.homeId):{name:'TBD'};
    const a=m.awayId?db.participants.find(p=>p.id===m.awayId):{name:'TBD'};
    const lockedByThirdPlace = t && m.homeId && m.awayId && !m.played && isFinalLockedByThirdPlace(t,m);
    // Leg 2 blocked until leg 1 played
    const leg1ForLeg2 = (m.legNum===2&&m.leg1Id) ? allMatches.find(x=>x.id===m.leg1Id) : null;
    const lockedByLeg1 = !!leg1ForLeg2 && !leg1ForLeg2.played;
    const canSim=m.homeId&&m.awayId&&!m.played&&!lockedByThirdPlace&&!lockedByLeg1;
    const scoreLabel=m.played?(m.penalties?`${m.hScore}(${m.penH})`:`${m.hScore}`):'-';
    const scoreALabel=m.played?(m.penalties?`${m.aScore}(${m.penA})`:`${m.aScore}`):'-';
    let aggHtml='';
    if(m.legNum===2&&m.leg1Id&&m.played){
      const leg1=allMatches.find(x=>x.id===m.leg1Id);
      if(leg1&&leg1.played){
        // Aggregate, kept in the SAME homeId-then-awayId order as the two
        // score rows rendered just above (m.homeId===leg1.awayId since legs
        // flip sides) — aggHome is m.homeId's combined total, aggAway is
        // m.awayId's. m.penH/m.penA are already in that same orientation.
        const aggHome=leg1.aScore+m.hScore, aggAway=leg1.hScore+m.aScore;
        const winner=m.winner?(db.participants.find(p=>p.id===m.winner)?.name||'?'):null;
        aggHtml=`<div style="font-size:.6rem;color:var(--gold);text-align:center;margin-top:3px;">Agg:${aggHome}–${aggAway}${m.penalties?` P${m.penH}-${m.penA}`:''}${winner?` ·${winner}`:''}</div>`;
      }
    }
    html+=`<div class="bmatch">
      <div class="bmatch-team ${m.winner===m.homeId?'winner':''}">${h?.name||'TBD'} <span class="bmatch-score">${scoreLabel}</span></div>
      <div class="bmatch-divider"></div>
      <div class="bmatch-team ${m.winner===m.awayId?'winner':''}">${a?.name||'TBD'} <span class="bmatch-score">${scoreALabel}</span></div>
      ${aggHtml}
      ${canSim?`<div class="bmatch-sim"><button class="btn btn-primary btn-sm btn-full" onclick="triggerSim('${tId}','${m.id}',true)">Sim</button></div>`:''}
      ${lockedByThirdPlace?`<div class="bmatch-sim" style="background:none;"><button class="btn btn-outline btn-sm btn-full" disabled style="opacity:.45;">🔒 3rd place 1st</button></div>`:''}
      ${lockedByLeg1?`<div class="bmatch-sim" style="background:none;"><button class="btn btn-outline btn-sm btn-full" disabled style="opacity:.45;">🔒 Play Leg 1 first</button></div>`:''}
    </div>`;
  });
  html+=`</div></div>`;
  return html;
}

function renderGroups(t){
  let html='';
  const qualPerGroup = t.qualifiedPerGroup||2;
  (t.groups||[]).forEach(g=>{
    const sorted=[...g.standings].sort((a,b)=>b.pts-a.pts||b.gd-a.gd);
    html+=`<div class="card">
      <div class="card-title">${g.name}</div>
      <table class="data-table">
        <thead><tr><th>#</th><th class="tal">Team</th><th>P</th><th>GD</th><th>PTS</th></tr></thead>
        <tbody>
          ${sorted.map((s,i)=>`<tr class="${i<qualPerGroup?'qual-row':'elim-row'}"><td class="rank-num">${i+1}</td><td class="tal">${name(s.teamId)}</td><td>${s.p}</td><td>${s.gd>=0?'+'+s.gd:s.gd}</td><td class="pts-cell">${s.pts}</td></tr>`).join('')}
        </tbody>
      </table>
    </div>`;
  });
  const allDone=(t.groups||[]).every(g=>g.matches.every(m=>m.played));
  if(allDone&&!t.koRounds){
    html+=`<button class="btn btn-primary btn-full" onclick="generateKnockout('${t.id}')">Generate Knockout Stage</button>`;
  }
  return html||'<div class="empty-state"><div>No groups</div></div>';
}

// renderBracketRounds removed (superseded by renderBracketRoundsHTML)

function renderTournamentStats(t){
  // Gather all played matches
  let allMatches=[];
  if(t.matches) allMatches=[...t.matches.filter(m=>m.played)];
  if(t.rounds) allMatches=[...allMatches,...t.rounds.flat().filter(m=>m.played&&m.homeId)];
  if(t.koRounds) allMatches=[...allMatches,...t.koRounds.flat().filter(m=>m.played&&m.homeId)];
  if(t.groups) allMatches=[...allMatches,...t.groups.flatMap(g=>g.matches.filter(m=>m.played))];
  if(t.wBracket) allMatches=[...allMatches,...t.wBracket.flat().filter(m=>m.played&&m.homeId)];
  if(t.lBracket) allMatches=[...allMatches,...t.lBracket.flat().filter(m=>m.played&&m.homeId)];
  if(t.grandFinal) allMatches=[...allMatches,...t.grandFinal.filter(m=>m.played&&m.homeId&&m.awayId)];
  if(t.thirdPlaceMatch && t.thirdPlaceMatch.played) allMatches=[...allMatches, t.thirdPlaceMatch];

  if(allMatches.length===0) return '<div class="empty-state"><div>No matches played yet</div></div>';

  const totalGoals=allMatches.reduce((s,m)=>s+m.hScore+m.aScore,0);
  const gpm=(totalGoals/allMatches.length).toFixed(2);
  let highest=allMatches[0], biggestWin=allMatches[0];
  allMatches.forEach(m=>{
    if(m.hScore+m.aScore>highest.hScore+highest.aScore) highest=m;
    if(Math.abs(m.hScore-m.aScore)>Math.abs(biggestWin.hScore-biggestWin.aScore)) biggestWin=m;
  });

  const standings = getEffectiveStandings(t);
  const bestAtt = standings.length>0?[...standings].sort((a,b)=>b.gf-a.gf)[0]:null;
  const bestDef = standings.length>0?[...standings].sort((a,b)=>a.ga-b.ga)[0]:null;

  const isIndividual = t.type === 'player';

  const scorerTotals = {}; // playerId -> {name, goals}
  const assistTotals = {}; // playerId -> {name, assists}
  const saveTotals = {}; // teamId -> total GK saves this tournament (team mode only)
  let totalYellows=0, totalReds=0, totalSaves=0;
  allMatches.forEach(m=>{
    (m.scorers||[]).forEach(g=>{
      if(g.scorerId){
        if(!scorerTotals[g.scorerId]) scorerTotals[g.scorerId]={name:g.scorerName||'Unknown',goals:0};
        scorerTotals[g.scorerId].goals++;
      }
      if(g.assistId){
        if(!assistTotals[g.assistId]) assistTotals[g.assistId]={name:g.assistName||'Unknown',assists:0};
        assistTotals[g.assistId].assists++;
      }
    });
    (m.cards||[]).forEach(c=>{ if(c.type==='red') totalReds++; else totalYellows++; });
    if(!isIndividual && m.stats){
      const hS=m.stats.hSaves||0, aS=m.stats.aSaves||0;
      totalSaves += hS + aS;
      saveTotals[m.homeId] = (saveTotals[m.homeId]||0) + hS;
      saveTotals[m.awayId] = (saveTotals[m.awayId]||0) + aS;
    }
  });
  const topScorers = Object.values(scorerTotals).sort((a,b)=>b.goals-a.goals).slice(0,5);
  const topAssisters = Object.values(assistTotals).sort((a,b)=>b.assists-a.assists).slice(0,5);
  const bestKeeperEntry = Object.entries(saveTotals).sort((a,b)=>b[1]-a[1])[0];
  const bestKeeper = bestKeeperEntry ? {teamId:bestKeeperEntry[0], saves:bestKeeperEntry[1]} : null;

  let html=`
    <div class="card">
      <div class="card-title">Tournament Stats</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
        <div style="text-align:center;background:var(--surface2);border-radius:8px;padding:10px;">
          <div style="font-size:1.4rem;font-weight:900;color:var(--accent2);">${totalGoals}</div>
          <div style="font-size:.68rem;color:var(--text3);">Total Goals</div>
        </div>
        <div style="text-align:center;background:var(--surface2);border-radius:8px;padding:10px;">
          <div style="font-size:1.4rem;font-weight:900;color:var(--green);">${gpm}</div>
          <div style="font-size:.68rem;color:var(--text3);">Goals/Match</div>
        </div>
        <div style="text-align:center;background:var(--surface2);border-radius:8px;padding:10px;">
          <div style="font-size:1rem;font-weight:800;color:var(--text);">${allMatches.length}</div>
          <div style="font-size:.68rem;color:var(--text3);">Matches Played</div>
        </div>
        <div style="text-align:center;background:var(--surface2);border-radius:8px;padding:10px;">
          <div style="font-size:1rem;font-weight:800;color:var(--gold);">${allMatches.filter(m=>m.hScore===0||m.aScore===0).length}</div>
          <div style="font-size:.68rem;color:var(--text3);">${isIndividual?'Shutouts':'Clean Sheets'}</div>
        </div>
        ${!isIndividual?`
        <div style="text-align:center;background:var(--surface2);border-radius:8px;padding:10px;">
          <div style="font-size:1rem;font-weight:800;color:#eab308;">🟨 ${totalYellows}</div>
          <div style="font-size:.68rem;color:var(--text3);">Yellow Cards</div>
        </div>
        <div style="text-align:center;background:var(--surface2);border-radius:8px;padding:10px;">
          <div style="font-size:1rem;font-weight:800;color:var(--red);">🟥 ${totalReds}</div>
          <div style="font-size:.68rem;color:var(--text3);">Red Cards</div>
        </div>
        <div style="text-align:center;background:var(--surface2);border-radius:8px;padding:10px;">
          <div style="font-size:1rem;font-weight:800;color:var(--accent2);">🧤 ${totalSaves}</div>
          <div style="font-size:.68rem;color:var(--text3);">Goalkeeper Saves</div>
        </div>`:''}
      </div>
    </div>
    ${topScorers.length?`<div class="card">
      <div class="card-title">⚽ Top Scorers</div>
      ${topScorers.map((s,i)=>`<div style="display:flex;align-items:center;gap:8px;padding:5px 0;${i<topScorers.length-1?'border-bottom:1px solid var(--border);':''}"><span style="font-size:.8rem;color:var(--text3);width:18px;">${i+1}</span><span style="flex:1;font-weight:600;font-size:.85rem;">${s.name}</span><span class="pill pill-green">${s.goals}</span></div>`).join('')}
    </div>`:''}
    ${topAssisters.length?`<div class="card">
      <div class="card-title">🅰️ Top Assisters</div>
      ${topAssisters.map((s,i)=>`<div style="display:flex;align-items:center;gap:8px;padding:5px 0;${i<topAssisters.length-1?'border-bottom:1px solid var(--border);':''}"><span style="font-size:.8rem;color:var(--text3);width:18px;">${i+1}</span><span style="flex:1;font-weight:600;font-size:.85rem;">${s.name}</span><span class="pill pill-blue">${s.assists}</span></div>`).join('')}
    </div>`:''}
    <div class="card">
      <div class="card-title">Highest Scoring Match</div>
      <div style="display:flex;align-items:center;gap:10px;">
        <div style="flex:1;font-weight:700;font-size:.88rem;">${name(highest.homeId)}</div>
        <div class="pill pill-gold">${highest.hScore}–${highest.aScore}</div>
        <div style="flex:1;font-weight:700;font-size:.88rem;text-align:right;">${name(highest.awayId)}</div>
      </div>
    </div>
    <div class="card">
      <div class="card-title">Biggest Win</div>
      <div style="display:flex;align-items:center;gap:10px;">
        <div style="flex:1;font-weight:700;font-size:.88rem;">${name(biggestWin.homeId)}</div>
        <div class="pill pill-gold">${biggestWin.hScore}–${biggestWin.aScore}</div>
        <div style="flex:1;font-weight:700;font-size:.88rem;text-align:right;">${name(biggestWin.awayId)}</div>
      </div>
    </div>
    ${bestAtt?`<div class="card">
      <div class="card-title">Best Attack</div>
      <div style="display:flex;align-items:center;gap:10px;"><span style="font-size:1.2rem;">⚽</span><span style="font-weight:700;flex:1;">${name(bestAtt.teamId)}</span><div class="pill pill-green">${bestAtt.gf} goals</div></div>
    </div>`:''}
    ${bestDef?`<div class="card">
      <div class="card-title">Best Defense</div>
      <div style="display:flex;align-items:center;gap:10px;"><span style="font-size:1.2rem;">🛡️</span><span style="font-weight:700;flex:1;">${name(bestDef.teamId)}</span><div class="pill pill-blue">${bestDef.ga} conceded</div></div>
    </div>`:''}
    ${bestKeeper&&!isIndividual?`<div class="card">
      <div class="card-title">Best Goalkeeping</div>
      <div style="display:flex;align-items:center;gap:10px;"><span style="font-size:1.2rem;">🧤</span><span style="font-weight:700;flex:1;">${name(bestKeeper.teamId)}</span><div class="pill pill-blue">${bestKeeper.saves} saves</div></div>
    </div>`:''}
  `;
  return html;
}

function renderH2H(t){
  const ids=t.participantIds;
  let html=`<div class="card"><div class="card-title">Select Teams to Compare</div>
    <div class="form-row form-row-2" style="gap:8px;margin-bottom:10px;">
      <select id="h2h-a">${ids.map(id=>`<option value="${id}">${name(id)}</option>`).join('')}</select>
      <select id="h2h-b">${ids.map((id,i)=>`<option value="${id}" ${i===1?'selected':''}>${name(id)}</option>`).join('')}</select>
    </div>
    <button class="btn btn-outline btn-full" onclick="showH2H('${t.id}')">Compare</button>
  </div>
  <div id="h2h-result"></div>`;
  return html;
}

function showH2H(tId){
  const t=db.tournaments.find(x=>x.id===tId);
  const aId=document.getElementById('h2h-a').value;
  const bId=document.getElementById('h2h-b').value;
  if(aId===bId){ document.getElementById('h2h-result').innerHTML='<div class="card">Select two different participants</div>'; return; }
  const between=m=>(m.homeId===aId&&m.awayId===bId)||(m.homeId===bId&&m.awayId===aId);
  let matches=[];
  if(t.matches) matches=[...matches,...t.matches.filter(between)];
  if(t.rounds) matches=[...matches,...t.rounds.flat().filter(between)];
  if(t.koRounds) matches=[...matches,...t.koRounds.flat().filter(between)];
  if(t.groups) matches=[...matches,...t.groups.flatMap(g=>g.matches).filter(between)];
  if(t.wBracket) matches=[...matches,...t.wBracket.flat().filter(between)];
  if(t.lBracket) matches=[...matches,...t.lBracket.flat().filter(between)];
  if(t.grandFinal) matches=[...matches,...t.grandFinal.filter(between)];
  if(t.thirdPlaceMatch && between(t.thirdPlaceMatch)) matches=[...matches, t.thirdPlaceMatch];
  matches=matches.filter(m=>m.played);

  let aWins=0,bWins=0,draws=0,aGF=0,bGF=0;
  matches.forEach(m=>{
    const aIsHome=m.homeId===aId;
    const ag=aIsHome?m.hScore:m.aScore;
    const bg=aIsHome?m.aScore:m.hScore;
    aGF+=ag;bGF+=bg;
    if(ag>bg) aWins++;
    else if(bg>ag) bWins++;
    else draws++;
  });
  const total=matches.length;
  const el=document.getElementById('h2h-result');
  if(!total){ el.innerHTML=`<div class="card"><div style="color:var(--text3);text-align:center;">No meetings yet</div></div>`; return; }
  el.innerHTML=`<div class="card">
    <div class="card-title">Head to Head · ${total} meeting${total===1?'':'s'}</div>
    <div class="h2h-team-row">
      <div style="font-weight:700;font-size:.9rem;flex:1;">${name(aId)}</div>
      <div style="display:flex;gap:8px;align-items:center;">
        <div style="font-size:1.4rem;font-weight:900;color:var(--accent2);">${aWins}</div>
        <div style="color:var(--text3);font-size:.8rem;">–</div>
        <div style="font-size:1.4rem;font-weight:900;color:var(--text3);">${draws}</div>
        <div style="color:var(--text3);font-size:.8rem;">–</div>
        <div style="font-size:1.4rem;font-weight:900;color:var(--red);">${bWins}</div>
      </div>
      <div style="font-weight:700;font-size:.9rem;flex:1;text-align:right;">${name(bId)}</div>
    </div>
    <div class="h2h-bar">
      <div class="h2h-w" style="flex:${aWins||0.1}"></div>
      <div class="h2h-d" style="flex:${draws||0.1}"></div>
      <div class="h2h-l" style="flex:${bWins||0.1}"></div>
    </div>
    <div style="font-size:.72rem;color:var(--text3);text-align:center;margin-top:4px;">Goals: ${aGF} – ${bGF}</div>
    <div class="divider"></div>
    <div class="card-title">Meetings</div>
    ${matches.map(m=>{
      const aIsHome=m.homeId===aId;
      return `<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border);font-size:.8rem;">
        <div style="flex:1;">${name(m.homeId)}</div>
        <div style="font-weight:700;">${m.hScore}–${m.aScore}</div>
        <div style="flex:1;text-align:right;">${name(m.awayId)}</div>
      </div>`;
    }).join('')}
  </div>`;
}

/* =====================================================================
   PARTICIPANT STATS UPDATE
   ===================================================================== */
function updateParticipantStats(hId, aId, hS, aS, scorerLog=[], cardLog=[]){
  const h=db.participants.find(p=>p.id===hId);
  const a=db.participants.find(p=>p.id===aId);
  if(!h||!a) return;
  if(!h.stats) h.stats={played:0,wins:0,draws:0,losses:0,gf:0,ga:0,cleanSheets:0};
  if(!a.stats) a.stats={played:0,wins:0,draws:0,losses:0,gf:0,ga:0,cleanSheets:0};
  if(!h.form) h.form=[]; if(!a.form) a.form=[];
  h.stats.played++;a.stats.played++;
  h.stats.gf+=hS;h.stats.ga+=aS;
  a.stats.gf+=aS;a.stats.ga+=hS;
  if(aS===0) h.stats.cleanSheets++;
  if(hS===0) a.stats.cleanSheets++;
  if(hS>aS){h.stats.wins++;h.form.push('W');a.stats.losses++;a.form.push('L');}
  else if(aS>hS){a.stats.wins++;a.form.push('W');h.stats.losses++;h.form.push('L');}
  else{h.stats.draws++;h.form.push('D');a.stats.draws++;a.form.push('D');}
  if(h.form.length>10) h.form.shift();
  if(a.form.length>10) a.form.shift();

  // Personal goal/assist/card totals live on the individual Player
  // participant (the single source of truth for a player, whether they're
  // browsed standalone or via a team's roster).
  (scorerLog||[]).forEach(g=>{
    if(g.scorerId){
      const pl = db.participants.find(p=>p.id===g.scorerId);
      if(pl){ if(!pl.career) pl.career={goals:0,assists:0,yellows:0,reds:0}; pl.career.goals++; }
    }
    if(g.assistId){
      const pl = db.participants.find(p=>p.id===g.assistId);
      if(pl){ if(!pl.career) pl.career={goals:0,assists:0,yellows:0,reds:0}; pl.career.assists++; }
    }
  });
  (cardLog||[]).forEach(c=>{
    if(c.playerId){
      const pl = db.participants.find(p=>p.id===c.playerId);
      if(pl){
        if(!pl.career) pl.career={goals:0,assists:0,yellows:0,reds:0};
        if(c.type==='red') pl.career.reds++; else pl.career.yellows++;
      }
    }
  });
}

/* =====================================================================
   UTILITY
   ===================================================================== */
function name(id){ const p=db.participants.find(x=>x.id===id); return p?p.name:'Unknown'; }

function dismissSaveNotice(){
  db.settings.dismissedSaveNotice = true;
  save(); render();
}

function toast(msg){
  const el=document.getElementById('toast');
  el.innerText=msg; el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),2000);
}

/* =====================================================================
   CUSTOM CONFIRM MODAL
   (native window.confirm()/prompt() are unreliable inside sandboxed
   webviews — this in-app dialog replaces every confirm() call.)
   ===================================================================== */
let _confirmCb = null;
function showConfirm(message, onConfirm){
  _confirmCb = onConfirm;
  document.getElementById('confirm-message').innerText = message;
  document.getElementById('confirm-modal').classList.remove('hidden');
}
function cancelConfirm(){
  _confirmCb = null;
  document.getElementById('confirm-modal').classList.add('hidden');
}
function acceptConfirm(){
  const cb = _confirmCb;
  _confirmCb = null;
  document.getElementById('confirm-modal').classList.add('hidden');
  if(cb) cb();
}

// Boot
render();
