<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Yareu Tourney — Tournament Manager</title>
<style>
/* =====================================================================
   TOKENS & RESET
   ===================================================================== */
:root {
  --bg:       #0b0f1a;
  --surface:  #111827;
  --surface2: #1a2234;
  --surface3: #243044;
  --border:   #2a3650;
  --border2:  #3d5070;
  --accent:   #3b82f6;
  --accent2:  #60a5fa;
  --gold:     #f59e0b;
  --green:    #22c55e;
  --red:      #ef4444;
  --orange:   #f97316;
  --text:     #f1f5f9;
  --text2:    #94a3b8;
  --text3:    #64748b;
  --radius:   10px;
  --radius-sm:6px;
  --shadow:   0 4px 24px rgba(0,0,0,0.4);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:15px;-webkit-tap-highlight-color:transparent;}
input,select,textarea{background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:var(--radius-sm);padding:10px 12px;width:100%;font-size:14px;outline:none;transition:border .15s;}
input:focus,select:focus{border-color:var(--accent);}
input[type=range]{padding:0;background:none;border:none;}
input[type=checkbox]{width:auto;accent-color:var(--accent);}
select option{background:var(--surface2);}
button{cursor:pointer;font-family:inherit;font-size:14px;border:none;transition:all .15s;}

/* =====================================================================
   LAYOUT
   ===================================================================== */
#shell{display:flex;flex-direction:column;height:100vh;overflow:hidden;}
#top-bar{flex-shrink:0;background:var(--surface);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;z-index:50;}
#top-bar h1{font-size:1.1rem;font-weight:700;color:var(--accent2);letter-spacing:-0.02em;display:flex;align-items:center;gap:8px;}
#top-bar h1 span{color:var(--text);}
#main-scroll{flex:1;overflow-y:auto;overflow-x:hidden;}
#app{max-width:720px;margin:0 auto;padding:16px 14px 80px;}
#tab-bar{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);display:flex;z-index:50;}
.tab-btn{flex:1;background:none;border:none;color:var(--text3);padding:10px 4px 8px;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;transition:.15s;}
.tab-btn.active{color:var(--accent2);}
.tab-btn svg{width:22px;height:22px;stroke-width:1.8;}
.tab-btn.active svg{stroke:var(--accent2);}
.tab-icon-dot{width:4px;height:4px;border-radius:50%;background:var(--accent2);opacity:0;transition:.15s;}
.tab-btn.active .tab-icon-dot{opacity:1;}

/* =====================================================================
   COMMON COMPONENTS
   ===================================================================== */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px;transition:border-color .15s,background .15s;}
.card[onclick]{cursor:pointer;}
.card[onclick]:hover{border-color:var(--border2);background:var(--surface2);}
.card[onclick]:active{transform:scale(.995);}
.card-title{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);margin-bottom:10px;}
.pill{display:inline-block;padding:2px 8px;border-radius:100px;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;}
.pill-blue{background:rgba(59,130,246,.18);color:var(--accent2);}
.pill-gold{background:rgba(245,158,11,.18);color:var(--gold);}
.pill-green{background:rgba(34,197,94,.18);color:var(--green);}
.pill-red{background:rgba(239,68,68,.18);color:var(--red);}
.pill-gray{background:var(--surface3);color:var(--text2);}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:var(--radius-sm);font-weight:700;font-size:13px;transition:.15s;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:active{background:#2563eb;transform:scale(.98);}
.btn-outline{background:none;border:1px solid var(--border);color:var(--text2);}
.btn-outline:hover,.btn-outline:active{border-color:var(--border2);color:var(--text);}
.btn-ghost{background:none;color:var(--text2);}
.btn-ghost:hover{color:var(--text);}
.btn-danger{background:var(--red);color:#fff;}
.btn-danger:active{background:#dc2626;transform:scale(.98);}
.btn-gold{background:var(--gold);color:#000;}
.btn-sm{padding:6px 10px;font-size:12px;}
.btn-full{width:100%;}
.btn-icon{padding:8px;border-radius:var(--radius-sm);background:var(--surface3);color:var(--text2);}
.btn-icon:hover{color:var(--text);background:var(--border);}
.btn-icon:active{transform:scale(.94);}
.btn:disabled{opacity:.45;cursor:not-allowed;pointer-events:none;}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,.check-item:focus-within,.switch-row:focus-within{outline:2px solid var(--accent2);outline-offset:1px;}

.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.section-title{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--text2);}

.form-group{margin-bottom:12px;}
.form-label{display:block;font-size:.75rem;font-weight:600;color:var(--text2);margin-bottom:5px;text-transform:uppercase;letter-spacing:.05em;}
.form-row{display:grid;gap:8px;}
.form-row-2{grid-template-columns:1fr 1fr;}
.form-row-3{grid-template-columns:1fr 1fr 1fr;}
.form-row-4{grid-template-columns:1fr 1fr 1fr 1fr;}

.divider{height:1px;background:var(--border);margin:14px 0;}
.form-hint{font-size:.68rem;color:var(--text3);margin-top:4px;line-height:1.4;}
.form-error{font-size:.7rem;color:var(--red);margin-top:4px;line-height:1.4;font-weight:600;}
.form-error.hidden{display:none;}

/* Form dot */
.form-dots{display:flex;gap:3px;}
.fdot{width:14px;height:14px;border-radius:50%;font-size:8px;font-weight:800;display:flex;align-items:center;justify-content:center;color:#fff;}
.fdot-W{background:var(--green);}
.fdot-D{background:var(--text3);}
.fdot-L{background:var(--red);}

/* Rating bar */
.rating-bar-wrap{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.rating-bar-label{font-size:.7rem;color:var(--text3);width:26px;text-align:right;}
.rating-bar-track{flex:1;height:4px;background:var(--surface3);border-radius:2px;overflow:hidden;}
.rating-bar-fill{height:100%;border-radius:2px;background:var(--accent);transition:width .3s;}
.rating-bar-val{font-size:.7rem;font-weight:700;color:var(--text2);width:24px;}

/* Table */
.data-table{width:100%;border-collapse:collapse;font-size:.82rem;}
.data-table th{padding:7px 6px;text-align:center;border-bottom:1px solid var(--border);color:var(--text3);font-weight:600;font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;}
.data-table td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--border);}
.data-table td.tal{text-align:left;}
.data-table tbody tr:last-child td{border-bottom:none;}
.data-table tbody tr:hover td{background:var(--surface2);}
.rank-num{color:var(--text3);font-weight:700;font-size:.75rem;}
.pts-cell{font-weight:800;color:var(--accent2);}
.qual-row td:first-child{border-left:3px solid var(--green);}
.playoff-row td:first-child{border-left:3px solid var(--orange);}
.elim-row td:first-child{border-left:3px solid transparent;}

/* Match card */
.match-card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:8px;}
.match-card.played{border-left:3px solid var(--green);}
.match-header{font-size:.65rem;color:var(--text3);text-align:center;margin-bottom:6px;text-transform:uppercase;letter-spacing:.06em;}
.match-body{display:flex;align-items:center;gap:8px;}
.match-team-name{flex:1;font-weight:700;font-size:.88rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.match-team-name.tar{text-align:right;}
.match-score-box{background:var(--surface3);padding:4px 10px;border-radius:var(--radius-sm);font-size:1rem;font-weight:800;color:var(--text);min-width:54px;text-align:center;}
.match-score-box.live{color:var(--green);animation:pulse 1s infinite;}
.match-vs{color:var(--text3);font-size:.8rem;font-weight:700;padding:0 2px;}
.match-footer{margin-top:8px;display:flex;gap:6px;}
.match-prediction{font-size:.68rem;color:var(--text3);text-align:center;margin-top:4px;}
.pred-bar{height:3px;border-radius:2px;background:var(--border);display:flex;overflow:hidden;margin-top:3px;}
.pred-h{background:var(--accent);transition:width .4s ease;}
.pred-d{background:var(--text3);}
.pred-a{background:var(--red);}

/* Knockout bracket */
#bracket-wrap{overflow-x:auto;padding-bottom:12px;}
.bracket{display:flex;gap:0;align-items:stretch;min-width:max-content;}
.bround{display:flex;flex-direction:column;justify-content:space-around;min-width:160px;position:relative;}
.bround-title{font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--text3);text-align:center;padding:6px 0;border-bottom:1px solid var(--border);}
.bmatches{flex:1;display:flex;flex-direction:column;justify-content:space-around;padding:8px 0;}
.bmatch{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);margin:4px 8px;overflow:hidden;}
.bmatch-team{display:flex;align-items:center;justify-content:space-between;padding:6px 8px;font-size:.78rem;}
.bmatch-team.winner{background:rgba(59,130,246,.12);color:var(--accent2);font-weight:700;}
.bmatch-team-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.bmatch-score{font-weight:700;font-size:.85rem;min-width:18px;text-align:right;}
.bmatch-divider{height:1px;background:var(--border);}
.bmatch-sim{padding:4px 8px;background:var(--surface3);}
.bconnector{width:20px;display:flex;flex-direction:column;justify-content:space-around;position:relative;}

/* Stats bar */
.stat-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:.8rem;}
.stat-name{width:90px;color:var(--text3);font-size:.72rem;}
.stat-bar-wrap{flex:1;display:flex;align-items:center;gap:4px;}
.stat-bar-left{flex:1;height:5px;border-radius:2px;background:var(--accent);transform-origin:right;transition:all .4s;}
.stat-bar-right{flex:1;height:5px;border-radius:2px;background:var(--red);transform-origin:left;transition:all .4s;}
.stat-val-l{min-width:28px;text-align:right;font-weight:700;color:var(--accent2);}
.stat-val-r{min-width:28px;text-align:left;font-weight:700;color:#f87171;}

/* Live modal */
#live-modal{position:fixed;inset:0;background:rgba(7,11,20,.97);z-index:500;display:none;flex-direction:column;overflow-y:auto;}
.live-inner{max-width:600px;margin:0 auto;padding:16px 14px 80px;}
.live-clock{font-size:2.2rem;font-weight:900;color:var(--accent2);text-align:center;letter-spacing:-.03em;font-variant-numeric:tabular-nums;}
.live-teams-row{display:flex;align-items:center;gap:8px;margin:12px 0;}
.live-team-name{flex:1;font-size:1.05rem;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.live-team-name.tar{text-align:right;}
.live-scoreboard{background:var(--surface);border-radius:var(--radius);padding:8px 18px;font-size:1.8rem;font-weight:900;color:var(--text);min-width:80px;text-align:center;}
.timeline-wrap{max-height:260px;overflow-y:auto;margin-top:10px;}
.tl-item{padding:8px 10px;border-bottom:1px solid var(--border);font-size:.82rem;display:flex;gap:10px;align-items:center;}
.tl-min{color:var(--text3);font-weight:700;font-variant-numeric:tabular-nums;min-width:32px;}
.tl-goal{color:var(--green);font-weight:700;}
.tl-yellow{color:var(--gold);}
.tl-red{color:var(--red);font-weight:700;}
.tl-pen{color:var(--gold);font-weight:700;}
.tl-info{color:var(--text3);}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.5;}}
.live-stat-bars{margin-top:12px;}

/* Tabs inside tournament */
.inner-tabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:14px;overflow-x:auto;}
.inner-tab{padding:9px 14px;font-size:.78rem;font-weight:700;color:var(--text3);border-bottom:2px solid transparent;white-space:nowrap;background:none;transition:.15s;}
.inner-tab.active{color:var(--accent2);border-bottom-color:var(--accent2);}

/* Swiss rounds */
.swiss-round-title{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--text3);padding:8px 0 4px;}

/* H2H */
.h2h-team-row{display:flex;align-items:center;gap:10px;padding:10px 0;}
.h2h-bar{flex:1;height:8px;border-radius:4px;overflow:hidden;display:flex;}
.h2h-w{background:var(--accent);}
.h2h-d{background:var(--text3);}
.h2h-l{background:var(--red);}

/* Toast */
#toast{position:fixed;bottom:76px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--surface3);color:var(--text);padding:8px 16px;border-radius:var(--radius-sm);font-size:.8rem;font-weight:600;z-index:600;opacity:0;transition:all .25s;pointer-events:none;white-space:nowrap;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* Empty state */
.empty-state{text-align:center;padding:40px 20px;color:var(--text3);}
.empty-state-icon{font-size:2.5rem;margin-bottom:10px;}
.empty-state-title{font-weight:700;color:var(--text2);margin-bottom:6px;}

/* Modal overlay */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:400;display:flex;align-items:flex-end;justify-content:center;}
.modal-sheet{background:var(--surface);border-radius:16px 16px 0 0;padding:20px 16px 40px;width:100%;max-width:600px;max-height:85vh;overflow-y:auto;}
.modal-handle{width:36px;height:4px;background:var(--border2);border-radius:2px;margin:0 auto 16px;}

/* Progress */
.progress-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.progress-label{font-size:.72rem;color:var(--text3);width:80px;}
.progress-track{flex:1;height:6px;background:var(--surface3);border-radius:3px;overflow:hidden;}
.progress-fill{height:100%;border-radius:3px;background:var(--accent);transition:width .5s;}

/* Checklist */
.check-item{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);cursor:pointer;transition:background .12s;}
.check-item:last-child{border-bottom:none;}
.check-item:hover{background:var(--surface2);}
.check-item label{flex:1;cursor:pointer;font-size:.88rem;}
.check-item .ovr-badge{font-size:.7rem;color:var(--text3);}

/* Utility */
.hidden{display:none !important;}
.fade-in{animation:fadeIn .2s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(-2px);}to{opacity:1;transform:translateY(0);}}

/* Toggle switch (used for Enable Strength Ratings etc) */
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 2px;cursor:pointer;}
.switch-row .switch-label{font-size:.85rem;font-weight:600;color:var(--text);}
.switch-row .switch-sub{font-size:.7rem;color:var(--text3);margin-top:1px;}
.switch{position:relative;width:42px;height:24px;flex-shrink:0;}
.switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;}
.switch-track{position:absolute;inset:0;background:var(--surface3);border:1px solid var(--border);border-radius:100px;transition:.18s;}
.switch-thumb{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--text2);transition:.18s;}
.switch input:checked + .switch-track{background:rgba(59,130,246,.35);border-color:var(--accent);}
.switch input:checked + .switch-track .switch-thumb{transform:translateX(18px);background:var(--accent2);}

/* Stat input group (ATT/MID/DEF) */
.stat-input{position:relative;}
.stat-input label{display:block;font-size:.68rem;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px;text-align:center;}
.stat-input input{text-align:center;font-weight:700;font-size:1rem;padding:9px 6px;}
.stat-input.att input{color:var(--accent2);}
.stat-input.mid input{color:var(--gold);}
.stat-input.def input{color:var(--green);}

.ovr-display{display:flex;align-items:center;justify-content:space-between;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 14px;margin:10px 0 12px;}
.ovr-display .ovr-label{font-size:.72rem;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;}
.ovr-display .ovr-sub{font-size:.65rem;color:var(--text3);margin-top:2px;}
.ovr-display .ovr-value{font-size:1.6rem;font-weight:900;color:var(--accent2);font-variant-numeric:tabular-nums;}

/* Roster (players within a team) */
.roster-wrap{border:1px dashed var(--border2);border-radius:var(--radius-sm);padding:10px;margin-top:4px;}
.roster-item{display:flex;align-items:center;gap:8px;padding:6px 2px;}
.roster-item:not(:last-child){border-bottom:1px solid var(--border);}
.roster-item .roster-name{flex:1;font-size:.85rem;font-weight:600;}
.roster-item .roster-pos{font-size:.68rem;color:var(--text3);background:var(--surface3);padding:2px 7px;border-radius:100px;}
.roster-empty{font-size:.78rem;color:var(--text3);text-align:center;padding:10px 0;}
.roster-add-row{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
.roster-add-row input{flex:1 1 100%;}
.roster-add-row select{flex:1 1 auto;min-width:0;}
.roster-add-row button{flex:0 0 auto;}
.team-card-roster-toggle{font-size:.72rem;color:var(--accent2);font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:3px;margin-top:6px;}

/* Segmented control (Team / Player) */
.segmented{display:flex;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:3px;gap:3px;}
.segmented button{flex:1;background:none;color:var(--text3);font-weight:700;font-size:.8rem;padding:8px 4px;border-radius:7px;transition:.15s;}
.segmented button.active{background:var(--accent);color:#fff;}

/* Responsive */
@media(min-width:600px){
  .form-row-2-auto{grid-template-columns:1fr 1fr;}
}
</style>
</head>
<body>

<div id="shell">
  <div id="top-bar">
    <h1>🏆 <span>Yareu</span> Tourney</h1>
    <div style="display:flex;gap:8px;">
      <button class="btn btn-icon" onclick="openSettings()" title="Settings">⚙</button>
      <button class="btn btn-outline btn-sm" onclick="exportData()" title="Download a backup file of all your data">⬇ Backup</button>
      <button class="btn btn-outline btn-sm" onclick="document.getElementById('import-file').click()" title="Restore from a backup file">⬆ Restore</button>
      <input type="file" id="import-file" accept=".json" style="display:none" onchange="importData(this)">
    </div>
  </div>
  <div id="main-scroll">
    <div id="app"></div>
  </div>
  <nav id="tab-bar">
    <button class="tab-btn active" id="nav-dash" onclick="switchTab('dash')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      Dashboard
      <div class="tab-icon-dot"></div>
    </button>
    <button class="tab-btn" id="nav-participants" onclick="switchTab('participants')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/><path d="M21 21v-2a4 4 0 0 0-3-3.85"/></svg>
      Participants
      <div class="tab-icon-dot"></div>
    </button>
    <button class="tab-btn" id="nav-tournaments" onclick="switchTab('tournaments')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>
      Tournaments
      <div class="tab-icon-dot"></div>
    </button>
    <button class="tab-btn" id="nav-friendlies" onclick="switchTab('friendlies')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20Z"/><path d="M2 12h20"/></svg>
      Friendlies
      <div class="tab-icon-dot"></div>
    </button>
  </nav>
</div>

<!-- Live Match Modal -->
<div id="live-modal">
  <div class="live-inner">
    <div class="live-clock" id="live-clock">0'</div>
    <div class="live-teams-row">
      <div class="live-team-name" id="live-home-name">Team A</div>
      <div class="live-scoreboard" id="live-scoreboard">0 – 0</div>
      <div class="live-team-name tar" id="live-away-name">Team B</div>
    </div>

<script>
/* =====================================================================
   STATE
   ===================================================================== */
const STORAGE_KEY = 'yareu_tourney_v1';
const LEGACY_STORAGE_KEY = 'winner_pro_v3'; // previous app name, migrated on first load
let db = loadDb();
let activeTab = 'dash';
let activeTournamentId = null;
let activeTournamentTab = 'fixtures';
let friendlyHomeId = null; // selections for the "set up a friendly" form
let friendlyAwayId = null;
let friendlyHomeAdv = true; // whether the home side gets a boost in friendlies (persists as a preference)
let friendlyDecisive = false; // if true, a drawn friendly goes to extra time then penalties instead of standing as a draw
let friendlyLabel = ''; // optional free-text name for the friendly, e.g. "Preseason Friendly"
let friendlySettingsOpen = false; // whether the friendly match-settings panel is expanded
let activeProfileId = null; // participant whose profile page is open
let profileFromTab = 'dash'; // which main tab to return to when leaving a profile
let sim = null; // live simulation state
let simInterval = null;
let simIsFriendly = false; // whether the currently-live match is a friendly (not part of any tournament)

function loadDb() {
  let data;
  try {
    const current = localStorage.getItem(STORAGE_KEY);
    if(current){ data = JSON.parse(current); }
    else {
      // First run under the new name: bring forward any data saved under the old name.
      const legacy = localStorage.getItem(LEGACY_STORAGE_KEY);
      if(legacy){
        data = JSON.parse(legacy);
        localStorage.setItem(STORAGE_KEY, legacy);
      }
    }
  } catch(e){ data = null; }
  if(!data || typeof data!=='object') data = freshDb();
  // Backfill any fields added since this save was last written, so older
  // backups/saves never crash on a missing property.
  if(!Array.isArray(data.participants)) data.participants = [];
  if(!Array.isArray(data.tournaments)) data.tournaments = [];
  if(!Array.isArray(data.friendlies)) data.friendlies = [];
  if(!data.settings || typeof data.settings!=='object') data.settings = {};
  if(!data.settings.participantType) data.settings.participantType = 'team';
  if(data.settings.dismissedSaveNotice===undefined) data.settings.dismissedSaveNotice = false;
  // Simulation mode: true = matches are auto-simulated, false = results are
  // typed in by hand. Defaults to on so existing saves behave the same way
  // they always did.
  if(data.settings.simulationMode===undefined) data.settings.simulationMode = true;
  return data;
}
function freshDb(){
  return { participants:[], tournaments:[], friendlies:[], settings:{ participantType:'team', dismissedSaveNotice:false, simulationMode:true } };
}
let _saveFailed = false;
function save(){
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
    if(_saveFailed){ _saveFailed = false; toast('Saving again ✓'); }
  } catch(e){
    // Storage full, private-browsing lockout, or disabled storage — make
    // sure this is never silent, since a failed save here is exactly how
    // progress gets lost.
    if(!_saveFailed){
      _saveFailed = true;
      toast('⚠ Could not save — export a backup now (Settings)');
    }
  }
}
function uid(){ return Math.random().toString(36).substr(2,9); }

// Safety net: if the tab is closed, refreshed, or crashes, make one last
// attempt to persist whatever is in memory.
window.addEventListener('beforeunload', ()=>{ try{ save(); }catch(e){} });
// If another tab/window for this same site changes the data, don't silently
// overwrite it on the next save — reload it in first.
window.addEventListener('storage', (e)=>{
  if(e.key===STORAGE_KEY && e.newValue){
    try{ db = JSON.parse(e.newValue); render(); }catch(err){}
  }
});

/* =====================================================================
   EXPORT / IMPORT
   ===================================================================== */
function exportData(){
  const blob = new Blob([JSON.stringify(db,null,2)],{type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  const stamp = new Date().toISOString().slice(0,10);
  a.download = `yareu-tourney-backup-${stamp}.json`; a.click();
  toast('Backup downloaded ✓');
}
function importData(input){
  const f = input.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = e => {
    let parsed;
    try{ parsed = JSON.parse(e.target.result); }
    catch(err){ toast('Invalid backup file'); input.value=''; return; }
    if(!parsed || !Array.isArray(parsed.participants) || !Array.isArray(parsed.tournaments)){
      toast('This file doesn\'t look like a Yareu Tourney backup'); input.value=''; return;
    }
    showConfirm('Importing will replace everything currently saved on this device. Continue?', ()=>{
      db = parsed;
      save(); render(); toast('Backup restored ✓');
    });
    input.value='';
  };
  r.readAsText(f);
}

/* =====================================================================
   SIMULATION ENGINE
   ===================================================================== */
// Derives a strength rating from match history (win rate + GD/game) so
// predictions stay stable instead of re-rolling randomly each call.
// No history yet -> flat neutral 60 baseline.
function calcStrength(p){
  if(p.strengthEnabled){
    return {att:p.att||60, def:p.def||60, mid:p.mid||60, ovr:p.ovr||60};
  }
  // No manual rating: everyone starts flat and neutral. Actual strength for
  // an unrated participant comes entirely from calcInCompStrength, which
  // only looks at results inside one specific tournament — never career
  // totals, and never friendlies. That's what keeps winning one tournament
  // (or a bunch of friendlies) from making a team "good" anywhere else.
  return {att:60, def:60, mid:60, ovr:60};
}

// Blends overall rating with in-tournament form, so predictions reflect
// current performance, not just pre-tournament standing.
function calcInCompStrength(p, tId){
  const base = calcStrength(p);
  if(!tId) return base;
  const t = db.tournaments.find(x=>x.id===tId);
  if(!t) return base;
  // Gather every played match this participant has played in this tournament
  const played = [];
  const pid = p.id;
  const collect = arr => (arr||[]).forEach(m=>{ if(m.played&&(m.homeId===pid||m.awayId===pid)) played.push(m); });
  collect(t.matches);
  (t.rounds||[]).forEach(r=>collect(r));
  (t.koRounds||[]).forEach(r=>collect(r));
  (t.groups||[]).forEach(g=>collect(g.matches));
  (t.wBracket||[]).forEach(r=>collect(r));
  (t.lBracket||[]).forEach(r=>collect(r));
  collect(t.grandFinal);
  if(!played.length) return base; // no in-comp data yet — use base
  let w=0,d=0,l=0,gf=0,ga=0;
  played.forEach(m=>{
    const isH=m.homeId===pid;
    const mg=isH?m.hScore:m.aScore, og=isH?m.aScore:m.hScore;
    gf+=mg; ga+=og;
    if(m.penalties){ if(m.winner===pid) w++; else l++; }
    else if(mg>og) w++; else if(mg<og) l++; else d++;
  });
  const n=played.length;
  const wr=(w+d*0.5)/n;
  const gdpg=(gf-ga)/n;
  const compBase = 40+wr*50 + Math.max(-10,Math.min(10,gdpg*5));
  const compOvr = Math.max(35,Math.min(95,Math.round(compBase)));
  // If the participant has an overall rating, blend 50/50 overall vs in-comp
  // so early results don't wildly skew a well-established rating, but still
  // reflect current form. If unrated, in-comp form is 100% of the picture.
  const blendFactor = p.strengthEnabled ? 0.5 : 1.0;
  const blended = Math.round(base.ovr*(1-blendFactor) + compOvr*blendFactor);
  const delta = blended - base.ovr;
  return {
    att: Math.max(35,Math.min(95, base.att+Math.round(delta*0.5))),
    def: Math.max(35,Math.min(95, base.def+Math.round(delta*0.5))),
    mid: blended,
    ovr: blended
  };
}

function predictMatch(hId, aId, tId=null, homeAdvOverride=null){
  const h = db.participants.find(p=>p.id===hId);
  const a = db.participants.find(p=>p.id===aId);
  if(!h||!a) return {hWin:40,draw:20,aWin:40};
  const t = tId ? db.tournaments.find(x=>x.id===tId) : null;
  // Mirrors initSim's home-advantage rule so predicted percentages match
  // what the simulation will actually do. Outside a tournament (a
  // friendly), homeAdvOverride carries the person's own choice instead.
  const homeAdvOn = t ? t.homeAdvantage!==false : homeAdvOverride!==false;
  const homeBoost = homeAdvOn ? 4 : 0;
  const hs = calcInCompStrength(h, tId), as = calcInCompStrength(a, tId);
  const hStr = (hs.att*0.4+hs.mid*0.3+hs.def*0.3)+homeBoost;
  const aStr = (as.att*0.4+as.mid*0.3+as.def*0.3);
  const total = hStr + aStr;
  const hBase = (hStr/total)*100;
  const aBase = (aStr/total)*100;
  // Realistic draw chance: football averages ~24-26% draws, but much lower
  // when there's a clear quality gap. Cap at 26%, floor at 5%.
  const diff = Math.abs(hBase-aBase);
  // When teams are level (~50/50) draw is ~24%. Each % gap reduces it.
  const drawChance = Math.max(5, Math.min(26, 26 - diff*0.55));
  const rem = 100 - drawChance;
  const hWin = (hBase/100)*rem;
  const aWin = (aBase/100)*rem;
  let dr = Math.round(drawChance);
  let hw = Math.max(5, Math.round(hWin));
  let aw = Math.max(5, Math.round(aWin));
  const sum = hw+dr+aw;
  if(sum!==100){
    const diffSum = 100-sum;
    if(hw>=dr && hw>=aw) hw+=diffSum;
    else if(aw>=dr && aw>=hw) aw+=diffSum;
    else dr+=diffSum;
  }
  return {hWin:hw, draw:dr, aWin:aw};
}

function initSim(hId, aId, isKnockout, tournamentId, homeAdvOverride=null){
  const h = db.participants.find(p=>p.id===hId);
  const a = db.participants.find(p=>p.id===aId);
  const t = tournamentId ? db.tournaments.find(x=>x.id===tournamentId) : null;
  const homeAdvOn = t ? t.homeAdvantage!==false : homeAdvOverride!==false;
  const homeAdv = homeAdvOn ? 5 : 0; // default on
  // Use in-competition strength (not raw calcStrength) so the actual
  // simulation — not just the pre-match prediction percentages — is driven
  // by form within this tournament only.
  const hs = calcInCompStrength(h, tournamentId), as = calcInCompStrength(a, tournamentId);
  const hMid = hs.mid + homeAdv;
  const aMid = as.mid;
  const totalMid = hMid + aMid;
  const basePoss = hMid/totalMid; // the "true" underlying split for this match
  const isTeamMode = !!(h.players && a.players);
  // Base goal chance per minute, tuned for a ~2.6-2.8 total goals/match average
  const hAtkFactor = (hs.att/100) * (1-(as.def/200));
  const aAtkFactor = (as.att/100) * (1-(hs.def/200));
  return {
    home:h, away:a,
    hScore:0, aScore:0,
    minute:0, phase:'1st Half',
    isKnockout, isTeamMode,
    aet:false, penalties:false,
    events:[],
    // Strength snapshot taken once at kickoff — reused for every minute of
    // this match instead of being recalculated (which, for unrated sides,
    // used to re-roll a fresh random number every single minute).
    hStr:hs, aStr:as,
    // Live stats
    hShots:0,aShots:0,
    hSoT:0,aSoT:0,
    hCorners:0,aCorners:0,
    hFouls:0,aFouls:0,
    hSaves:0,aSaves:0,
    basePoss, // underlying target possession share for home (0-1), drives drift
    hPossRun: 0, aPossRun: 0, // running "minutes of possession" counters
    hPoss: 50, aPoss: 50, // live displayed possession, updated minute by minute
    // Per-minute probabilities
    hShotP: 0.06 + basePoss*0.04,
    aShotP: 0.05 + (1-basePoss)*0.04,
    // Of a shot, how likely it's on target — stronger attack = sharper shooting.
    hSoTRate: Math.min(0.62, 0.37 + ((hs.att-50)/300) + hAtkFactor*0.08),
    aSoTRate: Math.min(0.62, 0.37 + ((as.att-50)/300) + aAtkFactor*0.08),
    // Of a shot ON TARGET, how likely it beats the keeper. This is what a
    // goal actually is — there is no other way to score — so SoT and goals
    // can never come apart the way they used to. Tuned so an even matchup
    // averages out to a realistic ~2.6-2.8 total goals per match.
    hConvRate: Math.min(0.55, 0.35 + hAtkFactor*0.30),
    aConvRate: Math.min(0.52, 0.33 + aAtkFactor*0.30),
    hCornerP: isTeamMode ? 0.04 + basePoss*0.02 : 0,
    aCornerP: isTeamMode ? 0.03 + (1-basePoss)*0.02 : 0,
    hFoulP: 0.05, aFoulP: 0.05,
    yellowCards:{h:[],a:[]},
    redCards:{h:false,a:false},
    scorerLog:[], // {minute, team:'h'|'a', scorerId, scorerName, assistId, assistName}
    cardLog:[], // {minute, team:'h'|'a', playerId, playerName, type:'yellow'|'red'}
  };
}

// Resolves a roster entry to its live player object. Roster entries store
// a `linkedPlayerId` pointing at a standalone Player participant — ratings
// and identity always come from that single source of truth, never copied.
function rosterPlayers(team){
  if(!team || !team.players) return [];
  return team.players
    .map(entry=>{
      const linked = entry.linkedPlayerId ? db.participants.find(p=>p.id===entry.linkedPlayerId) : null;
      if(linked) return { id:linked.id, name:linked.name, pos:entry.pos||linked.pos||null, rating:linked.ovr ?? null };
      if(entry.linkedPlayerId && !linked){
        // Dangling reference (player was removed without cleanup, e.g. an
        // older save) — skip it rather than rendering a broken entry.
        return null;
      }
      // Backward compatibility: older saves may have free-text roster entries
      // with no linked player. These can't accrue personal goal/assist stats.
      return { id:entry.id, name:entry.name||'Unknown Player', pos:entry.pos||null, rating:entry.rating ?? null, unlinked:true };
    })
    .filter(Boolean);
}

// A player can only be on one team's squad at a time — this finds which
// team (if any) a given player participant is currently rostered on, so
// "add existing player" pickers can exclude anyone already taken instead
// of letting the same player end up double-booked on two squads.
function findPlayerTeam(playerId, excludeTeamId=null){
  return db.participants.find(t =>
    t.type==='team' && t.id!==excludeTeamId &&
    (t.players||[]).some(entry=>entry.linkedPlayerId===playerId)
  ) || null;
}

// Weighted-random pick of a goal scorer from the team's roster — forwards
// are most likely to score, then midfielders, then defenders/keepers.
function pickScorer(team){
  const roster = rosterPlayers(team);
  if(!roster.length) return null;
  const weight = pl => pl.pos==='FWD'?5 : pl.pos==='MID'?3 : pl.pos==='DEF'?1 : pl.pos==='GK'?0.05 : 2;
  const weights = roster.map(weight);
  const total = weights.reduce((s,v)=>s+v,0);
  let r = Math.random()*total;
  for(let i=0;i<roster.length;i++){ r-=weights[i]; if(r<=0) return roster[i]; }
  return roster[roster.length-1];
}
// Weighted-random pick of an assist provider — anyone but the scorer,
// favoring midfielders, then forwards, then defenders. Not every goal gets
// an assist (long shots, headers from set pieces, etc.)
function pickAssister(team, scorerId){
  const roster = rosterPlayers(team).filter(pl=>pl.id!==scorerId);
  if(!roster.length) return null;
  if(Math.random()<0.45) return null; // ~45% of goals are unassisted (solo runs, headers, deflections, long shots, penalties)
  const weight = pl => pl.pos==='MID'?4 : pl.pos==='FWD'?3 : pl.pos==='DEF'?1.5 : pl.pos==='GK'?0.2 : 2;
  const weights = roster.map(weight);
  const total = weights.reduce((s,v)=>s+v,0);
  let r = Math.random()*total;
  for(let i=0;i<roster.length;i++){ r-=weights[i]; if(r<=0) return roster[i]; }
  return roster[roster.length-1];
}

function simMinute(s){
  s.minute++;
  const r = ()=>Math.random();

  // Phase label
  if(s.minute<=45) s.phase='1st Half';
  else if(s.minute===46) s.phase='2nd Half';
  else if(s.minute>90&&s.minute<=105) s.phase='Extra Time 1st';
  else if(s.minute>105) s.phase='Extra Time 2nd';

  // Possession: each minute "belongs" to one side, weighted by the match's
  // underlying possession split but with enough randomness that the running
  // percentage actually drifts over 90 minutes instead of sitting still.
  const noise = (r()-0.5)*0.5; // -0.25 to +0.25 swing for this minute
  const minuteHChance = Math.min(0.9, Math.max(0.1, s.basePoss + noise));
  if(r() < minuteHChance) s.hPossRun++; else s.aPossRun++;
  const totalRun = s.hPossRun + s.aPossRun;
  if(totalRun>0){
    s.hPoss = Math.round((s.hPossRun/totalRun)*100);
    s.aPoss = 100 - s.hPoss;
  }

  // Red card effect
  const hPenalty = s.redCards.h ? 0.75 : 1;
  const aPenalty = s.redCards.a ? 0.75 : 1;

  let event = null;

  // Shots → shots on target → goal. This is a strict funnel: you cannot
  // score without first registering a shot on target this minute, so the
  // box score can never show a goal alongside 0 shots on target the way
  // independent dice rolls used to allow. Each side's shot attempt is
  // independent — both teams can attack in the same minute.
  let hG=false, aG=false;
  if(r()<s.hShotP*hPenalty){
    s.hShots++;
    if(r()<s.hSoTRate){
      s.hSoT++;
      if(r()<s.hConvRate*hPenalty) hG=true; else s.aSaves++;
    }
  }
  if(r()<s.aShotP*aPenalty){
    s.aShots++;
    if(r()<s.aSoTRate){
      s.aSoT++;
      // Two goals landing in the exact same minute is vanishingly rare in
      // real matches and would also create a confusing event log entry, so
      // if the home side already scored this minute, the away conversion
      // becomes a save instead rather than a simultaneous goal.
      if(!hG && r()<s.aConvRate*aPenalty) aG=true; else s.hSaves++;
    }
  }
  // Corners — team-mode only. With no bench, no out-of-bounds attacking
  // shape to speak of in a 1v1 player match, corners aren't a meaningful
  // stat, so individual-mode matches simply don't generate them (hCornerP/
  // aCornerP are set to 0 by initSim for that mode).
  if(r()<s.hCornerP*hPenalty) s.hCorners++;
  if(r()<s.aCornerP*aPenalty) s.aCorners++;
  // Fouls
  if(r()<s.hFoulP) s.hFouls++;
  if(r()<s.aFoulP) s.aFouls++;

  if(hG){
    s.hScore++;
    const scorer = pickScorer(s.home);
    const assister = scorer ? pickAssister(s.home, scorer.id) : null;
    s.scorerLog.push({minute:s.minute, team:'h', scorerId:scorer?.id||null, scorerName:scorer?.name||null, assistId:assister?.id||null, assistName:assister?.name||null});
    const scorerTxt = scorer ? ` — ${scorer.name}${assister?` (assist: ${assister.name})`:''}` : '';
    event={min:s.minute,cls:'tl-goal',text:`⚽ GOAL! ${s.home.name} ${s.hScore}–${s.aScore}${scorerTxt}`,team:'h'};
  } else if(aG){
    s.aScore++;
    const scorer = pickScorer(s.away);
    const assister = scorer ? pickAssister(s.away, scorer.id) : null;
    s.scorerLog.push({minute:s.minute, team:'a', scorerId:scorer?.id||null, scorerName:scorer?.name||null, assistId:assister?.id||null, assistName:assister?.name||null});
    const scorerTxt = scorer ? ` — ${scorer.name}${assister?` (assist: ${assister.name})`:''}` : '';
    event={min:s.minute,cls:'tl-goal',text:`⚽ GOAL! ${s.away.name} ${s.hScore}–${s.aScore}${scorerTxt}`,team:'a'};
  } else {
    // Cards — only in team mode. In individual mode there's no bench, no
    // referee to book a single player who's also the entire team, so we
    // skip this block entirely for player-vs-player matches.
    if(s.isTeamMode && r()<0.008){
      const isH = r()>0.5;
      // Don't issue any more cards to a side that already has a man sent off.
      if(!s.redCards[isH?'h':'a']){
        const team = isH ? s.home : s.away;
        // Pick a player who hasn't already been sent off this match
        const redCardedIds = new Set(
          s.cardLog.filter(c=>c.type==='red').map(c=>c.playerId).filter(Boolean)
        );
        const eligibleRoster = rosterPlayers(team).filter(pl=>!redCardedIds.has(pl.id));
        const carded = eligibleRoster.length ? eligibleRoster[Math.floor(r()*eligibleRoster.length)] : null;
        const cName = carded ? carded.name : team.name;
        const cId = carded ? carded.id : null;

        if(r()<0.07){ // straight red
          s.redCards[isH?'h':'a'] = true;
          s.cardLog.push({minute:s.minute, team:isH?'h':'a', playerId:cId, playerName:cName, type:'red'});
          event={min:s.minute,cls:'tl-red',text:`\uD83D\uDFE5 RED CARD \u2014 ${cName}`,team:isH?'h':'a'};
        } else {
          // Yellow — track per player; 2nd yellow to the same player = red
          if(!s.playerYellows) s.playerYellows={};
          const pKey = cId || (isH?'_h':'_a');
          if(!redCardedIds.has(cId)){
            s.playerYellows[pKey] = (s.playerYellows[pKey]||0)+1;
            if(isH) s.yellowCards.h.push(s.minute); else s.yellowCards.a.push(s.minute);
            if(s.playerYellows[pKey]>=2){
              s.redCards[isH?'h':'a'] = true;
              s.cardLog.push({minute:s.minute, team:isH?'h':'a', playerId:cId, playerName:cName, type:'red'});
              event={min:s.minute,cls:'tl-red',text:`\uD83D\uDFE8\uD83D\uDFE5 2nd Yellow! RED CARD \u2014 ${cName}`,team:isH?'h':'a'};
            } else {
              s.cardLog.push({minute:s.minute, team:isH?'h':'a', playerId:cId, playerName:cName, type:'yellow'});
              event={min:s.minute,cls:'tl-yellow',text:`\uD83D\uDFE8 Yellow Card \u2014 ${cName}`,team:isH?'h':'a'};
            }
          }
        }
      }
    }
  }
  if(event) s.events.unshift(event);
  return event;
}

function runPenalties(s){
  // Best of 5 then sudden death
  let hPens=0, aPens=0, round=0;
  const penEvents = [];
  while(round<5||(hPens===aPens)){
    round++;
    const hScored = Math.random()<0.75;
    const aScored = Math.random()<0.75;
    if(hScored) hPens++;
    if(aScored) aPens++;
    penEvents.push({min:'PEN',cls:'tl-pen',text:`Pen R${round}: ${s.home.name} ${hScored?'✅':'❌'} | ${s.away.name} ${aScored?'✅':'❌'}`});
    if(round>=5 && hPens!==aPens) break;
    if(round>20) break; // safety
  }
  s.penH = hPens; s.penA = aPens;
  s.penWinner = hPens>aPens?'h':'a';
  s.events = [...penEvents,...s.events];
}

/* =====================================================================
   LIVE SIM MODAL
   ===================================================================== */
let simCb = null; // callback when sim ends: (hScore, aScore, extra) => void

function launchLive(hId, aId, isKnockout, tournamentId, onComplete, legContext=null, homeAdvOverride=null){
  sim = initSim(hId, aId, isKnockout, tournamentId, homeAdvOverride);
  simCb = onComplete;
  // legContext (set only for leg 2 of a two-leg tie): leg 1's scores from
  // each side's perspective, so the live aggregate can be shown and kept
  // updated as leg 2's score changes — home/away are flipped between legs,
  // so leg1HomeAsAway/leg1AwayAsHome are leg 1's scores already reoriented
  // to match leg 2's home/away sides.
  sim.legContext = legContext;
  // Reset UI
  document.getElementById('live-clock').innerText = "0'";
  document.getElementById('live-phase').innerText = '1st Half';
  document.getElementById('live-home-name').innerText = sim.home.name;
  document.getElementById('live-away-name').innerText = sim.away.name;
  document.getElementById('live-scoreboard').innerText = '0 – 0';
  document.getElementById('live-timeline').innerHTML = '';
  document.getElementById('live-result-note').innerText = '';
  document.getElementById('skip-btn').classList.remove('hidden');
  document.getElementById('close-btn').classList.add('hidden');
  // Corners aren't a meaningful stat in a 1v1 individual match — hide the
  // row entirely rather than show a number that doesn't mean anything.
  document.getElementById('ls-corners-row').classList.toggle('hidden', !sim.isTeamMode);
  updateLiveStats();
  updateLiveAggNote();
  document.getElementById('live-modal').style.display = 'flex';
  simInterval = setInterval(tickLive, 50);
}

// Shows/updates the running aggregate line during a leg-2 live match.
// Aggregate = leg1's home scorer's total + leg2's away-side score for that
// same team (legs flip home/away), kept current every tick.
function updateLiveAggNote(){
  const el = document.getElementById('live-agg-note');
  if(!el) return;
  if(!sim || !sim.legContext){ el.style.display='none'; return; }
  const {leg1HomeScore, leg1AwayScore} = sim.legContext;
  // In leg 2, home/away are swapped relative to leg 1.
  const aggHome = leg1AwayScore + sim.hScore;
  const aggAway = leg1HomeScore + sim.aScore;
  el.style.display = 'block';
  el.innerText = `Agg: ${sim.home.name} ${aggHome}–${aggAway} ${sim.away.name}`;
}

// Whether the live match currently sits level and therefore needs to go to
// extra time / penalties. For a normal single match this is just the score.
// For leg 2 of a two-leg tie, the match's OWN score being level means
// nothing on its own (a 6-0 leg 1 followed by a 0-0 leg 2 is not a draw
// that needs deciding) — what matters is the AGGREGATE across both legs,
// so we add leg 1's carried-over score (sim.legContext) before comparing.
function isSimTied(s){
  if(!s.isKnockout) return false;
  if(s.legContext){
    const {leg1HomeScore, leg1AwayScore} = s.legContext; // already oriented to leg2's home/away
    return (leg1AwayScore + s.hScore) === (leg1HomeScore + s.aScore);
  }
  return s.hScore === s.aScore;
}

function tickLive(){
  if(!sim) return;
  const goesToET = isSimTied(sim);
  const maxMin = sim.isKnockout && sim.aet ? 120 : (goesToET && sim.minute>=90 ? 120 : 90);
  if(sim.minute < maxMin){
    if(sim.minute===90 && goesToET){
      sim.aet = true;
      sim.events.unshift({min:'90+',cls:'tl-info',text:'⏱ Extra Time!'});
      updateLiveUI();
    }
    simMinute(sim);
    updateLiveUI();
  } else {
    finishLive();
  }
}

function finishLive(){
  clearInterval(simInterval);
  simInterval=null;
  if(isSimTied(sim)){
    sim.penalties=true;
    runPenalties(sim);
    sim.events.unshift({min:'FT',cls:'tl-pen',text:`🏆 ${sim.penWinner==='h'?sim.home.name:sim.away.name} wins on penalties ${sim.penH}–${sim.penA}`});
  }
  document.getElementById('live-clock').innerText = sim.aet ? 'AET' : 'FT';
  document.getElementById('skip-btn').classList.add('hidden');
  document.getElementById('close-btn').classList.remove('hidden');
  // For leg 2 of a two-leg tie, the aggregate (not leg 2's own score) is
  // what decided whether this went to extra time/penalties — make that
  // explicit so a leg 2 that wasn't itself level still makes sense.
  let aggPrefix = '';
  if(sim.legContext){
    const {leg1HomeScore, leg1AwayScore} = sim.legContext;
    const aggHome = leg1AwayScore + sim.hScore, aggAway = leg1HomeScore + sim.aScore;
    aggPrefix = `Agg ${aggHome}–${aggAway} · `;
  }
  let note = '';
  if(sim.aet && !sim.penalties) note=`${aggPrefix}After Extra Time`;
  if(sim.penalties) note = sim.aet
    ? `${aggPrefix}${sim.hScore}–${sim.aScore} AET · ${sim.home.name} ${sim.penH}–${sim.penA} ${sim.away.name} (Pens)`
    : `${aggPrefix}${sim.hScore}–${sim.aScore} · ${sim.home.name} ${sim.penH}–${sim.penA} ${sim.away.name} (Pens)`;
  document.getElementById('live-result-note').innerText=note;
  updateLiveUI();
}

function updateLiveUI(){
  if(!sim) return;
  document.getElementById('live-clock').innerText = sim.minute + "'";
  document.getElementById('live-phase').innerText = sim.phase;
  document.getElementById('live-scoreboard').innerText = sim.hScore + ' – ' + sim.aScore;
  updateLiveStats();
  updateLiveAggNote();
  const tl = document.getElementById('live-timeline');
  tl.innerHTML = sim.events.map(e=>`<div class="tl-item"><div class="tl-min">${e.min}'</div><div class="${e.cls}">${e.text}</div></div>`).join('');
}

function updateLiveStats(){
  if(!sim) return;
  const hp=sim.hPoss, ap=sim.aPoss;
  setT('ls-poss-h', hp+'%');
  setT('ls-poss-a', ap+'%');
  const pb = document.getElementById('lsb-poss');
  if(pb) pb.style.width = hp+'%';
  setT('ls-shots-h', sim.hShots);
  setT('ls-shots-a', sim.aShots);
  setT('ls-sot-h', sim.hSoT);
  setT('ls-sot-a', sim.aSoT);
  setT('ls-corners-h', sim.hCorners);
  setT('ls-corners-a', sim.aCorners);
  setT('ls-fouls-h', sim.hFouls);
  setT('ls-fouls-a', sim.aFouls);
}

function setT(id, val){ const el=document.getElementById(id); if(el) el.innerText=val; }

function skipSimulation(){
  clearInterval(simInterval);
  simInterval=null;
  // Mirror tickLive's logic: regulation is 90 minutes, then a tied
  // knockout match (tied on aggregate, for leg 2 of a two-leg tie) goes to
  // extra time (120) before penalties.
  while(sim.minute < 90) simMinute(sim);
  if(isSimTied(sim)){
    sim.aet = true;
    sim.events.unshift({min:'90+',cls:'tl-info',text:'⏱ Extra Time!'});
    while(sim.minute < 120) simMinute(sim);
  }
  finishLive();
}

function closeLive(){
  document.getElementById('live-modal').style.display='none';
  if(simCb){
    simCb(sim.hScore, sim.aScore, {
      aet:sim.aet, penalties:sim.penalties,
      penH:sim.penH||0, penA:sim.penA||0,
      penWinner:sim.penWinner,
      stats:{hShots:sim.hShots,aShots:sim.aShots,hSoT:sim.hSoT,aSoT:sim.aSoT,
             hCorners:sim.hCorners,aCorners:sim.aCorners,hFouls:sim.hFouls,aFouls:sim.aFouls,
             hSaves:sim.hSaves,aSaves:sim.aSaves,
             hPoss:sim.hPoss,aPoss:sim.aPoss},
      scorerLog: sim.scorerLog||[], cardLog: sim.cardLog||[],
      events: sim.events||[]
    });
    simCb=null;
  }
  sim=null;
  render();
}

/* =====================================================================
   MANUAL RESULT ENTRY
   ===================================================================== */
// Mirrors launchLive's role, but instead of running the sim engine it
// collects a score (and, optionally, everything else — scorers, cards,
// stats) typed in by hand, then hands off to the exact same completion
// callback launchLive would have used. Callers don't need to know which
// mode is active.
let manualEntry = null;
let manualCb = null;
function openManualEntry(hId, aId, isKnockout, tournamentId, onComplete, legContext=null){
  const h = db.participants.find(p=>p.id===hId);
  const a = db.participants.find(p=>p.id===aId);
  if(!h||!a) return;
  manualCb = onComplete;
  manualEntry = {
    home:h, away:a, isKnockout, isTeamMode:!!(h.players&&a.players),
    hScore:0, aScore:0, aet:false, penalties:false, penH:0, penA:0,
    showAdvanced:false,
    scorers:[], cards:[],
    stats:{hShots:'',aShots:'',hSoT:'',aSoT:'',hCorners:'',aCorners:'',hFouls:'',aFouls:'',hSaves:'',aSaves:'',hPoss:'',aPoss:''}
  };
  document.getElementById('manual-modal-body').innerHTML = renderManualEntry();
  document.getElementById('manual-modal').classList.remove('hidden');
}
function closeManualEntry(){
  document.getElementById('manual-modal').classList.add('hidden');
  manualEntry = null;
  manualCb = null;
}
function reRenderManual(){
  if(!manualEntry) return;
  document.getElementById('manual-modal-body').innerHTML = renderManualEntry();
}
function manualSetScore(side, val){
  if(!manualEntry) return;
  const n = Math.max(0, parseInt(val)||0);
  if(side==='h') manualEntry.hScore = n; else manualEntry.aScore = n;
}
function manualToggle(field, val){
  if(!manualEntry) return;
  manualEntry[field] = val;
  reRenderManual();
}
function manualSetPen(side, val){
  if(!manualEntry) return;
  const n = Math.max(0, parseInt(val)||0);
  if(side==='h') manualEntry.penH = n; else manualEntry.penA = n;
}
function manualAddScorer(){
  manualEntry.scorers.push({side:'h', name:'', minute:''});
  reRenderManual();
}
function manualRemoveScorer(idx){
  manualEntry.scorers.splice(idx,1);
  reRenderManual();
}
function manualUpdateScorer(idx, field, val){
  if(!manualEntry.scorers[idx]) return;
  manualEntry.scorers[idx][field] = val;
}
function manualAddCard(){
  manualEntry.cards.push({side:'h', name:'', type:'yellow'});
  reRenderManual();
}
function manualRemoveCard(idx){
  manualEntry.cards.splice(idx,1);
  reRenderManual();
}
function manualUpdateCard(idx, field, val){
  if(!manualEntry.cards[idx]) return;
  manualEntry.cards[idx][field] = val;
}
function manualUpdateStat(field, val){
  manualEntry.stats[field] = val;
}
function renderManualEntry(){
  const m = manualEntry;
  const teamMode = m.isTeamMode;
  return `
    <div class="card-title">Enter Result</div>

      <div style="flex:1;text-align:center;">
        <div style="font-weight:700;font-size:.85rem;margin-bottom:6px;">${m.home.name}</div>
        <input type="number" min="0" inputmode="numeric" value="${m.hScore}" style="text-align:center;font-size:1.3rem;font-weight:800;" onchange="manualSetScore('h',this.value)">

        <div style="font-weight:700;font-size:.85rem;margin-bottom:6px;">${m.away.name}</div>

      <div class="form-row form-row-2" style="margin-bottom:10px;">

        <label class="check-item" style="display:flex;align-items:center;gap:8px;font-size:.78rem;"><input type="checkbox" ${m.penalties?'checked':''} onchange="manualToggle('penalties',this.checked)"> Decided on penalties</label>

          <div class="form-group" style="margin-bottom:0;"><label class="form-label">${m.away.name} pens</label><input type="number" min="0" value="${m.penA}" onchange="manualSetPen('a',this.value)"></div>

            <button class="btn-icon" style="flex:0 0 auto;" onclick="manualRemoveScorer(${i})">✕</button>
          </div>
        `).join('')}
        <button class="btn btn-outline btn-sm" onclick="manualAddScorer()">+ Add Scorer</button>

        ${teamMode?`
          <div class="form-label" style="margin:14px 0 6px;">Cards</div>
          ${m.cards.map((c,i)=>`
            <div style="display:flex;gap:6px;align-items:center;margin-bottom:6px;">
              <select style="flex:0 0 84px;" onchange="manualUpdateCard(${i},'side',this.value)">
                <option value="h" ${c.side==='h'?'selected':''}>${m.home.name}</option>
                <option value="a" ${c.side==='a'?'selected':''}>${m.away.name}</option>
              </select>
              <input placeholder="Player name" value="${c.name}" style="flex:1;" onchange="manualUpdateCard(${i},'name',this.value)">
              <select style="flex:0 0 90px;" onchange="manualUpdateCard(${i},'type',this.value)">
                <option value="yellow" ${c.type==='yellow'?'selected':''}>🟨 Yellow</option>
                <option value="red" ${c.type==='red'?'selected':''}>🟥 Red</option>
              </select>
              <button class="btn-icon" style="flex:0 0 auto;" onclick="manualRemoveCard(${i})">✕</button>
            </div>
          `).join('')}
          <button class="btn btn-outline btn-sm" onclick="manualAddCard()">+ Add Card</button>

        <div class="form-label" style="margin:14px 0 6px;">Match stats</div>
        <div class="form-row form-row-2">

          <input placeholder="${m.away.name} shots" type="number" min="0" value="${m.stats.aShots}" onchange="manualUpdateStat('aShots',this.value)">
          <input placeholder="${m.home.name} shots on target" type="number" min="0" value="${m.stats.hSoT}" onchange="manualUpdateStat('hSoT',this.value)">
          <input placeholder="${m.away.name} shots on target" type="number" min="0" value="${m.stats.aSoT}" onchange="manualUpdateStat('aSoT',this.value)">
          ${teamMode?`
          <input placeholder="${m.home.name} corners" type="number" min="0" value="${m.stats.hCorners}" onchange="manualUpdateStat('hCorners',this.value)">
          <input placeholder="${m.away.name} corners" type="number" min="0" value="${m.stats.aCorners}" onchange="manualUpdateStat('aCorners',this.value)">
          <input placeholder="${m.home.name} saves" type="number" min="0" value="${m.stats.hSaves}" onchange="manualUpdateStat('hSaves',this.value)">
          <input placeholder="${m.away.name} saves" type="number" min="0" value="${m.stats.aSaves}" onchange="manualUpdateStat('aSaves',this.value)">
          `:''}
          <input placeholder="${m.home.name} fouls" type="number" min="0" value="${m.stats.hFouls}" onchange="manualUpdateStat('hFouls',this.value)">
          <input placeholder="${m.away.name} fouls" type="number" min="0" value="${m.stats.aFouls}" onchange="manualUpdateStat('aFouls',this.value)">
        </div>
      </div>
    `:''}
    <div style="display:flex;gap:8px;margin-top:16px;">
      <button class="btn btn-outline btn-full" onclick="closeManualEntry()">Cancel</button>
      <button class="btn btn-primary btn-full" onclick="submitManualEntry()">Save Result</button>

function submitManualEntry(){
  const m = manualEntry;
  if(!m) return;
  if(m.penalties && m.penH===m.penA){ toast("Penalty shootouts can't end level"); return; }
  const hasStat = v => v!=='' && v!=null && !isNaN(v);
  const numOrZero = v => hasStat(v) ? parseInt(v) : 0;
  const anyStatsEntered = Object.values(m.stats).some(hasStat);
  const scorerLog = m.scorers.filter(s=>s.name.trim()).map(s=>({
    team: s.side, scorerId:null, scorerName: s.name.trim(), assistId:null, assistName:null,
    minute: s.minute?parseInt(s.minute):null
  }));
  const cardLog = m.cards.filter(c=>c.name.trim()).map(c=>({
    team: c.side, playerId:null, playerName: c.name.trim(), type: c.type,
    minute: null
  }));
  // Build a simple timeline out of whatever was entered, so the recap isn't
  // empty just because this match wasn't simulated minute-by-minute.
  const events = [];
  scorerLog.forEach(s=>{
    const who = s.team==='h'?m.home.name:m.away.name;
    events.unshift({min: s.minute??'?', cls:'tl-goal', text:`⚽ Goal! ${s.scorerName} (${who})`});
  });
  cardLog.forEach(c=>{
    const who = c.team==='h'?m.home.name:m.away.name;
    events.unshift({min:'?', cls: c.type==='red'?'tl-red':'tl-yellow', text:`${c.type==='red'?'🟥':'🟨'} ${c.playerName} (${who})`});
  });
  const extra = {
    aet: m.isKnockout && m.aet,
    penalties: m.isKnockout && m.penalties,
    penH: m.penalties?m.penH:0,
    penA: m.penalties?m.penA:0,
    penWinner: m.penalties ? (m.penH>m.penA?'h':'a') : undefined,
    stats: anyStatsEntered ? {
      hShots:numOrZero(m.stats.hShots), aShots:numOrZero(m.stats.aShots),
      hSoT:numOrZero(m.stats.hSoT), aSoT:numOrZero(m.stats.aSoT),
      hCorners:numOrZero(m.stats.hCorners), aCorners:numOrZero(m.stats.aCorners),
      hFouls:numOrZero(m.stats.hFouls), aFouls:numOrZero(m.stats.aFouls),
      hSaves:numOrZero(m.stats.hSaves), aSaves:numOrZero(m.stats.aSaves),
      hPoss:hasStat(m.stats.hPoss)?parseInt(m.stats.hPoss):50,
      aPoss:hasStat(m.stats.aPoss)?parseInt(m.stats.aPoss):50
    } : null,
    scorerLog, cardLog, events:[]
  };
  const hS = m.hScore, aS = m.aScore;
  const cb = manualCb;
  document.getElementById('manual-modal').classList.add('hidden');
  manualEntry = null; manualCb = null;
  if(cb) cb(hS, aS, extra);
}

/* =====================================================================
   TAB NAVIGATION
   ===================================================================== */
function switchTab(tab){
  activeTab=tab;
  activeTournamentId=null;
  activeProfileId=null;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  const el = document.getElementById('nav-'+tab);
  if(el) el.classList.add('active');
  render();
}

function render(){
  const app=document.getElementById('app');
  if(activeTab==='dash') renderDash(app);
  else if(activeTab==='participants') renderParticipants(app);
  else if(activeTab==='tournaments'){
    if(activeTournamentId) renderTournament(app, activeTournamentId);
    else renderTournamentList(app);
  }
  else if(activeTab==='friendlies'){
    renderFriendlies(app);
  }
  else if(activeTab==='profile'){
    renderProfile(app, activeProfileId);
  }
}

function matchesRemaining(t){
  if(t.format==='double_elimination') return !t.champion;

  // of duplicating (and drifting from) that logic.
  return getRemainingMatches(t).length>0;
}

function formatLabel(f){
  return {league:'Round Robin',knockout:'Single Elim',double_elimination:'Double Elim',group_knockout:'Groups + KO',league_knockout:'League + KO'}[f]||f;
}

function calcOvr(att, mid, def){
  const raw = Math.round((att*0.4 + mid*0.3 + def*0.3));
  return Math.max(1, Math.min(99, raw));
}

// A team's ATT/MID/DEF/OVR is simply the average of its rated squad
// players, split by position group: FWD ratings drive ATT, MID ratings
// drive MID, GK+DEF ratings drive DEF. Players with no position or no
// rating yet are excluded from the position buckets but (if rated) still
// count toward the overall average used as a fallback for empty buckets.
// Returns null if the roster has no rated players at all.
function calcTeamRatingFromRoster(rosterEntries){
  const resolved = rosterPlayers({players:rosterEntries||[]});
  const rated = resolved.filter(pl=>pl.rating!=null && !isNaN(pl.rating));
  if(rated.length===0) return null;
  const bucket = {FWD:[], MID:[], DEF:[], none:[]};
  rated.forEach(pl=>{
    const key = pl.pos==='FWD'?'FWD':pl.pos==='MID'?'MID':(pl.pos==='DEF'||pl.pos==='GK')?'DEF':'none';
    bucket[key].push(pl.rating);
  });
  const avg = arr=>arr.length?arr.reduce((s,v)=>s+v,0)/arr.length:null;
  const overallAvg = avg(rated.map(pl=>pl.rating));
  const att = Math.round(avg(bucket.FWD) ?? avg(bucket.none) ?? overallAvg);
  const mid = Math.round(avg(bucket.MID) ?? overallAvg);
  const def = Math.round(avg(bucket.DEF) ?? overallAvg);
  const clamp = v=>Math.max(1, Math.min(99, v));
  const cAtt=clamp(att), cMid=clamp(mid), cDef=clamp(def);
  return {att:cAtt, mid:cMid, def:cDef, ovr:calcOvr(cAtt,cMid,cDef)};
}

function recalcDraftOvr(){
  draftStats.att = readStat('p-att');
  draftStats.mid = readStat('p-mid');
  draftStats.def = readStat('p-def');
  const el = document.getElementById('p-ovr-val');
  if(el) el.innerText = calcOvr(draftStats.att, draftStats.mid, draftStats.def);
}
// Reads a stat input's current value for live preview purposes WITHOUT
// rewriting the field — lets the person freely clear/retype the number.
// Falls back to a sane default only when computing the preview, never
// forces that fallback into the input itself.
function readStat(id){
  const input = document.getElementById(id);
  if(!input) return 75;
  const v = parseInt(input.value);
  if(isNaN(v)) return 75;
  return Math.max(1, Math.min(99, v));
}
// Clamps the field to a valid 1-99 integer once the person leaves it
// (onblur), so an empty or out-of-range value left behind gets fixed up
// without interrupting them while they're still typing.
function clampStatField(input){
  if(!input) return;
  let v = parseInt(input.value);
  if(isNaN(v)) v = 75;
  v = Math.max(1, Math.min(99, v));
  input.value = v;
  recalcDraftOvr();
}
// Same clamp behavior as clampStatField, but for the optional roster
// quick-create stat fields — leaves the field blank if it was left blank
// (no forced default) and refreshes the matching roster OVR preview.
function clampOptionalStatField(input, onRecalc){
  if(!input) return;
  if(input.value.trim()===''){ onRecalc(); return; }
  let v = parseInt(input.value);
  if(isNaN(v)){ input.value=''; onRecalc(); return; }
  v = Math.max(1, Math.min(99, v));
  input.value = v;
  onRecalc();
}

// Quick-create: makes a real standalone Player participant right away (so
// it's reusable on other teams later too), then links it into the
// in-progress team's staged roster. Rating uses the same ATT/MID/DEF
// overall editor as a standalone player — no single "just type an OVR"
// shortcut — so a player created here behaves identically to one added
// from the Participants tab.
function addDraftRosterPlayer(){
  const nameInput = document.getElementById('p-roster-name');
  const posSelect = document.getElementById('p-roster-pos');
  const name = nameInput.value.trim();
  if(!name) return toast('Enter a player name');
  const att=readOptionalStat('p-roster-att'), mid=readOptionalStat('p-roster-mid'), def=readOptionalStat('p-roster-def');
  const rated = att!=null && mid!=null && def!=null;
  const pos = posSelect.value||null;
  const newPlayer = {
    id:uid(), name, type:'player', strengthEnabled: rated,
    att: rated?att:null, mid: rated?mid:null, def: rated?def:null, ovr: rated?calcOvr(att,mid,def):null,
    pos, career:{goals:0,assists:0,yellows:0,reds:0},
    form:[], stats:{played:0,wins:0,draws:0,losses:0,gf:0,ga:0,cleanSheets:0}
  };
  db.participants.push(newPlayer);
  newPRoster.push({id:uid(), linkedPlayerId:newPlayer.id, pos});
  nameInput.value=''; posSelect.value='';
  ['p-roster-att','p-roster-mid','p-roster-def'].forEach(id=>{const el=document.getElementById(id); if(el) el.value='';});
  save(); render();
  document.getElementById('p-roster-name')?.focus();
}
// Links an already-existing standalone Player participant into the

// in-progress team's staged roster.
function addExistingDraftRosterPlayer(){
  const sel = document.getElementById('p-roster-existing');

// Quick-create for an existing saved team's squad — same ATT/MID/DEF
// overall editor as everywhere else, no single-number OVR shortcut.
function addRosterPlayer(teamId){
  const p = db.participants.find(x=>x.id===teamId);
  if(!p) return;
  const nameInput = document.getElementById('roster-name-'+teamId);
  const posSelect = document.getElementById('roster-pos-'+teamId);

  const att=readOptionalStat('roster-att-'+teamId), mid=readOptionalStat('roster-mid-'+teamId), def=readOptionalStat('roster-def-'+teamId);

  const newPlayer = {
    id:uid(), name, type:'player', strengthEnabled: rated,
    att: rated?att:null, mid: rated?mid:null, def: rated?def:null, ovr: rated?calcOvr(att,mid,def):null, pos,
    career:{goals:0,assists:0,yellows:0,reds:0},
    form:[], stats:{played:0,wins:0,draws:0,losses:0,gf:0,ga:0,cleanSheets:0}
  };

function addExistingRosterPlayer(teamId){
  const p = db.participants.find(x=>x.id===teamId);
  if(!p) return;
  const sel = document.getElementById('roster-existing-'+teamId);
  const posSel = document.getElementById('roster-existing-pos-'+teamId);

  if(!playerId) return toast('Choose a player to add');

  if(existingTeam) return toast(`Already on ${existingTeam.name}'s squad`);

}
function removeRosterPlayer(teamId, playerId){

  p.players = p.players.filter(pl=>pl.id!==playerId);
  syncTeamRatingFromRoster(p);
  save(); render();
}
// Keeps a saved team's ATT/MID/DEF/OVR in sync with its roster every time
// the roster changes. A team's rating is *always* the average of its
// rated squad players — there is no manual override for teams.
function syncTeamRatingFromRoster(p){
  const fromRoster = calcTeamRatingFromRoster(p.players);
  if(fromRoster){
    p.att=fromRoster.att; p.mid=fromRoster.mid; p.def=fromRoster.def; p.ovr=fromRoster.ovr;
    p.strengthEnabled = true;
  } else {
    p.att=null; p.mid=null; p.def=null; p.ovr=null;
    p.strengthEnabled = false;
  }
}

function addParticipant(){
  const name = document.getElementById('p-name').value.trim();
  if(!name) return toast('Enter a name');
  const type = newPType;

  if(type==='player'){
    const strengthEnabled = draftStrengthOn;
    // Read directly from the DOM (clamped) so the saved rating always
    // matches exactly what's on screen, even if the field never lost focus.
    const att = strengthEnabled ? readStat('p-att') : null;
    const mid = strengthEnabled ? readStat('p-mid') : null;
    const def = strengthEnabled ? readStat('p-def') : null;
    db.participants.push({
      id:uid(), name, type, strengthEnabled,
      att, mid, def,
      ovr: strengthEnabled ? calcOvr(att,mid,def) : null,
      career:{goals:0,assists:0,yellows:0,reds:0},
      form:[], stats:{played:0,wins:0,draws:0,losses:0,gf:0,ga:0,cleanSheets:0}
    });
  } else {
    // Teams always derive their rating from the roster — there's no
    // manual ATT/MID/DEF entry for a team.
    const fromRoster = calcTeamRatingFromRoster(newPRoster);
    db.participants.push({
      id:uid(), name, type,
      strengthEnabled: !!fromRoster,
      att: fromRoster?fromRoster.att:null,
      mid: fromRoster?fromRoster.mid:null,
      def: fromRoster?fromRoster.def:null,
      ovr: fromRoster?fromRoster.ovr:null,
      players: newPRoster.map(pl=>({...pl})),
      form:[], stats:{played:0,wins:0,draws:0,losses:0,gf:0,ga:0,cleanSheets:0}
    });
  }

  newPRoster = [];
  draftStrengthOn = false;
  draftStats = {att:75, mid:75, def:75};
  save(); render(); toast(`${name} added`);
  const nameEl = document.getElementById('p-name');
  if(nameEl) nameEl.focus();
}

function removeParticipant(id){
  const p = db.participants.find(x=>x.id===id);
  if(!p) return;
  const linkedOnTeams = p.type==='player'
    ? db.participants.filter(t=>t.type==='team' && (t.players||[]).some(rp=>rp.linkedPlayerId===id))
    : [];
  const warning = linkedOnTeams.length
    ? ` They're on ${linkedOnTeams.length} squad${linkedOnTeams.length===1?'':'s'} (${linkedOnTeams.map(t=>t.name).join(', ')}) — removing them will also remove them from those rosters.`
    : '';
  showConfirm(`Remove "${p.name}"? This can't be undone.${warning}`, ()=>{
    // Strip any dangling roster links pointing at this player before
    // removing them, then recompute affected teams' ratings.
    linkedOnTeams.forEach(t=>{
      t.players = (t.players||[]).filter(rp=>rp.linkedPlayerId!==id);
      syncTeamRatingFromRoster(t);
    });
    db.participants = db.participants.filter(x=>x.id!==id);
    save(); render();
  });
}

function toggleEditRating(id){

function recalcEditOvr(id){
  const att = readStat('edit-att-'+id);

}
function saveEditedRating(id){
  const p = db.participants.find(x=>x.id===id);
  if(!p) return;
  const att = readStat('edit-att-'+id);
  const mid = readStat('edit-mid-'+id);
  const def = readStat('edit-def-'+id);
  p.strengthEnabled = true;
  p.att = att; p.mid = mid; p.def = def;
  p.ovr = calcOvr(att, mid, def);
  editingRatingId = null;
  save(); render(); toast(`${p.name} rating updated`);
  // This player may be linked into one or more team rosters — refresh
  // every team's rating so it reflects the new number immediately.
  syncAllTeamRatings();
}
function disableRating(id){
  const p = db.participants.find(x=>x.id===id);
  if(!p) return;
  p.strengthEnabled = false;
  p.att = null; p.mid = null; p.def = null; p.ovr = null;
  editingRatingId = null;
  save(); render(); toast(`Strength rating disabled for ${p.name}`);
  syncAllTeamRatings();
}
// Recomputes every team's rating from its current roster. Called whenever
// a standalone player's rating changes, since teams may have that player
// linked in and need to reflect the new number right away.
function syncAllTeamRatings(){
  db.participants.filter(p=>p.type==='team').forEach(syncTeamRatingFromRoster);
}
