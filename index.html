      <div id="tn-third-place-row" class="hidden">
        <label class="switch-row" style="padding:6px 2px;margin-bottom:12px;">
          <div>
            <div class="switch-label" style="font-size:.82rem;">Third Place Match</div>
            <div class="switch-sub">Semi-final losers play for bronze, before the final</div>
          </div>
          <div class="switch">
            <input type="checkbox" id="tn-third-place">
            <div class="switch-track"><div class="switch-thumb"></div></div>
          </div>
        </label>
      </div>


      <button class="btn btn-primary btn-full" onclick="createTournament()">Generate Tournament</button>
    </div>
    <div class="section-header"><div class="section-title">${db.tournaments.length} Tournaments</div></div>
  `;

  if(db.tournaments.length===0){
    html+=`<div class="empty-state"><div class="empty-state-icon">🏆</div><div class="empty-state-title">No tournaments yet</div></div>`;
  } else {
    db.tournaments.slice().reverse().forEach(t=>{
      const champ = t.champion ? db.participants.find(p=>p.id===t.champion) : null;
      const played = countPlayed(t), total = countTotal(t);
      html+=`<div class="card" style="cursor:pointer;" onclick="openTournament('${t.id}')">
        <div style="display:flex;align-items:flex-start;gap:8px;">
          <div style="flex:1;">
            <div style="font-weight:700;">${t.name}</div>
            <div style="font-size:.7rem;color:var(--text3);margin-top:3px;">${formatLabel(t.format)} · ${t.participantIds.length} ${t.type==='team'?'teams':'players'} · ${t.legs===1?'Single Leg':t.legs===2?'H&A':`${t.legs} Legs`}</div>
          </div>
          ${champ?`<div class="pill pill-gold">🏆 ${champ.name}</div>`:played<total?`<div class="pill pill-blue">${played}/${total}</div>`:`<div class="pill pill-gray">0 matches</div>`}
          <button class="btn btn-icon btn-sm" onclick="event.stopPropagation();deleteTournament('${t.id}')">✕</button>
        </div>
        ${played>0?`
        <div style="margin-top:8px;">
          <div class="progress-track"><div class="progress-fill" style="width:${Math.round(played/total*100)||0}%"></div></div>
        </div>`:''}
      </div>`;
    });
  }
  app.innerHTML=html;
  updateTnFormatUI();
}

function countPlayed(t){
  if(t.format==='league') return (t.matches||[]).filter(m=>m.played).length;
  if(t.format==='knockout') return (t.rounds||[]).flat().filter(m=>m.played&&m.homeId&&m.awayId).length + (t.thirdPlaceMatch?.played?1:0);
  if(t.format==='group_knockout'){
    const gp=(t.groups||[]).flatMap(g=>g.matches||[]).filter(m=>m.played).length;
    const kp=(t.koRounds||[]).flat().filter(m=>m.played&&m.homeId&&m.awayId).length;
    return gp+kp+(t.thirdPlaceMatch?.played?1:0);
  }
  if(t.format==='double_elimination'){
    const w=(t.wBracket||[]).flat().filter(m=>m.played&&m.homeId).length;
    const l=(t.lBracket||[]).flat().filter(m=>m.played&&m.homeId).length;
    const gf=(t.grandFinal||[]).filter(m=>m.played&&m.homeId&&m.awayId).length;
    return w+l+gf;
  }
  if(t.format==='league_knockout'){
    const lp=(t.matches||[]).filter(m=>m.played).length;
    const kp=(t.koRounds||[]).flat().filter(m=>m.played&&m.homeId&&m.awayId).length;
    return lp+kp+(t.thirdPlaceMatch?.played?1:0);
  }
  return 0;
}
function countTotal(t){
  if(t.format==='league') return (t.matches||[]).length;
  if(t.format==='knockout') return (t.rounds||[]).flat().filter(m=>m.homeId&&m.awayId).length + (t.thirdPlaceMatch?.homeId&&t.thirdPlaceMatch?.awayId?1:0);
  if(t.format==='group_knockout'){
    const gm=(t.groups||[]).flatMap(g=>g.matches||[]).length;
    const km=(t.koRounds||[]).flat().filter(m=>m.homeId&&m.awayId).length;
    return gm+km+(t.thirdPlaceMatch?.homeId&&t.thirdPlaceMatch?.awayId?1:0);
  }
  if(t.format==='double_elimination'){
    const w=(t.wBracket||[]).flat().length;
    const l=(t.lBracket||[]).flat().length;
    return w+l+1;
  }
  if(t.format==='league_knockout'){
    const lm=(t.matches||[]).length;
    const km=(t.koRounds||[]).flat().filter(m=>m.homeId&&m.awayId).length;
    return lm+km+(t.thirdPlaceMatch?.homeId&&t.thirdPlaceMatch?.awayId?1:0);
  }
  return 0;
}

// Returns every match in a tournament regardless of format, each tagged
// with enough context (groupId, a human stage label, isKO) to navigate
// straight back to it via openRecap or triggerSim. Used by the profile
// page's match history and could be reused anywhere else that needs a
// flat view across every bracket/group/round shape.
function allMatchesOf(t){
  const out = [];
  if(t.format==='league'){
    (t.matches||[]).forEach(m=>out.push({m, groupId:null, isKO:false, stage:`Matchday ${m.round||1}`}));
  } else if(t.format==='knockout'){
    const stageMap = mapKORoundLabels(t.rounds||[]);
    (t.rounds||[]).forEach((r,ri)=>{
      const {logicalIdx, totalLogical, legNum} = stageMap[ri];
      const legSuffix = legNum ? ` Leg ${legNum}` : '';
      r.filter(m=>m.homeId&&m.awayId).forEach(m=>{
        out.push({m, groupId:null, isKO:true, stage:roundName(logicalIdx, totalLogical)+legSuffix});
      });
    });
  } else if(t.format==='double_elimination'){
    (t.wBracket||[]).forEach((r,ri)=>{
      const label = roundName(ri, t.wBracket.length);
      r.filter(m=>m.homeId&&m.awayId).forEach(m=>out.push({m, groupId:null, isKO:true, stage:`Winners — ${label}`}));
    });
    (t.lBracket||[]).forEach((r,ri)=>{
      r.filter(m=>m.homeId&&m.awayId).forEach(m=>out.push({m, groupId:null, isKO:true, stage:`Losers Round ${ri+1}`}));
    });
    (t.grandFinal||[]).filter(m=>m.homeId&&m.awayId).forEach(m=>out.push({m, groupId:null, isKO:true, stage:'Grand Final'}));
  } else if(t.format==='group_knockout'){
    (t.groups||[]).forEach(g=>{
      (g.matches||[]).forEach(m=>out.push({m, groupId:g.id, isKO:false, stage:`${g.name} — Matchday ${m.round||1}`}));
    });
    const stageMap = mapKORoundLabels(t.koRounds||[]);
    (t.koRounds||[]).forEach((r,ri)=>{
      const {logicalIdx, totalLogical, legNum} = stageMap[ri];
      const label = roundName(logicalIdx, totalLogical)+(legNum?` Leg ${legNum}`:'');
      r.filter(m=>m.homeId&&m.awayId).forEach(m=>out.push({m, groupId:null, isKO:true, stage:label}));
    });
  } else if(t.format==='league_knockout'){
    (t.matches||[]).forEach(m=>out.push({m, groupId:null, isKO:false, stage:`Matchday ${m.round||1}`}));
    const stageMap = mapKORoundLabels(t.koRounds||[]);
    (t.koRounds||[]).forEach((r,ri)=>{
      const {logicalIdx, totalLogical, legNum} = stageMap[ri];
      const label = roundName(logicalIdx, totalLogical)+(legNum?` Leg ${legNum}`:'');
      r.filter(m=>m.homeId&&m.awayId).forEach(m=>out.push({m, groupId:null, isKO:true, stage:label}));
    });
  }
  // Third place match — possible in any of the formats above except double elimination.
  if(t.thirdPlaceMatch && t.thirdPlaceMatch.homeId && t.thirdPlaceMatch.awayId){
    out.push({m:t.thirdPlaceMatch, groupId:null, isKO:true, stage:'Third Place'});
  }
  return out;
}

// Builds a single chronological history for a participant across every
// tournament they've appeared in plus every friendly — the data backing
// the profile page. Each entry carries everything needed to render a
// match-card-style row and reopen its recap.
function getParticipantHistory(pId){
  const entries = [];
  db.tournaments.forEach(t=>{
    allMatchesOf(t).forEach(({m, groupId, stage})=>{
      if(!m.played) return;
      if(m.homeId!==pId && m.awayId!==pId) return;
      entries.push({
        m, tId:t.id, tName:t.name, stage, groupId,
        opponentId: m.homeId===pId ? m.awayId : m.homeId,
        isHome: m.homeId===pId,
        playedAt: m.playedAt || t.created || 0, // legacy saves from before match timestamps existed fall back to tournament creation order
        kind:'tournament'
      });
    });
  });
  (db.friendlies||[]).forEach(f=>{
    if(!f.played) return;
    if(f.homeId!==pId && f.awayId!==pId) return;
    entries.push({
      m:f, tId:null, tName:'Friendly', stage:'Friendly', groupId:null,
      opponentId: f.homeId===pId ? f.awayId : f.homeId,
      isHome: f.homeId===pId,
      playedAt: f.playedAt || 0,
      kind:'friendly'
    });
  });
  // Newest first. Tournament matches don't all carry a real timestamp (only
  // the tournament's creation time), so ordering across very old data is
  // necessarily approximate — friendlies (which do have real timestamps)
  // will sort correctly relative to each other and to newer tournaments.
  entries.sort((a,b)=>b.playedAt-a.playedAt);
  return entries;
}

function openProfile(pId){
  profileFromTab = activeTab;
  activeProfileId = pId;
  activeTab = 'profile';
  render();
}
function closeProfile(){
  activeTab = profileFromTab;
  activeProfileId = null;
  render();
}

function renderProfile(app, pId){
  const p = db.participants.find(x=>x.id===pId);
  if(!p){
    app.innerHTML = `<div class="empty-state"><div class="empty-state-title">Participant not found</div><button class="btn btn-outline" style="margin-top:10px;" onclick="closeProfile()">← Back</button></div>`;
    return;
  }
  const st = p.stats || {played:0,wins:0,draws:0,losses:0,gf:0,ga:0,cleanSheets:0};
  const winPct = st.played ? Math.round((st.wins/st.played)*100) : 0;
  const history = getParticipantHistory(pId);
  const form = (p.form||[]).slice(-10);

  let html = `
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;">
      <button class="btn btn-outline btn-sm btn-icon" onclick="closeProfile()">←</button>
      <div style="flex:1;">
        <div style="font-weight:800;font-size:1.05rem;">${p.name}</div>
        <div style="font-size:.7rem;color:var(--text3);">${p.type==='player'?'Player':'Team'}${p.strengthEnabled?` · OVR ${p.ovr}`:''}</div>
      </div>
    </div>

    <div class="card" style="display:grid;grid-template-columns:repeat(4,1fr);text-align:center;gap:6px;">
      <div><div style="font-size:1.2rem;font-weight:900;">${st.played}</div><div class="card-title" style="margin:0;">Played</div></div>
      <div><div style="font-size:1.2rem;font-weight:900;color:var(--green);">${st.wins}</div><div class="card-title" style="margin:0;">Won</div></div>
      <div><div style="font-size:1.2rem;font-weight:900;color:var(--text3);">${st.draws}</div><div class="card-title" style="margin:0;">Drawn</div></div>
      <div><div style="font-size:1.2rem;font-weight:900;color:var(--red);">${st.losses}</div><div class="card-title" style="margin:0;">Lost</div></div>
    </div>
    <div class="card" style="display:grid;grid-template-columns:repeat(3,1fr);text-align:center;gap:6px;">
      <div><div style="font-size:1.1rem;font-weight:800;">${st.gf}</div><div class="card-title" style="margin:0;">Goals For</div></div>
      <div><div style="font-size:1.1rem;font-weight:800;">${st.ga}</div><div class="card-title" style="margin:0;">Goals Against</div></div>
      <div><div style="font-size:1.1rem;font-weight:800;color:${st.gf-st.ga>=0?'var(--green)':'var(--red)'};">${st.gf-st.ga>=0?'+':''}${st.gf-st.ga}</div><div class="card-title" style="margin:0;">Goal Diff</div></div>
    </div>
    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
        <div class="card-title" style="margin:0;">Win Rate</div>
        <div style="font-weight:800;color:var(--accent2);">${winPct}%</div>
      </div>
      <div class="progress-track"><div class="progress-fill" style="width:${winPct}%"></div></div>
      ${st.played?`<div style="font-size:.68rem;color:var(--text3);margin-top:8px;">${st.cleanSheets||0} clean sheet${st.cleanSheets===1?'':'s'}</div>`:''}
    </div>
    ${form.length?`<div class="card">
      <div class="card-title">Recent Form</div>
      <div class="form-dots" style="gap:5px;">${form.map(f=>`<div class="fdot fdot-${f}">${f}</div>`).join('')}</div>
    </div>`:''}
    ${p.type==='player'&&p.career&&(p.career.goals||p.career.assists||p.career.yellows||p.career.reds)?`<div class="card">
      <div class="card-title">Career Totals</div>
      <div style="font-size:.85rem;display:flex;flex-wrap:wrap;gap:14px;">
        <div>⚽ <strong>${p.career.goals||0}</strong> goals</div>
        <div>🅰️ <strong>${p.career.assists||0}</strong> assists</div>
        ${p.career.yellows?`<div>🟨 <strong>${p.career.yellows}</strong></div>`:''}
        ${p.career.reds?`<div>🟥 <strong>${p.career.reds}</strong></div>`:''}
      </div>
    </div>`:''}
  `;

  // Head-to-head breakdown by opponent, most-played first — gives a quick
  // "who do they struggle against" view without digging through every match.
  // Win/loss is taken from the match's own winner field whenever one is set
  // (penalties, or any knockout tie — including a 2-leg tie decided on
  // aggregate) rather than from this leg's own scoreline alone, since a team
  // can lose leg 2 outright but still win the tie on aggregate. Only plain
  // score comparison is used when winner is genuinely unset (a league/group
  // match that ended in a draw).
  const byOpponent = {};
  history.forEach(e=>{
    if(!byOpponent[e.opponentId]) byOpponent[e.opponentId] = {w:0,d:0,l:0};
    const rec = byOpponent[e.opponentId];
    const myScore = e.isHome ? e.m.hScore : e.m.aScore;
    const oppScore = e.isHome ? e.m.aScore : e.m.hScore;
    const decided = e.m.penalties || !!e.m.tieId;
    const myWin = decided ? (e.m.winner===pId) : myScore>oppScore;
    const oppWin = decided ? (e.m.winner===e.opponentId) : oppScore>myScore;
    if(myWin) rec.w++; else if(oppWin) rec.l++; else rec.d++;
  });
  const opponentRows = Object.entries(byOpponent)
    .map(([oppId,rec])=>({oppId, ...rec, total:rec.w+rec.d+rec.l}))
    .sort((a,b)=>b.total-a.total)
    .slice(0,8);
  if(opponentRows.length){
    html += `<div class="card">
      <div class="card-title">Head-to-Head</div>
      ${opponentRows.map(r=>`
        <div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border);font-size:.8rem;">
          <div style="flex:1;font-weight:600;">${name(r.oppId)}</div>
          <div style="color:var(--green);">${r.w}W</div><div style="color:var(--text3);">${r.d}D</div><div style="color:var(--red);">${r.l}L</div>
        </div>`).join('')}
    </div>`;
  }

  html += `<div class="section-header"><div class="section-title">Match History (${history.length})</div></div>`;
  if(!history.length){
    html += `<div class="empty-state"><div>No matches played yet.</div></div>`;
  } else {
    html += history.map(e=>{
      const opp = db.participants.find(x=>x.id===e.opponentId);
      const oppName = opp ? opp.name : 'Unknown';
      const myScore = e.isHome ? e.m.hScore : e.m.aScore;
      const oppScore = e.isHome ? e.m.aScore : e.m.hScore;
      const decided = e.m.penalties || !!e.m.tieId;
      const myWin = decided ? (e.m.winner===pId) : myScore>oppScore;
      const oppWin = decided ? (e.m.winner===e.opponentId) : oppScore>myScore;
      const resultClass = myWin?'fdot-W':oppWin?'fdot-L':'fdot-D';
      const resultLetter = myWin?'W':oppWin?'L':'D';
      // Leg 2 of a two-leg tie: the W/L badge above is based on the
      // aggregate (since a team can lose leg 2 outright but still win the
      // tie), so show the actual aggregate score here too rather than just
      // leg 2's own scoreline, which could otherwise look like it disagrees
      // with the badge.
      let scoreLabel;
      if(e.m.tieId && e.m.legNum===2){
        const t = e.tId ? db.tournaments.find(x=>x.id===e.tId) : null;
        const allRounds = t ? (t.rounds||[]).concat(t.koRounds||[]) : [];
        const leg1 = allRounds.flat().find(x=>x.id===e.m.leg1Id);
        if(leg1){
          const myLeg1Score = e.isHome ? leg1.aScore : leg1.hScore; // legs flip home/away
          const oppLeg1Score = e.isHome ? leg1.hScore : leg1.aScore;
          const myAgg = myLeg1Score + myScore, oppAgg = oppLeg1Score + oppScore;
          scoreLabel = `${myAgg}–${oppAgg} <span style="color:var(--text3);">(agg)</span>${e.m.penalties?' (Pens)':''}`;
        } else {
          scoreLabel = `${myScore}–${oppScore}${e.m.penalties?' (Pens)':''}`;
        }
      } else {
        scoreLabel = e.m.penalties ? `${myScore}–${oppScore} (Pens)` : (e.m.aet?`${myScore}–${oppScore} AET`:`${myScore}–${oppScore}`);
      }
      const onClick = e.kind==='friendly' ? `openFriendlyRecap('${e.m.id}')` : `openRecap('${e.tId}','${e.m.id}','${e.groupId||''}')`;
      return `<div class="match-card played" style="cursor:pointer;display:flex;align-items:center;gap:10px;" onclick="${onClick}">
        <div class="fdot ${resultClass}" style="flex:0 0 auto;">${resultLetter}</div>
        <div style="flex:1;min-width:0;">
          <div style="font-weight:700;font-size:.85rem;">${e.isHome?'vs':'@'} ${oppName}</div>
          <div style="font-size:.68rem;color:var(--text3);">${e.tName}${e.stage?` · ${e.stage}`:''}</div>
        </div>
        <div style="font-weight:800;font-size:.9rem;">${scoreLabel}</div>
      </div>`;
    }).join('');
  }

  app.innerHTML = html;
}

function updateTnFormatUI(){
  const f = document.getElementById('tn-format')?.value;
  const show = id => { const el=document.getElementById(id); if(el) el.classList.remove('hidden'); };
  const hide = id => { const el=document.getElementById(id); if(el) el.classList.add('hidden'); };
  const isKO = f==='knockout'||f==='double_elimination';
  const isLeague = f==='league';
  const isGroupKO = f==='group_knockout';
  const isLeagueKO = f==='league_knockout';
  const hasLeagueStage = isLeague||isGroupKO||isLeagueKO;
  const hasKOStage = isKO||isGroupKO||isLeagueKO;

  // Legs row: show for league stages only; label depends on context
  if(isKO){ hide('tn-legs-row'); }
  else { show('tn-legs-row'); }
  const legsLabel = document.getElementById('tn-legs-label');
  if(legsLabel){
    if(isGroupKO||isLeagueKO) legsLabel.textContent='Group/League Stage — Times Each Team Plays Each Other';
    else legsLabel.textContent='Times Each Team Plays Each Other';
  }

  // KO legs row: show for any format with a knockout bracket, except double
  // elimination (its winners/losers bracket plumbing only supports single
  // matches per slot — see genLosers/advanceDEL).
  if(f==='knockout'||isGroupKO||isLeagueKO) show('tn-ko-legs-row'); else hide('tn-ko-legs-row');

  // League qual highlights: only for pure league
  if(isLeague) show('tn-league-qual-row'); else hide('tn-league-qual-row');

  // Group settings
  if(isGroupKO){ show('tn-groups-row'); show('tn-qualifiers-row'); } else { hide('tn-groups-row'); hide('tn-qualifiers-row'); }

  // League+KO qualification
  if(isLeagueKO) show('tn-lko-qual-row'); else hide('tn-lko-qual-row');

  // Points per win: only relevant for formats with a league stage
  const ptsRow = document.getElementById('tn-pts-row');
  if(ptsRow) ptsRow.classList.toggle('hidden', isKO);

  // Extra time / penalties note: shown for any format with a knockout stage
  const etNote = document.getElementById('tn-et-note');
  if(etNote) etNote.classList.toggle('hidden', !hasKOStage);

  // Third place match: any format that produces semi-finals (single elim,
  // groups+KO, league+KO). Double elimination has its own grand-final
  // structure and doesn't have a clean "two semi losers" concept.
  if(f==='knockout'||isGroupKO||isLeagueKO) show('tn-third-place-row'); else hide('tn-third-place-row');

  // Home advantage: auto-off for pure knockout? No — still show it always
  show('tn-homeadv-row');

  // Populate per-stage leg checkboxes
  populateKOLegStages();

  validateTnSettings();
}

function shuffle(arr){ return [...arr].sort(()=>Math.random()-.5); }

// Populates the per-stage 2-leg checkboxes based on selected participant count + format
function populateKOLegStages(){
  const container = document.getElementById('tn-ko-legs-stages');
  if(!container) return;
  const fmt = document.getElementById('tn-format')?.value;
  const checked = document.querySelectorAll('.p-check:checked').length;
  let koTeams = checked;
  if(fmt==='group_knockout'){ const ng=parseInt(document.getElementById('tn-groups')?.value)||4; const pq=parseInt(document.getElementById('tn-qualifiers')?.value)||2; koTeams=ng*pq; }
  else if(fmt==='league_knockout'){ koTeams=parseInt(document.getElementById('tn-lko-qual')?.value)||4; }
  // Cap at 64 (6 rounds max), floor at 2 for display
  koTeams = Math.min(64, Math.max(2, koTeams||4));
  const numRounds = Math.floor(Math.log2(koTeams));
  let html = '';
  for(let i=0; i<numRounds; i++){
    const isFinal = (i===numRounds-1);
    const prev = document.querySelector(`.ko-stage-check[data-round="${i}"]`);
    const isChecked = prev ? prev.checked : !isFinal;
    const legText = isChecked ? '2 legs' : '1 leg';
    html += `<label class="check-item" style="padding:4px 2px;display:flex;justify-content:space-between;align-items:center;gap:8px;">
      <span><input type="checkbox" class="ko-stage-check" data-round="${i}" ${isChecked?'checked':''} onchange="updateKOLegsInput()"> <span style="font-size:.82rem;">${roundName(i,numRounds)}</span></span>
      <span class="leg-count-tag" data-round="${i}" style="font-size:.7rem;color:var(--text3);white-space:nowrap;">${legText}</span>
    </label>`;
  }
  html += `<div class="form-hint" style="margin:6px 2px 0;">Any round — including the Final — can be single-match or home-and-away. Two legs uses aggregate score to decide the winner.</div>`;
  container.innerHTML = html;
  updateKOLegsInput();
}

// Reads the per-stage checkboxes and writes the summary into #tn-ko-legs as JSON
function updateKOLegsInput(){
  const checks = document.querySelectorAll('.ko-stage-check');
  const stageLegs = {};
  checks.forEach(cb => {
    stageLegs[cb.dataset.round] = cb.checked ? 2 : 1;
    const tag = document.querySelector(`.leg-count-tag[data-round="${cb.dataset.round}"]`);
    if(tag) tag.textContent = cb.checked ? '2 legs' : '1 leg';
  });
  const hidden = document.getElementById('tn-ko-legs');
  if(hidden) hidden.value = JSON.stringify(stageLegs);
}

// Returns the koLegs setting for a specific round index (0=first KO round)
// stageLegs can be a number (legacy: all rounds same) or an object {roundIdx: legs}
function getKOLegsForRound(stageLegs, roundIdx){
  if(typeof stageLegs === 'object' && stageLegs !== null) return stageLegs[roundIdx] || 1;
  return typeof stageLegs === 'number' ? stageLegs : 1;
}

function createTournament(){
  const name = document.getElementById('tn-name').value.trim()||'New Tournament';
  const format = document.getElementById('tn-format').value;
  const pType = document.getElementById('tn-ptype').value;
  const legs = Math.max(1, Math.min(10, parseInt(document.getElementById('tn-legs')?.value)||1));
  let koLegs;
  try { const v = document.getElementById('tn-ko-legs')?.value; koLegs = v && v.startsWith('{') ? JSON.parse(v) : Math.max(1,Math.min(2,parseInt(v)||1)); }
  catch(e){ koLegs = 1; }
  const ptsPerWin = parseInt(document.getElementById('tn-pts-win')?.value)||3;
  const ptsPerDrawRaw = parseInt(document.getElementById('tn-pts-draw')?.value);
  const ptsPerDraw = isNaN(ptsPerDrawRaw) ? 1 : ptsPerDrawRaw;
  const tiebreaker = document.getElementById('tn-tiebreaker')?.value||'gd';
  const seeded = document.getElementById('tn-seeded')?.checked||false;
  const homeAdvantage = document.getElementById('tn-homeadv')?.checked!==false; // default true
  const thirdPlace = document.getElementById('tn-third-place')?.checked||false;
  const selected = Array.from(document.querySelectorAll('.p-check:checked')).map(cb=>cb.value);
  if(selected.length<2) return toast('Select at least 2 participants');
  if(pType==='team'){
    const ineligible = selected
      .map(id=>db.participants.find(p=>p.id===id))
      .filter(p=>p && (p.players||[]).length<4);
    if(ineligible.length){
      return toast(`${ineligible.map(p=>p.name).join(', ')} need${ineligible.length===1?'s':''} at least 4 squad players`);
    }
  }

  // Full settings validation (shared with the live validator under the form)
  const issues = validateTournamentSettings(format, selected.length, {
    numGroups: parseInt(document.getElementById('tn-groups')?.value),
    qualifiedPerGroup: parseInt(document.getElementById('tn-qualifiers')?.value),
    lkoQualSpots: parseInt(document.getElementById('tn-lko-qual')?.value),
  });
  if(issues.length) return toast(issues[0]);

  // Seeded or random ordering
  let ordered;
  if(seeded){
    const rated = selected.filter(id=>{const p=db.participants.find(x=>x.id===id);return p&&p.strengthEnabled&&p.ovr;}).sort((a,b)=>{const pa=db.participants.find(x=>x.id===a),pb=db.participants.find(x=>x.id===b);return (pb.ovr||0)-(pa.ovr||0);});
    const unrated = shuffle(selected.filter(id=>!rated.includes(id)));
    ordered = [...rated,...unrated];
  } else {
    ordered = shuffle(selected);
  }

  const t={
    id:uid(), name, format, type:pType,
    participantIds: selected, legs,
    koLegs, ptsPerWin, ptsPerDraw, tiebreaker, homeAdvantage, thirdPlace,
    champion:null, created:Date.now()
  };

  if(format==='league'){
    t.matches = genRoundRobin(ordered, legs);
    t.standings = initStandings(ordered);
    t.qualificationSpots = Math.max(0, Math.min(ordered.length, parseInt(document.getElementById('tn-league-qual')?.value)||0));
  } else if(format==='knockout'){
    t.rounds = genKnockout(ordered, koLegs);
    if(thirdPlace && ordered.length>=4){
      t.thirdPlaceMatch = {id:uid(),homeId:null,awayId:null,played:false,hScore:0,aScore:0,winner:null,isThirdPlace:true};
    }
  } else if(format==='double_elimination'){
    t.wBracket = genKnockout(ordered);
    t.lBracket = genLosers(ordered.length);
    t.grandFinal = [{id:uid(),homeId:null,awayId:null,played:false,hScore:0,aScore:0,winner:null}];
  } else if(format==='group_knockout'){
    const numGroups = Math.max(2, Math.min(32, parseInt(document.getElementById('tn-groups').value)||4));
    t.groups = genGroups(ordered, numGroups, legs);
    t.koRounds = null;
    t.qualifiedPerGroup = Math.max(1, Math.min(16, parseInt(document.getElementById('tn-qualifiers').value)||2));
    t.koLegs = koLegs;
    if(thirdPlace) t.thirdPlace = true;
  } else if(format==='league_knockout'){
    t.matches = genRoundRobin(ordered, legs);
    t.standings = initStandings(ordered);
    t.lkoQualSpots = Math.max(2, Math.min(ordered.length, parseInt(document.getElementById('tn-lko-qual')?.value)||4));
    t.koRounds = null; // generated after league phase completes
    t.koLegs = koLegs;
    if(thirdPlace) t.thirdPlace = true;
  }

  db.tournaments.push(t);
  save(); activeTournamentId=t.id; activeTab='tournaments'; activeTournamentTab=defaultTabFor(t); render();
  toast('Tournament created!');
}

// Centralized validation for tournament-creation settings, shared between
// the live inline validator (validateTnSettings, called on every keystroke)
// and the final check inside createTournament (so the create button can
// never bypass a rule the live validator would have caught). Returns an
// array of human-readable problem strings; empty array means all good.
function validateTournamentSettings(format, participantCount, opts={}){
  const issues = [];
  const n = participantCount;
  if((format==='knockout'||format==='double_elimination') && !isPow2(n)){
    issues.push(`${format==='knockout'?'Single':'Double'} Elimination needs a power-of-2 field (2, 4, 8, 16…) — you selected ${n}.`);
  }
  if(format==='group_knockout'){
    const numGroups = opts.numGroups;
    const perGroup = opts.qualifiedPerGroup;
    if(!numGroups || numGroups<2) issues.push('Number of groups must be at least 2.');
    else if(numGroups>n) issues.push(`You selected ${numGroups} groups but only have ${n} participants — there aren't enough to fill that many groups.`);
    else if(Math.floor(n/numGroups)<1) issues.push(`${numGroups} groups can't be filled with only ${n} participants.`);
    if(numGroups && numGroups>=2 && numGroups<=n){
      const smallestGroupSize = Math.floor(n/numGroups);
      if(perGroup && smallestGroupSize>=1 && perGroup>smallestGroupSize){
        issues.push(`You can't qualify ${perGroup} team${perGroup===1?'':'s'} per group when the smallest group only has ${smallestGroupSize}.`);
      }
      if(numGroups && perGroup){
        const totalQualifiers = numGroups*perGroup;
        if(totalQualifiers<2) issues.push('At least 2 teams total need to qualify for a knockout stage.');
      }
    }
    if(!perGroup || perGroup<1) issues.push('At least 1 team must qualify per group.');
  }
  if(format==='league_knockout'){
    const qual = opts.lkoQualSpots;
    if(!qual || qual<2) issues.push('At least 2 teams must qualify for the knockout stage.');
    else if(qual>n) issues.push(`You set ${qual} qualifiers but only have ${n} participants in the league.`);
  }
  return issues;
}

// Live validator wired to oninput on the relevant fields — shows an inline
// error under the settings instead of only failing silently at creation time.
function validateTnSettings(){
  const errEl = document.getElementById('tn-validation-error');
  const groupsHint = document.getElementById('tn-groups-hint');
  const qualHint = document.getElementById('tn-qualifiers-hint');
  if(!errEl) return;
  const format = document.getElementById('tn-format')?.value;
  const ptype = document.getElementById('tn-ptype')?.value || 'team';
  const n = document.querySelectorAll('.p-check:checked').length || db.participants.filter(p=>p.type===ptype).length;
  const issues = validateTournamentSettings(format, n, {
    numGroups: parseInt(document.getElementById('tn-groups')?.value),
    qualifiedPerGroup: parseInt(document.getElementById('tn-qualifiers')?.value),
    lkoQualSpots: parseInt(document.getElementById('tn-lko-qual')?.value),
  });
  if(groupsHint){
    const numGroups = parseInt(document.getElementById('tn-groups')?.value)||0;
    groupsHint.textContent = numGroups>0 ? `${numGroups} groups across ${n} selected participant${n===1?'':'s'} ≈ ${(n/numGroups).toFixed(1)} per group.` : '';
  }
  if(qualHint){
    const numGroups = parseInt(document.getElementById('tn-groups')?.value)||0;
    const perGroup = parseInt(document.getElementById('tn-qualifiers')?.value)||0;
    qualHint.textContent = (numGroups>0&&perGroup>0) ? `${numGroups*perGroup} team${numGroups*perGroup===1?'':'s'} total advance to the knockout stage.` : '';
  }
  if(issues.length){
    errEl.textContent = '⚠ '+issues[0];
    errEl.classList.remove('hidden');
  } else {
    errEl.classList.add('hidden');
  }
}

function updateSeasonModalFormatUI(){
  const f = document.getElementById('sm-format')?.value;
  const show = id => { const el=document.getElementById(id); if(el) el.classList.remove('hidden'); };
  const hide = id => { const el=document.getElementById(id); if(el) el.classList.add('hidden'); };
  const isKO = f==='knockout'||f==='double_elimination';
  const isLeague = f==='league';
  const isGroupKO = f==='group_knockout';
  const isLeagueKO = f==='league_knockout';
  const hasKOStage = isKO||isGroupKO||isLeagueKO;

  if(isKO) hide('sm-legs-row'); else show('sm-legs-row');
  const legsLabel = document.getElementById('sm-legs-label');
  if(legsLabel) legsLabel.textContent = (isGroupKO||isLeagueKO) ? 'Group/League Stage — Times Each Team Plays Each Other' : 'Times Each Team Plays Each Other';

  if(f==='knockout'||isGroupKO||isLeagueKO) show('sm-ko-legs-row'); else hide('sm-ko-legs-row');
  if(isLeague) show('sm-league-qual-row'); else hide('sm-league-qual-row');
  if(isGroupKO){ show('sm-groups-row'); show('sm-qualifiers-row'); } else { hide('sm-groups-row'); hide('sm-qualifiers-row'); }
  if(isLeagueKO) show('sm-lko-qual-row'); else hide('sm-lko-qual-row');
  const ptsRow = document.getElementById('sm-pts-row');
  if(ptsRow) ptsRow.classList.toggle('hidden', isKO);
  const etNote = document.getElementById('sm-et-note');
  if(etNote) etNote.classList.toggle('hidden', !hasKOStage);
  if(f==='knockout'||isGroupKO||isLeagueKO) show('sm-third-place-row'); else hide('sm-third-place-row');

  populateSMKOLegStages();
  validateSeasonModal();
}

function populateSMKOLegStages(){
  const container = document.getElementById('sm-ko-legs-stages');
  if(!container) return;
  const fmt = document.getElementById('sm-format')?.value;
  const n = document.querySelectorAll('.sm-p-check:checked').length;
  let koTeams = n;
  if(fmt==='group_knockout'){ const ng=parseInt(document.getElementById('sm-groups')?.value)||4; const pq=parseInt(document.getElementById('sm-qualifiers')?.value)||2; koTeams=ng*pq; }
  else if(fmt==='league_knockout'){ koTeams=parseInt(document.getElementById('sm-lko-qual')?.value)||4; }
  koTeams = Math.min(64, Math.max(2, koTeams||4));
  const numRounds = Math.floor(Math.log2(koTeams));
  let html='';
  for(let i=0;i<numRounds;i++){
    const isFinal=(i===numRounds-1);
    const prev=document.querySelector(`.sm-ko-stage-check[data-round="${i}"]`);
    const isChecked=prev?prev.checked:!isFinal;
    const legText = isChecked ? '2 legs' : '1 leg';
    html+=`<label class="check-item" style="padding:4px 2px;display:flex;justify-content:space-between;align-items:center;gap:8px;">
      <span><input type="checkbox" class="sm-ko-stage-check" data-round="${i}" ${isChecked?'checked':''} onchange="updateSMKOLegsInput()"> <span style="font-size:.82rem;">${roundName(i,numRounds)}</span></span>
      <span class="sm-leg-count-tag" data-round="${i}" style="font-size:.7rem;color:var(--text3);white-space:nowrap;">${legText}</span>
    </label>`;
  }
  html += `<div class="form-hint" style="margin:6px 2px 0;">Any round — including the Final — can be single-match or home-and-away. Two legs uses aggregate score to decide the winner.</div>`;
  container.innerHTML=html;
  updateSMKOLegsInput();
}

function updateSMKOLegsInput(){
  const checks=document.querySelectorAll('.sm-ko-stage-check');
  const stageLegs={};
  checks.forEach(cb=>{
    stageLegs[cb.dataset.round]=cb.checked?2:1;
    const tag=document.querySelector(`.sm-leg-count-tag[data-round="${cb.dataset.round}"]`);
    if(tag) tag.textContent = cb.checked ? '2 legs' : '1 leg';

  if(hidden) hidden.value=JSON.stringify(stageLegs);

// Detects a trailing "Season N" (or "S2", "Season 2", etc.) in a tournament
// name and returns the next one — "Sunday League" becomes "Sunday League
// Season 2", "Sunday League Season 2" becomes "Sunday League Season 3" —
// so repeated use doesn't pile up "Season 2 Season 2 Season 2".
function nextSeasonName(name){
  const m = name.match(/^(.*)\bSeason\s+(\d+)\s*$/i);
  if(m) return `${m[1].trim()} Season ${parseInt(m[2],10)+1}`;
  return `${name} Season 2`;
}

function isPow2(n){ return n>0&&(n&(n-1))===0; }

// Actually creates the new season once the person confirms the (editable)
// settings sheet — every field is read live from the modal rather than
// blindly cloned from the previous season.
function confirmStartNextSeason(prevTId){
  const prev = db.tournaments.find(x=>x.id===prevTId);
  if(!prev) return;
  const name = document.getElementById('sm-name')?.value.trim() || nextSeasonName(prev.name);
  const format = document.getElementById('sm-format')?.value || prev.format;
  const carriedIds = Array.from(document.querySelectorAll('.sm-p-check:checked')).map(cb=>cb.value);
  const legs = Math.max(1, Math.min(10, parseInt(document.getElementById('sm-legs')?.value)||1));
  let koLegs; try{const v=document.getElementById('sm-ko-legs')?.value;koLegs=v&&v.startsWith('{')?JSON.parse(v):Math.max(1,Math.min(2,parseInt(v)||1));}catch(e){koLegs=1;}
  const ptsPerWin = parseInt(document.getElementById('sm-pts-win')?.value)||3;
  const ptsPerDrawRaw = parseInt(document.getElementById('sm-pts-draw')?.value);
  const ptsPerDraw = isNaN(ptsPerDrawRaw) ? 1 : ptsPerDrawRaw;
  const tiebreaker = document.getElementById('sm-tiebreaker')?.value||'gd';
  const homeAdvantage = document.getElementById('sm-homeadv')?.checked!==false;
  const thirdPlace = document.getElementById('sm-third-place')?.checked||false;

  if(carriedIds.length<2){ toast('Select at least 2 participants'); return; }

  const issues = validateTournamentSettings(format, carriedIds.length, {
    numGroups: parseInt(document.getElementById('sm-groups')?.value),
    qualifiedPerGroup: parseInt(document.getElementById('sm-qualifiers')?.value),
    lkoQualSpots: parseInt(document.getElementById('sm-lko-qual')?.value),
  });
  if(issues.length){ toast(issues[0]); return; }

  const ordered = shuffle(carriedIds);
  const droppedCount = prev.participantIds.length - carriedIds.length;

  const nt = {
    id: uid(), name, format, type: prev.type,
    participantIds: carriedIds, legs, koLegs, thirdPlace,
    ptsPerWin, ptsPerDraw, tiebreaker, homeAdvantage,
    champion: null, created: Date.now(), previousSeasonId: prev.id
  };

  if(format==='league'){
    nt.matches = genRoundRobin(ordered, legs);
    nt.standings = initStandings(ordered);
    nt.qualificationSpots = Math.max(0, Math.min(ordered.length, parseInt(document.getElementById('sm-league-qual')?.value)||0));
  } else if(format==='knockout'){
    nt.rounds = genKnockout(ordered, koLegs);
    if(thirdPlace && ordered.length>=4){
      nt.thirdPlaceMatch = {id:uid(),homeId:null,awayId:null,played:false,hScore:0,aScore:0,winner:null,isThirdPlace:true};
    }
  } else if(format==='double_elimination'){
    nt.wBracket = genKnockout(ordered);
    nt.lBracket = genLosers(ordered.length);
    nt.grandFinal = [{id:uid(),homeId:null,awayId:null,played:false,hScore:0,aScore:0,winner:null}];
  } else if(format==='group_knockout'){
    const numGroups = Math.max(2, Math.min(32, parseInt(document.getElementById('sm-groups')?.value)||4));
    nt.groups = genGroups(ordered, numGroups, legs);
    nt.koRounds = null;
    nt.qualifiedPerGroup = Math.max(1, Math.min(16, parseInt(document.getElementById('sm-qualifiers')?.value)||2));
    nt.koLegs = koLegs;
  } else if(format==='league_knockout'){
    nt.matches = genRoundRobin(ordered, legs);
    nt.standings = initStandings(ordered);
    nt.lkoQualSpots = Math.max(2, Math.min(ordered.length, parseInt(document.getElementById('sm-lko-qual')?.value)||4));
    nt.koRounds = null;
    nt.koLegs = koLegs;
  }

  db.tournaments.push(nt);
  closeSeasonModal();
  save(); activeTournamentId=nt.id; activeTab='tournaments'; activeTournamentTab=defaultTabFor(nt); render();
  toast(droppedCount>0
    ? `${nt.name} created — ${droppedCount} participant${droppedCount===1?'':'s'} couldn't be carried forward`
    : `${nt.name} created!`);
}

function genRoundRobin(ids, legs=1){
  // Circle method: produces balanced rounds where every team plays exactly
  // once per round (or sits out, if there's an odd number of teams). This
  // gives every match a real `round` number so "Matchday 1" must finish
  // before "Matchday 2" unlocks. Each additional leg is a clean later block
  // of rounds with home/away flipped from the previous leg, alternating so
  // no team gets stuck always-home or always-away across odd leg counts.
  let teams = [...ids];
  const bye = teams.length % 2 !== 0 ? '__BYE__' : null;
  if(bye) teams.push(bye);
  const n = teams.length;
  const roundsCount = n - 1;
  const half = n / 2;
  const baseMatches = [];
  let arr = [...teams];
  for(let r=0; r<roundsCount; r++){
    for(let i=0; i<half; i++){
      const home = arr[i], away = arr[n-1-i];
      if(home!==bye && away!==bye){
        baseMatches.push({homeId:home, awayId:away, round:r+1});
      }
    }
    arr = [arr[0], arr[n-1], ...arr.slice(1, n-1)];
  }
  // Cap matches the "Times Each Team Plays Each Other" input's max (10) —
  // keep these in sync if that input's max ever changes.
  const totalLegs = Math.max(1, Math.min(10, legs|0 || 1));
  const matches = [];
  for(let leg=0; leg<totalLegs; leg++){
    const flip = leg % 2 === 1; // alternate home/away each leg
    baseMatches.forEach(bm=>{
      matches.push({
        id:uid(),
        homeId: flip ? bm.awayId : bm.homeId,
        awayId: flip ? bm.homeId : bm.awayId,
        played:false, hScore:0, aScore:0, stats:null,
        round: bm.round + leg*roundsCount
      });
    });
  }
  return matches;
}

function initStandings(ids){
  return ids.map(id=>({teamId:id,p:0,w:0,d:0,l:0,gf:0,ga:0,gd:0,pts:0,cs:0}));
}

function genKnockout(ids, stageLegs=1){
  // stageLegs: number (all same) or object {roundIdx: 1|2}
  const rounds=[];
  const totalKORounds = Math.floor(Math.log2(ids.length)); // e.g. 8 teams = 3 rounds

  function makeFirstRound(participants, roundIdx){
    const legs = getKOLegsForRound(stageLegs, roundIdx);
    let current = [];
    for(let i=0;i<participants.length;i+=2){
      const tId = uid();
      if(legs===2){
        current.push({id:uid(),homeId:participants[i],awayId:participants[i+1],played:false,hScore:0,aScore:0,winner:null,stats:null,aet:false,penalties:false,penH:0,penA:0,tieId:tId,legNum:1});
      } else {
        current.push({id:uid(),homeId:participants[i],awayId:participants[i+1],played:false,hScore:0,aScore:0,winner:null,stats:null,aet:false,penalties:false,penH:0,penA:0});
      }
    }
    if(legs===2){
      const secondLegs = current.map(m=>({
        id:uid(),homeId:m.awayId,awayId:m.homeId,played:false,hScore:0,aScore:0,winner:null,stats:null,aet:false,penalties:false,penH:0,penA:0,
        tieId:m.tieId,legNum:2,leg1Id:m.id
      }));
      current.forEach(m=>{ m.leg2Id = secondLegs.find(s=>s.tieId===m.tieId)?.id; });
      rounds.push(current);
      rounds.push(secondLegs);
    } else {
      rounds.push(current);
    }
    return current.length; // number of matches = winners advancing to next round
  }

  let advancing = makeFirstRound(ids, 0);
  let roundIdx = 1;

  while(advancing > 1){
    const legs = getKOLegsForRound(stageLegs, roundIdx);
    const size = advancing; // each match in previous round produces 1 winner
    const matchCount = Math.floor(size / 2);
    if(legs===2){
      const r1=[], r2=[];
      for(let i=0;i<matchCount;i++){
        const tId=uid();
        const m1={id:uid(),homeId:null,awayId:null,played:false,hScore:0,aScore:0,winner:null,stats:null,aet:false,penalties:false,penH:0,penA:0,tieId:tId,legNum:1};
        const m2={id:uid(),homeId:null,awayId:null,played:false,hScore:0,aScore:0,winner:null,stats:null,aet:false,penalties:false,penH:0,penA:0,tieId:tId,legNum:2,leg1Id:m1.id};
        m1.leg2Id=m2.id;
        r1.push(m1); r2.push(m2);
      }
      rounds.push(r1);
      rounds.push(r2);
      advancing = matchCount;
    } else {
      const r=[];
      for(let i=0;i<matchCount;i++) r.push({id:uid(),homeId:null,awayId:null,played:false,hScore:0,aScore:0,winner:null,stats:null,aet:false,penalties:false,penH:0,penA:0});
      rounds.push(r);
      advancing = matchCount;
    }
    roundIdx++;
    if(advancing <= 1) break;
  }
  return rounds;
}

function genLosers(n){
  // Standard double-elimination loser bracket for n participants (n is a power of 2).
  // Each "drop" round match has two fixed roles: a slot for an incoming new
  // WB loser (home) and a slot for a survivor of the previous LB round (away).
  // The very first drop round has no survivors yet, so both slots take new losers.
  const wRounds = Math.log2(n);
  const rounds=[];
  if(wRounds<2) return rounds; // 2-participant bracket has no meaningful loser bracket

  // LB Round 0 (drop): WB round-0 losers (n/2 of them) paired up -> n/4 matches.
  // Both slots are "new loser" slots here (no survivors exist yet).
  let r0=[];
  for(let k=0;k<Math.max(1,n/4);k++) r0.push(mkLBMatch(true,0));
  rounds.push(r0);
  let prevSurvivors = r0.length; // each match produces exactly 1 survivor

  for(let wr=1; wr<wRounds; wr++){
    const newLosersCount = n/Math.pow(2,wr+1); // losers produced by WB round wr
    const dropCount = Math.max(prevSurvivors, newLosersCount, 1);
    const dropRound=[];
    for(let k=0;k<dropCount;k++) dropRound.push(mkLBMatch(true, wr));
    rounds.push(dropRound);
    prevSurvivors = dropRound.length;

    if(prevSurvivors>1 && wr<wRounds-1){
      const survCount = Math.ceil(prevSurvivors/2);
      const survRound=[];
      for(let k=0;k<survCount;k++) survRound.push(mkLBMatch(false, -1));
      rounds.push(survRound);
      prevSurvivors = survRound.length;
    }
  }
  return rounds;
}
function mkLBMatch(isDrop, wbRound){
  return {id:uid(),homeId:null,awayId:null,played:false,hScore:0,aScore:0,winner:null,loser:null,stats:null,lbDrop:isDrop,wbRound:wbRound,filled:0};
}

function genGroups(ids, numGroups, legs=1){
  const groups=[];
  for(let g=0;g<numGroups;g++){
    groups.push({id:uid(), name:`Group ${String.fromCharCode(65+g)}`, teamIds:[], matches:[], standings:[]});
  }
  ids.forEach((id,i)=>{ const g=groups[i%numGroups]; g.teamIds.push(id); });
  groups.forEach(g=>{
    g.standings=initStandings(g.teamIds);
    g.matches=genRoundRobin(g.teamIds,legs);
  });
  return groups;
}

  const t = db.tournaments.find(x=>x.id===tId);

  // Tabs based on format
  const tabs = getTournamentTabs(t);

  let html=`
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;">
      <button class="btn btn-outline btn-sm btn-icon" onclick="activeTournamentId=null;render();">←</button>

        <div style="font-weight:800;font-size:1rem;">${t.name}</div>
        <div style="font-size:.7rem;color:var(--text3);">${formatLabel(t.format)} · ${t.participantIds.length} ${t.type==='team'?'teams':'players'}</div>
      </div>
      <button class="btn btn-danger btn-sm" onclick="deleteTournament('${tId}')">✕</button>
    </div>
    ${champ?`<div class="card" style="text-align:center;background:linear-gradient(135deg,#2a200a,#1a1508);border-color:var(--gold);margin-bottom:12px;padding:18px;">
      <div style="font-size:2rem;">🏆</div><div style="font-weight:900;font-size:1.1rem;color:var(--gold);">${champ.name}</div>
      <div style="font-size:.75rem;color:var(--text3);margin-top:3px;">${t.name} Champion</div>
      <button class="btn btn-outline btn-sm" style="margin-top:12px;" onclick="startNextSeason('${tId}')">🔁 Start Next Season</button>
    </div>`:''}
    <div class="inner-tabs">
      ${tabs.map(tab=>`<button class="inner-tab ${activeTournamentTab===tab?'active':''}" onclick="activeTournamentTab='${tab}';render();">${tabLabel(tab)}</button>`).join('')}
    </div>
  `;

  if(activeTournamentTab==='overview') html += renderTournamentOverview(t);
  else if(activeTournamentTab==='fixtures') html += renderFixtures(t);
  else if(activeTournamentTab==='standings') html += renderStandings(t);
  else if(activeTournamentTab==='bracket') html += renderBracket(t);
  else if(activeTournamentTab==='groups') html += renderGroups(t);
